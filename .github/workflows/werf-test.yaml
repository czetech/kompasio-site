name: werf test
on:
  push: {}
permissions:
  contents: read
  packages: write
jobs:
  image:
    name: Build image
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
    - name: Generate Version Tag
      id: versioning
      run: |
        BASE_VERSION=$(jq -r '.version' ./package.json)
        CHART_NAME=$(yq e '.name' ./chart/Chart.yaml)
        TIMESTAMP=$(date -u +'%Y%m%d%H%M%S')
        SHA=$(echo "${{ github.sha }}" | cut -c1-7)
        VERSION="${BASE_VERSION}-${TIMESTAMP}-${SHA}"
        #echo "version=${VERSION}" >> $GITHUB_OUTPUT
        echo "version=0.1.2" >> $GITHUB_OUTPUT
        echo "chart_name=${CHART_NAME}" >> $GITHUB_OUTPUT
        echo "Generated Version: ${VERSION}"
        echo "Chart Name: ${CHART_NAME}"
    - name: Log in to GitHub Container Registry
      uses:
        docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772  # v3.4.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - uses: werf/actions/install@v2
    - run: |
        echo "$(werf ci-env gitlab --as-file)"
        source "$(werf ci-env gitlab --as-file)"
        werf bundle publish --repo ghcr.io/czetech/kompasio-site-werf --tag="${{ steps.versioning.outputs.version }}"
