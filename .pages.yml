media:
  - name: images
    label: Images
    input: src/assets/images
    output: /images
    extensions:
      - apng
      - avif
      - gif
      - jpeg
      - jpg
      - png
      - svg
      - webp
  - name: article_images
    label: Article images
    input: public/images
    output: /images
    extensions:
      - apng
      - avif
      - gif
      - jpeg
      - jpg
      - png
      - svg
      - webp
content:
  - name: global
    label: Global
    type: file
    path: content/global.yaml
    fields:
      - name: metaTitle
        label: Meta Title
        description: Title used in site metadata.
        type: text
        required: true
      - name: metaDescription
        label: Meta Description
        description: Description used in site metadata (max 160 characters).
        type: text
        required: true
      - name: meta Keywords
        label: Meta Keywords
        description: Keywords used in site metadata.
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{fields.title}"
        fields:
          - name: keyword
            label: Keyword
            description: Keyword used in site metadata.
            type: text
            required: true
      - name: navItemPlaces
        label: Nav Item Places
        description: Places text in primary navigation.
        type: text
        required: true
      - name: navItemGuides
        label: Nav Item Guides
        description: Guides text in primary navigation.
        type: text
        required: true
      - name: navItemContact
        label: Nav Item Contact
        description: Contact text in primary navigation.
        type: text
        required: true
      - name: navItemDonate
        label: Nav Item Donate
        description: Donate text in primary navigation.
        type: text
        required: true
      - name: navItemTerms
        label: Nav Item Terms
        description: Terms text in secondary navigation.
        type: text
        required: true
      - name: navItemGdpr
        label: Nav Item GDPR
        description: GDPR text in secondary navigation.
        type: text
        required: true
      - name: searchPlaceholder
        label: Search Placeholder
        description: Search placeholder text.
        type: text
        required: true
  - name: landing
    label: Landing
    type: file
    path: content/landing.yaml
    fields:
      - name: heroTitle
        label: Hero Title
        description: Landing hero title.
        type: text
        required: true
      - name: heroImage
        label: Hero Image
        description: Landing hero image in original dimensions with a minimum size of 258x16px.
        type: image
        required: true
        options:
          media: images
      - name: cards
        label: Cards
        description: Landing card.
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{fields.title}"
        fields:
          - name: title
            label: Title
            description: Card title.
            type: text
            required: true
          - name: url
            label: URL
            description: Card destination URL.
            type: text
            required: true
          - name: color
            label: Color
            description: Card color.
            type: select
            default: white
            options:
              values:
                - value: blue
                  label: Blue
                - value: orange
                  label: Orange
                - value: white
                  label: White
          - name: image
            label: Image
            description: >-
              Card image in original dimensions with a minimum size of 623x16px.
              (landscape).
            type: image
            options:
              media: images
          - name: description
            label: Description
            description: Short card description.
            type: rich-text-lite
            options:
              media: false
    format: yaml
  - name: guides
    label: Guides
    type: file
    path: content/guides.yaml
    fields:
      - name: featured
        label: Featured
        description: Featured journeys.
        type: reference
        options:
          collection: guides_journeys
          multiple: true
          search: title
          value: "{uuid}"
          label: "{title}"
    format: yaml
  - name: guides_categories
    label: Guides - Categories
    type: collection
    path: content/guides_categories
    fields:
      - name: title
        label: Title
        description: Category name.
        type: text
        required: true
      - name: description
        label: Description
        description: Short category description.
        type: rich-text-lite
        options:
          media: false
      - name: uuid
        type: uuid
        hidden: true
    filename: "{primary}.yaml"
    view:
      fields:
        - title
        - description
      sort:
        - title
      search:
        - title
    format: yaml
    subfolders: false
  - name: guides_journeys
    label: Guides - Journeys
    type: collection
    path: content/guides_journeys
    fields:
      - name: title
        label: Title
        description: Journey name.
        type: text
        required: true
      - name: active
        label: Active
        description: Journey is published.
        type: boolean
      - name: category
        label: Category
        description: Journey category.
        type: reference
        required: true
        options:
          collection: guides_categories
          search: title
          value: "{uuid}"
          label: "{title}"
      - name: type
        label: Type
        description: Knowledge or journey.
        type: select
        required: true
        options:
          values:
            - value: knowledge
              label: Knowledge
            - value: journey
              label: Journey
      - name: description
        label: Description
        description: Short journey description.
        type: rich-text-lite
        options:
          media: false
      - name: steps
        label: Steps
        description: Journey step.
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{index} - {fields.title}"
        required: true
        fields:
          - name: title
            label: Title
            description: Step name.
            type: text
            required: true
          - name: body
            label: Body
            description: Step body.
            type: rich-text-full
            required: true
            options:
              media: article_images
          - name: tasks
            label: Tasks
            description: Step task.
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{fields.body}"
            fields:
              - name: body
                label: Body
                description: Task body.
                type: text
                required: true
              - name: uuid
                type: uuid
                hidden: true
          - name: uuid
            type: uuid
            hidden: true
      - name: uuid
        type: uuid
        hidden: true
    filename: "{primary}.yaml"
    view:
      fields:
        - title
        - active
        - description
      sort:
        - title
      search:
        - title
    format: yaml
    subfolders: false
  - name: contact
    label: Contact
    type: file
    path: content/contact.yaml
    fields:
      - name: title
        label: Title
        description: Contact title.
        type: text
        required: true
      - name: body
