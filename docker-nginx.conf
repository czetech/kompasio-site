error_log stderr;
worker_processes auto;

events {
}

http {
  include /etc/nginx/mime.types;
  access_log /dev/stdout;
  server {
    listen 80;
    listen [::]:80;
    root /usr/share/nginx/html;
    location = / {
      return 302 /navody;
    }
    location ~ ^(.+)/$ {
      return 301 $1;
    }
    location / {
      try_files $uri $uri/index.html =404;
    }
  }
}
