title: Praktické tipy - zdieľané poznanie
description: >-
  **Tento živý zoznam tipov tvoríme spoločne.**  

  Zdieľajte, čo vám funguje v triede, škole, rodine či komunite.  

  Pomôžte vytvoriť praktický a otvorený zdroj, ktorý pomôže ďalším – pedagógom,
  asistentom, rodičom... a hlavne deťom. ❤️**Každý tip môže pomôcť ďalším.**
