title: Praktické tipy - zdieľané poznanie
description: >-
  ### Táto sekcia vzniká ako spoločný priestor pre výmenu skúseností, nápadov a
  osvedčených stratégií, ktoré môžu pomôcť deťom na autistickom spektre.


  Nejde o hotový manuál - je to živý zoznam tipov, ktorý sa postupne rozrastá,
  upravuje a dopĺňa na základe toho, čo funguje priamo v praxi.  

  **Tvorcami ste vy všetci - pretože veríme v silu zdieľaného poznania.**


  Pridajte sa a napíšte nám vaše tipy, nápady, alebo aj malé zlepšenia, ktoré sa
  osvedčili vo vašej triede, škole, rodine či komunite.


  Spoločne môžeme vytvoriť praktický, voľne dostupný a zdieľateľný zoznam, ktorý
  pomôže ďalším pedagógom, asistentom, rodičom – **ale hlavne deťom.** ❤️
