title: |
  Nie je to tvoja vina. 
category: 0672d6e8-1771-46a1-9520-42437b3f2026
type: knowledge
description: Keď si rodič dieťaťa s autizmom a svet hovorí „z toho vyrastie“
steps:
  - title: "Niečo sa deje... ale nikto ti neverí "
    body: >-
      Začína to nenápadne. Dieťa nepozerá do očí (a možno aj pozerá), nezapája
      sa k ostatným ( alebo rovno od nich uteká). Intuícia ti hovorí že **niečo
      tu nesedí.**


      Lenže keď to povieš nahlas, reakcie bývahú ako cez kopírku:


      *   "Prosím ťa, veď to je normálne, veď je ešte malý."
          
      *   "Veď je chalana, chalani sú lenivý, to je jednoducho fakt!"
          
      *   "Z toho vyrastie, má čas".
          
      *   "Aj ja som začala hovoriť skoro až v škole, to príde".
          

      Čerešničkou na torte je, ak sa opýtaš odborníka ( napr. pediatra,
      logopéda) a tí namiesto toho, aby ťa poslali k špecialistom, ťa uistia, že
      je ešte malý / malá a všetko príde.


      Na jednej strane ťa to upokojí. Na druhej strane začneš pochybovať. Aj o
      sebe.  

      **Toto je moment, kedy rodič zostáva sám - proti okoliu, proti neistoti,
      často proti systému.**
