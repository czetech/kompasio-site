title: Nie je to tvoja vina. Ani nikdy nebola.
category: 0672d6e8-1771-46a1-9520-42437b3f2026
type: knowledge
description: Keď si rodič dieťaťa s autizmom a svet hovorí „Z toho vyrastie.“
steps:
  - title: "Niečo sa deje... ale nikto ti neverí "
    body: >-
      Začína to nenápadne. Dieťa nepozerá do očí (a možno aj pozerá), nezapája
      sa k ostatným (alebo rovno od nich uteká). Intuícia ti hovorí že **niečo
      tu nesedí.**


      Lenže keď to povieš nahlas, reakcie bývajú ako cez kopírku:


      *   "Prosím ťa, veď to je normálne, veď je ešte malý."
          
      *   "Veď je chalan, chalani sú leniví!"
          
      *   "Z toho vyrastie, má čas. Vy už by ste chceli, aby ako dvojročný vedel
      čítať počítať a násobiť."
          
      *   "Aj ja som začala hovoriť skoro až v škole, to príde".
          

      Čerešničkou na torte je, ak sa opýtaš odborníka (napr. pediatra, logopéda)
      a tí namiesto toho, aby ťa poslali k špecialistom, ťa uistia, že je ešte
      malý/malá a že má čas.


      Na jednej strane ťa to upokojí.  

      Na druhej strane začneš pochybovať. Aj o sebe.  
        
      **Toto je moment, kedy rodič zostáva sám - proti okoliu, proti neistote,
      často proti systému.**
    uuid: 7e0623e7-5759-4c66-adda-294fefbee82c
  - title: "Čo mám teda robiť? "
    body: >-
      V dnešnej dobe existuje mnoho zdrojov, z ktorých čerpať.  

      Nevieme, v akom veku je Vaše dieťa – ale vieme, že **pochybnosti, otázky a
      neistota** sú častou súčasťou tohto procesu.


      ### 🧩 Prvé prejavy – a že ich nie je málo


      V tomto článku sme spísali [25 najčastejších prejavov
      autizmu.](https://modrahliadka.sk/prejavy-autizmu-u-deti/?gad_source=1&gad_campaignid=20501408368&gbraid=0AAAAApp6I5pWF5JL7dTABuXIoi_pllCBg&gclid=Cj0KCQjwxL7GBhDXARIsAGOcmINToZPVidrTcu0iV8LWERM_dg2QRZa60XQA7SDVA4zTu0dTvCW1REgaAq1lEALw_wcB)  

      Nezabúdajte:


      *   nemusia sa objaviť všetky,
          
      *   rôzne vývojové stupne znamenajú častokrát aj rozdielne príznaky.  
          To, čo robilo dieťa v dvoch rokoch, nemusí robiť v štyroch rokoch.

          
      *   Zároveň, ako štvorročné môže zápasiť úplne s inými vecami,
          
      *   u starších detí môžu byť prejavy menej viditeľné, alebo"maskované".
          

      ### 📲 Online nástroj (vek dieťaťa 11–30 mesiaocov)


      Existuje **online aplikácia**, ktorá vás pomocou videí a otázok prevedie
      hodnotením.  

      Pomôže vám lepšie pochopiť, či Vaše dieťa vykazuje znaky autizmu.  

      👉Nech sa páči, tu je
      [link.](https://kompasio.sk/app/sk/map/zoznam/on-line/on-line/asdetect)


      ### 💬 Psychológ – prvá osoba, ktorá vás začne počúvať


      Ak máte pochybnosti, ale váhate, či ich „nezveličujete“, **neváhajte sa
      obrátiť na psychológa**.  

      Nemusíte so sebou hneď brať dieťa. Nemusíte mať vôbec istotu o tom, že ide
      o autizmus.  

      Stačí prísť a povedať:


      > „Niečo ma trápi. Niečo mi nesedí. Mám podozrenie.“


      Psychológ, ktorý má skúsenosť s autizmom:


      *   vás **vypočuje** bez bagatelizovania,
          
      *   možno už z vašich slov spozná, že ide o viac než len „obdobie“,
          
      *   a nasmeruje vás ďalej – k diagnostike, špecialistom, alebo len k
      porozumeniu.
          

      A čo je najdôležitejšie:  

      **začne vás počúvať**. Nie zľahčovať, nie presviedčasť. Počuť.
    uuid: 4f1b04f8-ef68-41fd-bee4-3fc40f561ec0
  - title: |
      Dva silné momenty
    body: >-
      *   **Prvý moment beznádeje**:  
          Keď cítite, že niečo nie je v poriadku – ale nikto vám neverí. Ani rodina, ani lekári, ani známi. Ostávate v tom sami. Začnete pochybovať už aj o sebe.

          
      *   **Druhý silný moment**:  
          Keď prídete k psychológovi a **po prvý raz po dlhom čase máte pocit, že vás niekto počúva. Že niekto je na vašej strane.**

          

      Psychológ sa stáva Vašou kotvou a oporným múrom.  

      Mnoho rodičov práve po tejto návšteve prvýkrát pocíti úľavu.


      ### 🧠 Pochybnosti ≠ diagnóza


      To, že vyhľadáte psychológa, **neznamená,** že vaše dieťa má diagnózu.  

      Znamená to jediné: že vám záleží.  

      Chcete sa **uistiť, že je všetko v poriadku**.


      Psychológ vás môže:


      *   upokojiť,
          
      *   nasmerovať k ďalším odborníkom,
          
      *   alebo odporučiť diagnostiku dieťaťa - ak má dôvod.
          

      A ešte jedna dôležitá vec:  

      **Neplatí pravidlo: „Ak idem na diagnostiku, určite odídem s
      diagnózou.“**  

      Nie. Tak to nefunguje.  

      **Diagnostika je proces, nie pečiatka.**
    uuid: 7b6fa01d-72c0-495b-a1d8-3a832748cfa2
  - title: Pochybnosti sú prirodzené. Overenie nie je panika.
    body: >-
      ### 🔄 Overovanie nie je zveličovanie


      Pozrime sa na to inak.  

      Máte pochybnosti v bežnom živote?  

      Overíte si ich.


      *   Neviete, kedy je porada? Pozriete do kalendára.
          
      *   Nie ste si istí výpočtom? Otvoríte Excel a prepočítate to.
          
      *   Počujete zvláštny zvuk v aute? Zastavíte a skontrolujete.
          

      **Tak prečo by to malo byť iné, keď ide o vaše dieťa?**


      ➡️ Máte pochybnosti?  

      ➡️ Tak ich overte.


      To nie je panika.  

      To je zodpovednosť.  

      To je rodičovstvo.


      * * *


      ### 💬 A ak vám niekto tvrdí, že „to preháňate“...


      Spomeňte si na túto vetu:


      > **Kľúčom k zbaveniu sa pochybností je ich overenie.**


      Nie presviedčanie seba samého, že „všetko bude ok“.  

      Nie čakanie, že „z toho vyrastie“.  

      Nie ignorovanie intuície.


      Ale pokojné, praktické overenie.


      ### **🚨 Na zamyslenie**


      Čo ak sa prebudím o 4 roky neskôr a zistím, že dieťa z toho nevyrástlo?  

      Už 4 roky som mohla pracovať s dieťaťom, učiť ho stratégie, ktoré mu
      pomáhajú fungovať v tomto svete...
    uuid: 33ceb8d4-a03c-43b0-bfd4-08c5c5734cea
  - title: '"Chladné matky“ – škodlivý mýtus z minulosti'
    body: >-
      Rodičia sa mnohokrát obviňujú a cítia vinu:


      *   niekedy, že nekonali skôr,
          
      *   že ich okolie presvedčilo, že **oni sú na vine**.
          

      Historicky sa **dlhé roky verilo**, že za autizmus môžu **emocionálne
      nedostupné alebo chladné matky**.  

      Tento **nepravdivý a nevedecký mýtus** sa rozšíril najmä v 50. rokoch, keď
      niektorí psychológovia tvrdili, že autizmus je výsledkom zlej výchovy.


      ➡️ Hovorilo sa o tzv. _„refrigerator mothers“_ – „matkách ako
      chladničkách“.


      Tento názor bol **neskôr úplne vyvrátený**.  

      Ale **pocit viny** zostal – a **nevedome sa prenáša dodnes**.  

      Zobrazenie tohto mýtu nájdete aj vo filme Temple Grandin [(link
      tu),](https://kompasio.sk/app/sk/map/zoznam/on-line/on-line/temple-grandinova)
      kde si matka musela vypočuť v danom čase od odborníkov, že za autizmus
      dcéry môže ona sama.


      ### 💔 Dnes už vieme, že to nie je pravda


      Tak ako vieme, že:


      *   zem nie je plochá (možno pre niektorých stále je),
          
      *   že fajčenie cigariet nie je zdravé (áno, v minulosti ich lekári
      schvaľovali a odporúčali),
          

      tak dnes už tiež vieme, že **autizmus nespôsobuje výchova matky.**


      Preto prosím všetkých rodičov: Nie, nemáte zlú výchovu, Nie, nemôžete za
      to. Ako nemôžete za to, že vietor fúka, nemôžete ani za toto.
    uuid: 9b3b5953-dc0a-4457-b5c9-abca8c391625
  - title: Nevyčítajte si to
    body: >-
      *   Napriek všetkému možno stále vnútri cítite výčitky.  
            
          „Prečo som to nespoznala skôr?“  
          „Mala som konať hneď.“  
          „Zlyhala som?“

          

      **NIE. Veľké NIE.**


      Nikto nás nepripravil na rolu rodiča.  

      Nemôžeme vedieť všetko (iba žeby ste patrili do skupiny ľudí všade bol
      všetko vie).  

      V škole sa učíme matiku, slovenčinu – a aj tak prídeme do práce
      nepripravení.


      Formujú nás skúsenosti, nie učebnice.


      Robili ste **to najlepšie, čo ste vedeli** – a robíte to stále.  

      Práve teraz – tým, že **hľadáte odpovede** – pomáhate svojmu dieťaťu
      **najviac, ako viete.**
    uuid: 3da56026-464c-409f-bf60-f7235ac15861
  - title: Inšpirácie na záver
    body: >-
      ak Vás zaujímajú osobné príbehy, ako iní rodičia spomínajú na prvé
