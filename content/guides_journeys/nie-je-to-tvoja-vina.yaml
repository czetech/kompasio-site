      *   podcast Život na spektre  
          (podcast dvoch matiek autistických detí),konkrétne v druhej časti: [Ako(rôzne) sme odhalili autizmus u našich detí.](https://kompasio.sk/app/sk/map/zoznam/on-line/on-line/zivot-na-spektre)

          
      *   [Na káve s Evou
      Petríčkovou,](https://www.youtube.com/watch?v=VUXgQqKbZPo)
          

      🧠 **Pamätaj:**

        
      To, že máš pochybnosti, znamená, že ti záleží.  

      Nie že si zlyhal/a. Práve naopak. To z teba robí rodiča, akého tvoje dieťa
      potrebuje.
    uuid: b157779e-4023-4132-bbaa-1b115f6b13e8
