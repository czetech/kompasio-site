title: |
  Nie je to tvoja vina. 
category: 0672d6e8-1771-46a1-9520-42437b3f2026
type: knowledge
description: Keď si rodič dieťaťa s autizmom a svet hovorí „z toho vyrastie“
steps:
  - title: "Niečo sa deje... ale nikto ti neverí "
    body: >-
      Začína to nenápadne. Dieťa nepozerá do očí (a možno aj pozerá), nezapája
      sa k ostatným (alebo rovno od nich uteká). Intuícia ti hovorí že **niečo
      tu nesedí.**


      Lenže keď to povieš nahlas, reakcie bývajú ako cez kopírku:


      *   "Prosím ťa, veď to je normálne, veď je ešte malý."
          
      *   "Veď je chalan, chalani sú lenivý!"
          
      *   "Z toho vyrastie, má čas. Vy už by ste chceli, aby ako dvojročný vedel
      čítať počítať a násobiť."
          
      *   "Aj ja som začala hovoriť skoro až v škole, to príde".
          

      Čerešničkou na torte je, ak sa opýtaš odborníka (napr. pediatra, logopéda)
      a tí namiesto toho, aby ťa poslali k špecialistom, ťa uistia, že je ešte
      malý/malá a že má čas.


      Na jednej strane ťa to upokojí. Na druhej strane začneš pochybovať. Aj o
      sebe.  

      **Toto je moment, kedy rodič zostáva sám - proti okoliu, proti neistote,
      často proti systému.**
    uuid: 7e0623e7-5759-4c66-adda-294fefbee82c
  - title: "Čo mám teda robiť? "
    body: >-
      V dnešnej dobe existuje mnoho zdrojov, z ktorých čerpať. Nevieme, v akom
      veku je Vaše dieťa – ale vieme, že **pochybnosti, otázky a neistota** sú
      častou súčasťou tohto procesu.


      ### 🧩 Prvé prejavy – a že ich nie je málo


      V tomto článku sme spísali [25 najčastejších prejavov
      autizmu.](https://modrahliadka.sk/prejavy-autizmu-u-deti/?gad_source=1&gad_campaignid=20501408368&gbraid=0AAAAApp6I5pWF5JL7dTABuXIoi_pllCBg&gclid=Cj0KCQjwxL7GBhDXARIsAGOcmINToZPVidrTcu0iV8LWERM_dg2QRZa60XQA7SDVA4zTu0dTvCW1REgaAq1lEALw_wcB)
      Nezabúdajte:


      *   nemusia sa objaviť všetky,
          
      *   rôzne vývojové stupne znamenajú častokrát aj rozdielne príznaky. To,
      čo robilo dieťa v dvoch rokoch, nemusí robiť v štyroch rokoch,
          
      *   zároveň, ako štvorročné môže zápasiť úplne s niečí iným,
          
      *   u starších detí sa prejavy môžu meniť, byť menej viditeľné, alebo byť
      "maskované".
          

      ### 📲 Online nástroj pre staršie deti (11–30 rokov)


      Existuje **online aplikácia**, ktorá vás pomocou videí a otázok prevedie
      hodnotením. Pomôže vám lepšie pochopiť, či Vaše dieťa vykazuje znaky
      autizmu.Nech sa páči, tu je
      [link.](https://kompasio.sk/app/sk/map/zoznam/on-line/on-line/asdetect)


      ### 💬 Psychológ – prvá osoba, ktorá vás začne počúvať


      Ak máte pochybnosti, ale váhate, či ich „nezveličujete“, **neváhajte sa
      obrátiť na psychológa**. Nemusíte so sebou hneď brať dieťa. Stačí prísť a
      povedať:


      > „Niečo ma trápi. Niečo mi nesedí. Mám podozrenie.“


      Psychológ, ktorý má skúsenosti s autizmom, častokrát z Vašich slov často
      vie, že ide o niečo viac než len **"obdobie".** Môže vás nasmerova na
      ďalšie vyšetrenie, alebo Vás odporúčiť k niekomu, kto má oprávnenie
      vykonať diagnostiku.


      A čo je najdôležitejšie: začne vás počúvať. Nie zľahčovať, nie
      presviedčasť. Počuť.


      **Prvý silný pocit, pocit beznádeje bol, keď sa rodič ocitol že je na
      všetko sám a nikto mu neverí. U psychológa prichádza druhý silný pocit -
      Tam však prvýkrát cítite po dlhom čase, že niekto je na Vašej strane.**


      *   ak Vás zaujímajú osobné príbehy, ako iní rodičia spomínajú na prvé
      príznaky autizmu u svojich detí, odporúčame vypočuť si napríklad podcast
      Život na spektre (podcast dvoch matiek autistických detí), konrkténe v
      druhej časti: [Ako(rôzne) sme odhalili autizmus u našich
      detí.](https://kompasio.sk/app/sk/map/zoznam/on-line/on-line/zivot-na-spektre)
