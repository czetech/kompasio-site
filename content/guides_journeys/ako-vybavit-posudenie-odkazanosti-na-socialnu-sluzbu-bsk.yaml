active: false
category: 3d1a90a9-3de0-4b41-8307-47d0a934445c
type: journey
steps:
  - title: Skôr než začneš
    body: >-
      Pred zapísaním sa do poradovníka v konkrétnom zariadení je nutné vybaviť
      si vystavenie posudku o odkázanosti na sociálnu službu.


      V prípade, že ide o zariadenie v pôsobnosti župy, tento posudok vydáva
      župa.


      [Bližšie info aj
      TU.](https://bratislavskykraj.sk/socialne-veci/otazky-a-odpovede/posudenie-odkazanosti-na-socialnu-sluzbu-a-zabezpecenie-poskytovania-socialnej-sluzby/)


      K žiadosti je nutné priložiť lekársku správu od špecialistu (v súvislosti
      s autizmom napr. psychiater) nie staršiu ako 6 mesiacov!
    uuid: 1762227c-4d3a-47ca-b942-137d1708a837
  - title: Žiadosť
    body: >-
      BSK nemá na túto žiadosť samostatnú elektronickú službu,


      ale napriek tomu je možné ju podať elektronicky, čo aj odporúčanme.


      [Žiadosť vo fromáte DOC si stiahni
      TU.](https://bratislavskykraj.sk/wp-content/uploads/2024/09/ziadost-o-posudenie-odkazanosti-1.doc)


      V žiadosti je potrebné vypísať osobné údaje a druh a formu sociálnej
      služby.


      **Dôležité:** posudok sa vypracúva pre každú službu samostatne, tzn. ak sa
      chcete hlásiť na **špecializované zariadenie** aj **domov sociálnych
      služieb**, musíte podať **dve žiadosti.**


      V časti _"podpis"_ odporúčame cca takúto formuláciu.


      "v.z. Peter Htovath - otec, podpísané cez EID" (mená a vzťahy sú
      vzorové!!)


      Nie je to nutné, ale ušetrí to zbytočné otázky a nedorozumenia.


      Žiadosť si uložte ako PDF, v ďalšom kroku ju pošleme.
    uuid: 934599d0-c109-4ce7-a0f9-dfc2f1f271bd
