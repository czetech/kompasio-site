title: "Keď sa dieťa zverí: safeguarding a ochrana pred sexuálnym zneužívaním"
active: false
category: af1fe4e9-817e-4476-8231-92a011c8c125
type: knowledge
description: >-
  **Zameranie:** rodič, pedagóg, tréner, asistent – všetci, ktorí sú v kontakte
  s deťmi


  _Ako rozpoznať varovné signály, ako viesť rozhovor s dieťaťom a čo urobiť hneď
  po tom, ako sa vám zverí. Praktický sprievodca ochranou detí – vrátane detí
  neverbálnych a detí so znevýhodnením._
steps:
  - title: "Úvod "
    body: >-
      Väčšina z nás verí v dobro ľudí a pomáha z vnútorného presvedčenia.
      Existujú však odborníci, ktorí sa s tzv. „pomocou“ stretávajú v úplne
      inom, omnoho temnejšom kontexte – riešia situácie, ktoré sú za každou
      mysliteľnou hranicou.


      Práve preto je kritické myslenie také dôležité. O to viac, ak chceme
      chrániť to najcennejšie, čo máme – **deti. Všetky deti.**


      Návod vychádza z prednášky **Mgr. Gažovej** o safeguardingu a ochrane pred
      sexuálnym zneužívaním, ktorá odznela na Špeciálnopedagogických dňoch
      Katedry špeciálnej pedagogiky Univerzity Komenského v Bratislave.
