description: Rýchly sprievodca, ako pochopiť a podporiť dieťa v domácom prostredí.
steps:
  - title: Čo dieťa, to unikát
    body: >-
      Každé dieťa je jedinečné – aj medzi deťmi s rovnakou diagnózou môžu byť
      obrovské rozdiely v tom, ako vnímajú svet, ako reagujú, čo potrebujú a čo
      im pomáha.


      To, čo je pre jedno dieťa kľúčové, môže byť pre iné nepodstatné alebo
      dokonca rušivé. Preto všetky stratégie, ktoré ďalej ponúkame, berte ako
      **inšpiráciu**, nie ako univerzálny recept.


      🔍 **Dôležité je poznať konkrétne dieťa.** Jeho povahu, potreby, prejavy
      stresu či radosti. Ak ho poznáte aspoň trochu, viete lepšie vyhodnotiť, čo
      môže pomôcť – a čo možno radšej vynechať.


      ✔️ Aj metóda _pokus – omyl_ má v procese svoje miesto. Hlavne, ak je
      sprevádzaná rešpektom, trpezlivosťou a ochotou upraviť prístup.
    uuid: 978bf05f-7bfe-4d54-8173-5028cc3b2810
  - title: "1. Jasnosť v komunikácií "
    body: >-
      Deti na spektre často potrebujú, aby bolo vetko povedané presne a
      konkrétne. Abstraktné výrazy ich môžu zmiasť - nevedia, čo presne majú
      urobiť alebo čo sa ich nich očakáva.


      | Nejasne | Konkrétne |

      | --- | --- |

      | "upraci si izbu". | "Polož hračky do krabice a zober tanier do kuchyne".
      |

      | "Správaj sa slušne." | "Porzi sa na tetu, pozdrav ju a povedz ahoj." |

      | "musíme čakať". | "Počkáme, kým prideme na rad. Pozri, sme tretí v
      poradí." |

      | "Nehnevaj ma, neprovokuj". | "Prosím nelez na stôl, je to nebezpečné,
      mohol by si spadnúť." |

      | "Nechce sa mi teraz." | "Cítim sa unavene, potrebuje si ľahnúť a
      oddychnúť 10 minút na gauči. Potom sa ti viem venovať. Ak chceš, zatiaľ sa
      zahraj s autíčkami." |


      ✅Prečo to pomáha?


      *   Konkrétnosť znižuje neistotu,
          
      *   dieťa vie, čo sa od neho očakáva,
          
      *   aké sú dôsledky správania,
          
      *   poskytuje to **pocit istoty,**
          
      *   dáva pocit **kontroly nad situáciou** (rozumie danej situácií).
    uuid: c3048a9d-d967-40b2-b9f8-9da917b20c5b
  - title: "2. Slepý bod konkrétnosti "
    body: >-
      Hovoriť jasne a konkrétne sa vhodným spôsobom, ako komunikovať s deťmi na
      spektre.  

      Zároveň je dôležité uvedomiť si, **ako veľmi doslovne sa dajú slová
      pochopiť.**


      Dávajte si **pozor na slovné spojenia**, ktoré môžu v **dieťati vyvolať
      strach, zmätok alebo doslovné predstavy.** V niektorých prípadoch
      konkrétnosť môže spôsobiť viac problémov ako osohu.


      | Nevhodné | Reakcia dieťaťa |

      | --- | --- |

      | "Uši ti obtrhám." (pri jašení alebo pri hneve) | "To bude bolieť." Môže
      sa naľakať, že to myslíte vážne a že ho to bude bolieť. |

      | "Nechcem ťa teraz vidieť. "Zmizni mi z očí." (keď sa hneváme) | Dieťa sa
      môže zľaknúť, že nesmie byť nablízku, môže sa schovať alebo doslova odísť.
      |

      | "Odhryznem ti nos." ( pri jašení) | Bude to bolieť a môže sa naľakať, že
      to myslíte vážne. |

      | "Ide mi hlava prasknúť." | Zľakne sa, že sa Vám niečo stane. |

      | "Mám toho plné zuby." | Zmätok - čo presne máte v ústach? |


      > "Hovoriť konkrétne a dávať pozor na prenesené významy je ako **učiť sa
      nový jazyk.** Často doma hovoríme nejasne, a asi to úplne nezmeníme.
      Komunikáciu však prispôsobujeme podľa potreby. Ak sa takéto slovné hračky
      vyskytnú, proaktívne vysvetlíme, čo tým myslíme - alebo čo sa tým vo
      všeobecnosti myslí. Vnímame to ako prirodzený spôsob učenia sa v kontexte
      - bez tlaku a bez potreby všetko memorovať a vysvetľovať naraz."
    uuid: 489d509d-a626-40dc-b6e6-4cb7e89c8e45
  - title: '3. "Choď po vodu" nestačí '
    body: >-
      Ste na návšteve u starých rodičov a dieťaťu poviete:


      "Choď prosím do špajze a prines vodu"


      **Očakávanie**: dieťa pôjde do špajze, nájde, kde sú fľaše a doniesie
      ju.  

      **Realita**: dieťa nevie, kde v špajzi hľadať alebo ktorú z 3 druhov
      minerálok treba doniesť.


      Deti na spektre často potrebujú viac podpory pri zorientovaní sa v novom
      priestore. Oboznámte ich s týmto priestorom, najmä ak je nový a nezmány.
      **Nepredpokladajme, že sa "rozkukajú" alebo si domyslia kontext.**


      **Pomôže, ak prostredie vopred ukážeme, pomenujeme a následne veci
      spresníme.**  

      "V špajzi je fľaša vody - modrá fľaška, vpravo na zemi, prosím donesieš
      nám ju?"
    uuid: c8ed7d6e-9b35-4b72-885f-568662449b61
