title: Ako vybaviť zľavovú parkovaciu kartu ŤZP - Bratislava
category: 3d1a90a9-3de0-4b41-8307-47d0a934445c
description: >-
  Parkovacia karta v systému PAAS pre osobu s ŤZP umožnuje v zónach PAAS
  parkovať so zľavou 90%. Parkovanie môžete platiť ľubovoľným spôsobom ako
  doteraz (apka PAAS, parkomat, apka HOPIN).


  Parkovacia karta sa vzťahuje na vozidlo, resp na EČV (ŠPZ).


  Nikam nechoďte. Celý proces vybavíte online.
steps:
  - title: Pripravte si dokumenty
    body: >-
      Podľa toho, aký je vzťah medzi žiadateľom, osobou s ŤZP a autom, bude
      potrebné v procese nahrať dokumenty.


      **Parkovací preukaz osoby s ŤZP**  

      Ten budete potrebovať v každom prípade. Ak ho ešte nemáte v mobile,
      odporúčame si z neho urobiť PDF napr. cez apku LENS. Ak si na to
      netrúfate, iba si odfoťte **prednú aj zadnú stranu** mobilom, je možné
      nahrať aj dva súbory.


      **Firemné vozidlo na súkromné účely**  

      Ak máte auto od zamestnávateľa, ale od vlastnej firmy, magistrát požaduje
      zaslanie nasledujúceho potvrdenia zamestnávateľa.


      UPOZORNENIE: Vyplnenie takéhoto potvrdenie môže viesť v niektorých
      prípadoch k daňovým povinnostiam prevyšujúcim potenciálnu zľavu na
      parkovaní. Poraďte sa so svojím daňovým poradcom.


      **Nájomná zmluva**  

      Ak máte auto prenajaté (napr. z požičovne, operatívny leasing, od firmy,
      od kamaráta, od rodičov, alebo aj od otcovho koňa brata) bude nutné
      doložiť písomnú nájomnú zmluvu.


      Pozor, magistrát poskytuje zľavu iba tým, kotrí majú auto prenajaté "za
      komerčných podmienok".  

      Vzor nájomnej zmluvy nájdte napr aj TU.
    tasks:
      - body: Doklady pripravené
        uuid: ca5bd259-8578-46c1-b37c-a47c82719298
    uuid: fb472954-b366-4caa-8393-7b60a7483840
  - title: Registrácia v PAAS cez Parkdots
    body: |-
      Najprv si vytvorte konto v systéme parkdots.

      Prejdite na stránku [**pakrdots.com**](https://parkdots.com)

      Vpravo hore kliknite na **Môj účet.**

      Ak nemáte účet, zvoľte **Registrácia.**

      Ak už účet máte, **prihláste sa.**
    tasks:
      - body: Konto vytvorené
        uuid: f1e2f7b1-e4b0-4b5b-b8d2-172e561bad4f
    uuid: f6263913-84b0-4c9f-905e-6d13be58cf36
  - title: "Žiadosť o vydanie zľavovej karty "
    body: >-
      Vyplnenie žiadosti:


      1.  Overenie registrácie
          
          *   Po potvrdení registrácie z e-mailu vyplňte svoje údaje (meno, priezvisko, rodné číslo).
              
          *   Kliknite na _Pokračovať_.

              
      2.  Výber karty
          
          *   V časti _Základné údaje_ vyberte typ parkovacej karty: **Zľavová karta – ŤZP**.
              
          *   Nastavte dátum podľa potreby.

              
      3.  Údaje o žiadateľovi a vozidle
          
          *   **Informácia o vozidle**: zadajte evidenčné číslo vozidla (EVČ) a uveďte vzťah k vozidlu.
              
          *   **Informácie o žiadateľovi**: vyplňte svoje osobné údaje. Z parkovacieho preukazu ŤZP odpíšte jeho číslo.
              
          *   _Ak žiadateľ nie je osoba ŤZP_
              
              *   Zaškrtnite políčko _„Žiadateľom nie je osoba ŤZP“_.
                  
              *   Zobrazia sa nové polia, kde je potrebné doplniť údaje o osobe s ŤZP (meno, priezvisko, rodné číslo a pod.).

                  
      4.  Informácie o bydlisku
          
          *   Vyplňte svoju adresu trvalého bydliska

              
      5.  Súhlasy a prehlásenie
          
          *   Zaškrtnite požadované súhlasy so spracovaním osobných údajov.
              
          *   Potvrďte, že všetky uvedené údaje sú pravdivé.

              

      ### Prílohy


      *   Nahrajte všetky povinné prílohy, ktoré ste si pripravili v prvom
      kroku.
          
      *   Kliknite na _Dokončiť_.
