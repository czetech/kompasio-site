  - title: Žiadosť odoslaná
    body: |-
      Žiadosť a doklady sa odoslali na schovaľovanie.

      Schválenie žiadosti Vám príde emailom spolu s pokynmi na úhradu.

      Po zaplatení bude Vaša karta aktívna.
