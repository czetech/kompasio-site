title: "Základná škola "
active: true
category: 34eca9eb-93f0-452e-a157-409343965354
type: knowledge
description: Rýchly sprievodca, ako pochopiť a podporiť žiaka v prostredí základnej školy.
steps:
  - title: Čo dieťa, to unikát
    body: >-
      Každé dieťa je jedinečné – aj medzi deťmi s rovnakou diagnózou môžu byť
      obrovské rozdiely v tom, ako vnímajú svet, ako reagujú, čo potrebujú a čo
      im pomáha.


      To, čo je pre jedno dieťa kľúčové, môže byť pre iné nepodstatné alebo
      dokonca rušivé. Preto všetky stratégie, ktoré ďalej ponúkame, berte ako
      **inšpiráciu**, nie ako univerzálny recept.


      🔍 **Dôležité je poznať konkrétne dieťa.** Jeho povahu, potreby, prejavy
      stresu či radosti. Ak ho poznáte aspoň trochu, viete lepšie vyhodnotiť, čo
      môže pomôcť – a čo možno radšej vynechať.


      ✔️ Aj metóda _pokus – omyl_ má v procese svoje miesto. Hlavne, ak je
      sprevádzaná rešpektom, trpezlivosťou a ochotou upraviť prístup.
    uuid: 3bb78189-61f6-4f83-9548-b5312da6e7b7
  - title: 1. Zachovávajte predvídateľný režim dňa
    body: >-
      Žiaci potrebujú **stabilitu** – opakujúci sa režim im dáva **pocit istoty
      a bezpečia.**


      ### Čo preto viete urobiť?


      1.  ráno začína rovnakým rituálom (napríklad pozdravom)_\= voliteľná
      aktivita_
          
      2.  Povedzte a ukážte slovne aj **vizuálne** ( napr. rozvrhom), čo sa bude
      diať počas dňa,
          
      3.  Včas ohláste každú zmenu. Ak je to možné, podporte ju vizuálne
      (fotkou, obrázkom, symbolom).
          

      ### Ako pripraviť žiaka na zmenu?


      *   Ak bude niekto zastupovať, ukážte na rozvrhu, kedy a kto príde,
      prípadne aj fotografiu učiteľa.
          
      *   Ak sa mení miesto vyučovania, popredu to vysvetlite:
          
          *   _"na tejto hodine nebudeme celý čas v triede. Ideme von do školského areálu."_ (ukázať fotku areálu)
              
          *   "_Budeme pozorovať stromy a kvety, ktoré v triede nemáme."_ (vysvetlenie, prečo tam ideme)

              

      ### ✨Žiaci s Aspergerom


      Aspergeri môžu vyzerať „v pohode“, ale vnútorný stres majú z vecí, ktoré
      **nie sú dopredu jasne povedané.**  

      Nie vždy sa spýtajú – ale **neistota môže spôsobiť úzkosť, zablokovanie
      alebo odmietnutie spolupráce.**


      🔸 **Buďte ešte konkrétnejší než zvyčajne**  

      Nielen „ideme von“, ale:  

      „O 10 minút ideme na školský dvor. Budete tam so mnou a s pani učiteľkou
      Novákovou. Na školskom dvore budeme približne 20 minút. Potom sa vrátime
      do triedy, kde budeme pokračovať v práci.“


      🔸 **Pri zmene (akejkoľvek) vysvetlite dôvod**  

      Napr.: **_zmena poradia aktivít_**  

      „Najprv sme mali mať čítanie, ale ideme teraz von, lebo sa má pokaziť
      počasie. Čítanie si spravíme po návrate.“


      ### Prečo je to dôležité?


      **Zásah do pocitov istoty a bezpečia.**


      Každé ráno prídete do triedy a pozdravíte sa so žiakmi. Ak sa jedno ráno
      nepozdravíte (čo je zároveň aj začiatok témy, ktorú budete so žiakmi
      rozoberať), **pre vás to môže byť len drobný prvok vyučovania.**


      Pre žiaka/žiačku s Aspergerom to môže znamenať zásadný zásah do jeho
      pocitu bezpečia. To môže vyvolať nadmerné premýšľanie a úzkostné stavy,
      ktoré vedú k obavám.


      > "_Keď pani učiteľka neprišla a nikto nič nepovedal, bál som sa, že sa
      stalo niečo zlé._"


      Vnímajte tieto maličkosti.
    uuid: f7eda01d-bdcb-4ca5-b11f-c969fc9e6780
  - title: 2. Hovorte jasne a konkrétne
    body: >-
      **Čo je jasné pre Vás, nemusí byť jasné pre žiaka.**


      To, čo je jasné pre vás, nemusí byť jasné pre žiaka. Autistickí žiaci
      potrebujú **presné a zrozumiteľné informácie**, aby sa cítili bezpečne a
      vedeli, čo sa od nich očakáva.


      ### Ako hovoriť s dieťaťom konkrétne?


      **Používajte jednoduché, konkrétne vety.**  

      Vyhnite sa narážkam, metaforám a nejednoznačnostiam.


      1.  namiesto _"čoskoro pôjdeme von"_ povedzte: _"_**_o 10 minút pojdeme na
      školský dvor._**_"_
          
      2.  namiesto : _"bude to kreatívna aktivita"_ povedzte: _"_**_Budeme
      maľovať štetcom a farbami. Každý si vyberie, čo chce namaľovať – môžete si
      vybrať - buď dom, zviera alebo les_**_.“_
          
      3.  namiesto: _"dnes bude malá zmena"_ povedzte: "**_dnes na tretej hodine
      príde namiesto pani učiteľky Novákovej pán učiteľ Rozák. Pani učiteľka
      Nováková ochorela_**_"._
          
      4.  namiesto: _"urob to po svojom"_ povedzte: **_môžeš si vybrať, či tú
      úlohu nakreslíš, alebo napíšeš. Obe možnosti sú správne."_**
          
      5.  namiesto: _"napíš krátky text o svojom víkende"_ povedzte: _"_**_napíš
      jeden odstavec, teda 3-5 viet o tom, čo si robil cez víkend_**_"._
          
      6.  namiesto _"ideme to rozlúsknúť"_ povedzte _"_**_skúsime túto úlohu
      vyriešiť krok po kroku. Začneme prvou časťou."_**
          
      7.  _namiesto: "uteká nám čas"_ povedzte "**_máme 5 minút na dokončenie
      úlohy_**_"._
          

      ### 🧠Tip


      Ak použijete obrazné vyjadrenie zo zvyku (čo je bežné), pokúste sa hneď
      "preložiť" vetu do konkrétnosti.


      ### Prečo je to dôležité?


      Jazyk, ktorý používame, je plný nejednoznačností, metafor a obrazných
      pomenovaní - to si častokrát ani neuvedomujeme. My všetci vrátane učiteľov
      ich často používajú zo zvyku, no pre autistických žiakov môžu byť takéto
      vyjadrenia nejasné. Ak pokyny formulujeme jednoducho a konkrétne,
      znižujeme riziko nedorozumení a podporujeme lepšie porozumenie aj vzájomný
      rešpekt v triede.
    uuid: 54c7cb38-947b-4019-9b4e-68f31f50284f
  - title: "3. Oboznámte žiaka s prostredím "
    body: >-
      Neznáme prostredie môže byť zdrojom veľkého stresu.


      **Táto stratégia je vhodná napríklad, ak:**


      *   žiak nastupuje do novej školy,
          
      *   začína novú aktivitu,
          
      *   mení kolektív alebo triedu.
          

      ### Ako oboznámiť žiaka s prostredím školy?


      *   Ukážte žiakovi, kam bude chodiť do školy, kde je jeho trieda, šatňa,
      toalety, jedáleň, zborovňa a pod.
          
      *   Zoznámte ho s učiteľmi – pomôžu fotografie, menovky, jednoduchá mapa
      školy.
          
      *   Ukážte miesta, kam sa bude chodiť na telesnú výchovu alebo na
      špeciálne predmety.
          
      *   Preveďte ho týmito miestami ešte pred začiatkom oficiálnej výučby.
          

      🧩 **Prečo:**  

      Dieťa nemôže vedieť, čo sa od neho očakáva, ak mu to nikto neukázal.  

      Pokyn _„choď zaklopať do zborovne“_ nie je zrozumiteľný, ak nevie, kde
      zborovňa je.  

      Rovnako „_ideme na obed“_ nemusí dávať zmysel, ak žiak nepozná cestu do
      jedálne.


      Niektoré deti si v takých situáciách pomôžu tým, že sledujú ostatných –
      _„idú s prúdom“_. Je to úctyhodná schopnosť prispôsobiť sa, no **nie
      všetky deti ju majú prirodzene rozvinutú.**  

      Predpokladať, že sa každý žiak v novom prostredí zorientuje sám, môže
      viesť k zbytočnému stresu či frustrácii. Tomuto sa dá predísť práve
      **prípravou a postupným zoznámením sa s prostredím.**


      ✨ **Žiaci s Aspergerom**  

      U nich môže už len predstava nového prostredia vyvolať úzkosť. Pomáha
      preto, ak dostanú možnosť:


      *   pozrieť si fotografie miest,
          
      *   vopred prejsť trasu,
          
      *   mať v začiatkoch po boku sprievodnú osobu, ktorej dôverujú,
          
      *   mať informáciu o tom, na koho sa obrátiť a ako ho kontaktovať, ak
      "niečo nejde podľa plánu".
    uuid: f03ff9d3-c224-4111-8d1a-87c397dd4ecf
  - title: 4. Doprajte čas na spracovanie informácií
    body: >-
      Niektoré autistické deti potrebujú viac času na pochopenie pokynov či
      otázok, alebo odvahu rozprávať pred všetkými. Neponáhľajte ich s odpoveďou
      – aj keď mlčia, neznamená to, že nerozumejú.


      **Ako na to:**


      *   Dajte pokyn a počkajte 5 –15 sekúnd.
          
      *   Neskáčte hneď k inému žiakovi – **počkáte** možno len **o pár sekúnd
      dlhšie,** ale pre dieťa **to môže byť rozdiel** medzi úspechom a
      neúspechom.
          
      *   Ak dieťa dlhšie neodpovedá, **skúste otázku preformulovať
      konkrétnejšie.**
          

      ### Ako dopriať žiakovi viac času na odpoveď?


      _Učiteľ: "Adam, môžeš nám povedať, čo si si zapamätal z príbehu?“  

      Adam pozerá do lavice, Mlčí. Po 4-5 sekundách sa hlási iný žiak. Učiteľ
      nepreskočí na iného žiaka,_ **_ale počká ešte niekoľko sekúnd._** _Po
      približne 8 sekundách Adam potichu povie "Pes našiel cestu domov."_


      _Ak by mlčanie trvalo dlhšie, učiteľ by mohol pomôcť otázkou: "Adam,
      spomínaš si, kam sa pes na konci príbehu vrátil?"_  

      _Adam odpovedá: "domov", ( správna odpoveď, len potreboval trochu pomôcť a
      viac času)._


      ### Prečo je to dôležité?


      *   Žiak možno **rozmýšľa**, spracúva jazyk, triedi spomienky alebo hľadá
      vhodné slová.
          
      *   Ak mu **skočíme do reči** alebo otázku **hneď zmeníme**, môžeme mu ten
      proces nevedomky prerušiť.
          
      *   Niekedy je dôležité žiaka ubezpečiť, že sa nič **nedeje, ak odpovie
      zle** - práve z toho dôvodu sme v škole, aby sme sa spoločne veci naučili
      a že chybovosť je bežný spôsob získavania nových zručností a vedomostí.
      Nejde o dokonalosť.
          
      *   Trpezlivosť vytvára **bezpečný priestor** pre komunikáciu – a to je
      kľúčové.
    uuid: f8f25244-2097-4dee-83fc-00095ad2f418
  - title: '5. "Prídi za mnou do kabinetu" nestačí '
    body: >-
      Táto veta môže pre niektorých žiakov na spektre autizmu pôsobiť veľmi
      nekonkrétne.


      > _"Čo to znamená_ **_"príď do kabinetu?"_**  

      > _Vôbec nepovedal kedy, alebo čo mám zobrať so sebou._

      > 

      > _Niektorí mali kľúče vo dverách. Niektorí žiaci tam vošli, niektorí
      klopali, čo je tiež mätúce- ako tam mám teda prísť?_

      > 

      > _A_ **_hlavne nepovedali kedy._** _Čo to teda znamená -_ **_"priď
      niekedy do kabinetu"_**  

      > **_Kedy je to <u>niekedy</u>? Mám prísť cez ďalšiu prestávku? alebo o
      týždeň?..._**

      > 

      > _...Nikdy som tam nedošla." Čakala som na informáciu od nich_
      **<u>"kedy"</u>** _mám prísť."_  

      > _(výpoveď študentky s Aspergerovým syndrómom)_


      ### **💡 Návod pre učiteľov:**


      1.  Ak viete, že žiak je na **spektre autizmu**, **komunikujte čo
      najkonkrétnejšie**. Pre autistických žiakov je abstraktné vyjadrenie ako
      _„Príď za mnou do kabinetu“_ nejasné a **môže vyvolať stres alebo
      pasivitu**, ktorá **vyplýva z nepochopenia, nie z neochoty.**
          
      2.  **Ak žiak opakovane nereaguje na vašu prosbu alebo ju ignoruje**,
      skúste upraviť vetu:
          
          > „Juraj, dnes počas veľkej prestávky, teda po tretej hodine, sa zastav v mojom kabinete. Zaklop na dvere a pokojne vojdi – bude to v poriadku.“
          
          *   Ak zrazu zareaguje a úlohu splní, je to jasný signál, že **konkrétnosť v komunikácii mu pomáha**. Pokračujte v tomto štýle aj v ďalších situáciách – opakovane overujte, čo funguje, a všimnite si, ako na to žiak reaguje.
              
          *   Tento prístup sa dá preniesť aj do iných oblastí vyučovania – zadávanie úloh, presné očakávania, začiatok a koniec aktivít, pracovné inštrukcie.
              
          
          1.  Ak úkolujete žiaka alebo ho o niečo žiadate a opätovane vás ignoruje, skúste zmeniť vetu na konkrétnejšiu: **"Juraj, dnes cez veľkú prestávku sa zastav v mojom kabinete. Zaklop na dvere a vojdi, je to v poriadku."**
              
          2.  **Odporúča sa tiež informovať školský podporný tím** (školského psychológa, špeciálneho pedagóga či koordinátora inklúzie) o vašom pozorovaní. Tieto poznatky môžu byť veľmi cenné pre nastavovanie podpory pre konkrétneho žiaka.

              

      Zdroj:
      [<u>Zapojmevsechny.cz</u>](https://zapojmevsechny.cz/clanek/361-podcast-18-dil-na-prvni-pohled-nerozeznatelna-jinakost-zivot-a-studium-s-aspergerovym-syndromem)
    uuid: 8838ed56-1557-4f0e-8e14-33eef04ae68d
  - title: '6. "Naučte sa slovíčka" nestačí '
    body: >-
      Táto situácia môže nastať, ak žiak nedostal jasné zadanie:


      > _„Nemala som v tom prehľad. Nevedela som, že sa mám učiť slovíčka.
      Nepísali sme testy zo slovíčok, tak som nevedela, že sa ich mám učiť.
      Potom prišlo zadanie že bude test a tam bolo zrazu všetko – a ja som sa to
      nestihla už naučiť..._

      > 

      > _...Ostatní vedeli, že sa to majú učiť priebežne, ale_ **_ja som čakala
      na TO zadanie, čo mám robiť_**_.“_  

      > _(výpoveď študentky s Aspergerovým syndrómom)_


      ### 💡 Návod pre učiteľov:


      Pre mnohých žiakov na spektre autizmu neexistuje „samozrejmosť“, ktorú
      **ostatní vnímajú automaticky.**  

      **Priebežné učenie slovíčok** alebo **samoštúdium** nie sú pre nich
      prirodzené, pokiaľ im to niekto výslovne nepovie.


      Stačí **malá, ale veľmi dôležitá zmena** vo vašej komunikácii.


      namiesto "naučte sa slovíčka" povedzte:


      > _„Slovíčka, ktoré sme prešli na dnešnej hodine (napr. zo strany 25), sa
      naučte tak, aby ste vedeli:_

      > 

      > *   _čo znamenajú,_

      >     

      > *   _ako sa píšu,_

      >     

      > *   _ako sa vyslovujú,_

      >     

      > *   _a aby ste ich vedeli použiť vo vete.“_

      >     


      Môžete doplniť aj konkrétny tip na domácu prípravu:


      > _„Doma si ku každému slovíčku skúste vymyslieť jednu krátku vetu. Pomôže
      vám to lepšie si ich zapamätať.“_


      Zdroj:
      [<u>zapojmevsechny.cz</u>](https://zapojmevsechny.cz/clanek/361-podcast-18-dil-na-prvni-pohled-nerozeznatelna-jinakost-zivot-a-studium-s-aspergerovym-syndromem)
