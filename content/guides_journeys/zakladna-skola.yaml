title: "Základná škola "
category: 34eca9eb-93f0-452e-a157-409343965354
type: knowledge
description: Rýchly sprievodca, ako pochopiť a podporiť žiaka v prostredí základnej školy.
steps:
  - title: Čo dieťa, to unikát
    body: >-
      Každé dieťa je jedinečné – aj medzi deťmi s rovnakou diagnózou môžu byť
      obrovské rozdiely v tom, ako vnímajú svet, ako reagujú, čo potrebujú a čo
      im pomáha.


      To, čo je pre jedno dieťa kľúčové, môže byť pre iné nepodstatné alebo
      dokonca rušivé. Preto všetky stratégie, ktoré ďalej ponúkame, berte ako
      **inšpiráciu**, nie ako univerzálny recept.


      🔍 **Dôležité je poznať konkrétne dieťa.** Jeho povahu, potreby, prejavy
      stresu či radosti. Ak ho poznáte aspoň trochu, viete lepšie vyhodnotiť, čo
      môže pomôcť – a čo možno radšej vynechať.


      ✔️ Aj metóda _pokus – omyl_ má v procese svoje miesto. Hlavne, ak je
      sprevádzaná rešpektom, trpezlivosťou a ochotou upraviť prístup.
    uuid: 3bb78189-61f6-4f83-9548-b5312da6e7b7
  - title: 1. Zachovávajte predvídateľný režim dňa
    body: >-
      Žiaci potrebujú **stabilitu** – opakujúci sa režim im dáva **pocit istoty
      a bezpečia.**


      ### Čo preto viete urobiť?


      1.  ráno začína rovnakým rituálom (napríklad pozdravom)_\= voliteľná
      aktivita_
          
      2.  Povedzte a ukážte slovne aj **vizuálne** ( napr. rozvrhom), čo sa bude
      diať počas dňa,
          
      3.  Včas ohláste každú zmenu. Ak je to možné, podporte ju vizuálne
      (fotkou, obrázkom, symbolom).
          

      Príklady


      *   Ak bude niekto zastupovať, ukážte na rozvrhu, kedy a kto príde,
      prípadne aj fotografiu učiteľa.
          
      *   Ak sa mení miesto vyučovania, popredu to vysvetlite:
          
          *   _"na tejto hodine nebudeme celý čas v triede. Ideme von do školského areálu."_ (ukázať fotku areálu)
              
          *   "_Budeme pozorovať stromy a kvety, ktoré v triede nemáme."_ (vysvetlenie, prečo tam ideme)

              

      ### ✨Žiaci s Aspergerom


      Aspergeri môžu vyzerať „v pohode“, ale vnútorný stres majú z vecí, ktoré
      **nie sú dopredu jasne povedané.**  

      Nie vždy sa spýtajú – ale **neistota môže spôsobiť úzkosť, zablokovanie
      alebo odmietnutie spolupráce.**


      🔸 **Buďte ešte konkrétnejší než zvyčajne**  

      Nielen „ideme von“, ale:  

      „O 10 minút ideme na školský dvor. Budete tam so mnou a s pani učiteľkou
      Novákovou. Na školskom dvore budeme približne 20 minút. Potom sa vrátime
      do triedy, kde budeme pokračovať v práci.“


      🔸 **Pri zmene (akejkoľvek) vysvetlite dôvod**  

      Napr.: **_zmena poradia aktivít_**  

      „Najprv sme mali mať čítanie, ale ideme teraz von, lebo sa má pokaziť
      počasie. Čítanie si spravíme po návrate.“


      ### Prečo je to dôležité?


      **Zásah do pocitov istoty a bezpečia.**


      Každé ráno prídete do triedy a pozdravíte sa so žiakmi. Ak sa jeno ráno
      nepozdravíte (čo je zároveň aj začiatok témy, ktorú budete so žiakmi
      rozoberať), pre vás to môže byť len drobný prvok vyučovania.


      Pre žiaka/žiačku s Aspergerom to môže znamenať zásadný zásah do jeho
      pocitu bezpečia. To môže vyvolať nadmerné premýšľanie a úzkostné stavy,
      ktoré vedú k obavám. Vnímajte tieto maličkosti.
    uuid: f7eda01d-bdcb-4ca5-b11f-c969fc9e6780
  - title: 2. Hovorte jasne a konkrétne
    body: >-
      **Čo je jasné pre Vás, nemusí byť jasné pre žiaka.**


      To, čo je jasné pre vás, nemusí byť jasné pre žiaka. Autistickí žiaci
      potrebujú **presné a zrozumiteľné informácie**, aby sa cítili bezpečne a
      vedeli, čo sa od nich očakáva.


      **Používajte jednoduché, konkrétne vety.**  

      Vyhnite sa narážkam, metaforám a nejednoznačnostiam.


      *   namiesto _"čoskoro pôjdeme von"_ povedzte: _"_**_o 10 minút pojdeme na
      školský dvor._**_"_
          
      *   namiesto : _"bude to kreatívna aktivita"_ povedzte: _"_**_Budeme
      maľovať štetcom a farbami. Každý si vyberie, čo chce namaľovať – môžete si
      vybrať - buď dom, zviera alebo les_**_.“_
          
      *   namiesto: _"dnes bude malá zmena"_ povedzte: "**_dnes na tretej hodine
      príde namiesto pani učiteľky Novákovej pán učiteľ Rozák. Pani učiteľka
      Nováková ochorela_**_"._
          
      *   namiesto: _"urob to po svojom"_ povedzte: **_môžeš si vybrať, či tú
      úlohu nakreslíš, alebo napíšeš. Obe možnosti sú správne."_**
          
      *   namiesto: _"napíš krátky text o svojom víkende"_ povedzte: _"_**_napíš
      jeden odstavec, teda 3-5 viet o tom, čo si robil cez víkend_**_"._
          
      *   namiesto _"ideme to rozlúsknúť"_ povedzte _"_**_skúsime túto úlohu
      vyriešiť krok po kroku. Začneme prvou časťou."_**
          
      *   _namiesto: "uteká nám čas"_ povedzte "**_máme 5 minút na dokončenie
      úlohy_**_"._
          

      ### 🧠Tip


      Ak použijete obrazné vyjadrenie zo zvyku (čo je bežné), hneď ho preložte
      do konkrétnosti.


      ### Prečo je to dôležité?


      Jazyk, ktorý používame, je plný nejednoznačností, metafor a obrazných
      pomenovaní - to si častokrát ani neuvedomujeme. My všetci vrátane učiteľov
      ich často používajú zo zvyku, no pre autistických žiakov môžu byť takéto
      vyjadrenia nejasné. Ak pokyny formulujeme jednoducho a konkrétne,
      znižujeme riziko nedorozumení a podporujeme lepšie porozumenie aj vzájomný
      rešpekt v triede.
    uuid: 54c7cb38-947b-4019-9b4e-68f31f50284f
  - title: "3. Oboznámte žiaka s prostredím "
    body: >-
      Neznáme prostredie môže byť zdrojom veľkého stresu.


      **Táto stratégia je vhodná napríklad, ak:**


      *   žiak nastupuje do novej školy,
          
      *   začína novú aktivitu,
          
      *   mení kolektív alebo triedu.
          

      **Čo môžete urobiť:**


      *   Ukážte žiakovi, kam bude chodiť do školy, kde je jeho trieda, šatňa,
      toalety, jedáleň, zborovňa a pod.
          
      *   Zoznámte ho s učiteľmi – pomôžu fotografie, menovky, jednoduchá mapa
      školy.
          
      *   Ukážte miesta, kam sa bude chodiť na telesnú výchovu alebo na
      špeciálne predmety.
          
      *   Preveďte ho týmito miestami ešte pred začiatkom oficiálnej výučby.
          

      🧩 **Prečo:**  

      Dieťa nemôže vedieť, čo sa od neho očakáva, ak mu to nikto neukázal.  

      Pokyn _„choď zaklopať do zborovne“_ nie je zrozumiteľný, ak nevie, kde
      zborovňa je.  

      Rovnako „_ideme na obed“_ nemusí dávať zmysel, ak žiak nepozná cestu do
      jedálne.


      Niektoré deti si v takých situáciách pomôžu tým, že sledujú ostatných –
      _„idú s prúdom“_. Je to úctyhodná schopnosť prispôsobiť sa, no **nie
      všetky deti ju majú prirodzene rozvinutú.**  

      Predpokladať, že sa každý žiak v novom prostredí zorientuje sám, môže
      viesť k zbytočnému stresu či frustrácii. Tomuto sa dá predísť práve
      **prípravou a postupným zoznámením sa s prostredím.**


      ✨ **Žiaci s Aspergerom**  

      U nich môže už len predstava nového prostredia vyvolať úzkosť. Pomáha
      preto, ak dostanú možnosť:


      *   pozrieť si fotografie miest,
          
      *   vopred prejsť trasu,
          
      *   mať v začiatkoch po boku sprievodnú osobu, ktorej dôverujú,
          
      *   mať informáciu o tom, na koho sa obrátiť a ako ho kontaktovať, ak
      "niečo nejde podľa plánu".
    uuid: f03ff9d3-c224-4111-8d1a-87c397dd4ecf
