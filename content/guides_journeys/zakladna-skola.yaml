description: Rýchly sprievodca, ako pochopiť a podporiť žiaka v prostredí základnej školy.
steps:
  - title: Čo dieťa, to unikát
    body: >-
      Každé dieťa je jedinečné – aj medzi deťmi s rovnakou diagnózou môžu byť
      obrovské rozdiely v tom, ako vnímajú svet, ako reagujú, čo potrebujú a čo
      im pomáha.


      To, čo je pre jedno dieťa kľúčové, môže byť pre iné nepodstatné alebo
      dokonca rušivé. Preto všetky stratégie, ktoré ďalej ponúkame, berte ako
      **inšpiráciu**, nie ako univerzálny recept.


      🔍 **Dôležité je poznať konkrétne dieťa.** Jeho povahu, potreby, prejavy
      stresu či radosti. Ak ho poznáte aspoň trochu, viete lepšie vyhodnotiť, čo
      môže pomôcť – a čo možno radšej vynechať.


      ✔️ Aj metóda _pokus – omyl_ má v procese svoje miesto. Hlavne, ak je
      sprevádzaná rešpektom, trpezlivosťou a ochotou upraviť prístup.
    uuid: 3bb78189-61f6-4f83-9548-b5312da6e7b7
  - title: 1. Zachovávajte predvídateľný režim dňa
    body: >-
      Žiaci potrebujú **stabilitu** – opakujúci sa režim im dáva **pocit istoty
      a bezpečia.**


      ### Čo preto viete urobiť?


      *   ak sa zavedie, ráno začína rovnakým rituálom (napríklad pozdravom),
          
      *   Povedzte a ukážte slovne aj **vizuálne** ( napr. rozvrhom), čo sa bude
      diať počas dňa,
          
      *   Včask ohláste každú zmenu. Ak je to možné, podporte ju vizuálne
      (fotkou, obrázkom).
          
          *   Príklady
              
              *   ak bude niekto zastupovať, ukážte na rozvrhu, kedy a kto príde, prípadne aj fotografiu učiteľa.
                  
              *   ak sa mení miesto vyučovania, na začiatku hodiny vysvetlite, kam idete a prečo:
                  
                  *   _"na tejto hodine nebudeme celý čas v triede. Ideme na školský areál."_ (ukázať fotku areálu),
                      
                  *   "_Budeme pozorovať stromy a kvety, ktoré v triede nemáme."_. (vysvetlite, prečo)

                      

      ### ✨Žiaci s Aspergerom


      Aspergeri môžu vyzerať „v pohode“, ale vnútorný stres majú z vecí, ktoré
      **nie sú dopredu jasne povedané.**  

      Nie vždy sa spýtajú – ale **neistota môže spôsobiť úzkosť, zablokovanie
      alebo odmietnutie spolupráce.**


      🔸 **Buďte ešte konkrétnejší než zvyčajne**  

      Nielen „ideme von“, ale:  

      „O 10 minút ideme na školský dvor. Budete tam so mnou a s pani učiteľkou
      Novákovou. Na školskom dvore budeme približne 20 minút. Potom sa vrátime
      do triedy, kde budeme pokračovať v práci.“


      🔸 **Pri zmene (akejkoľvek) vysvetlite dôvod**  

      Napr.: **_zmena poradia aktivít_**  

      „Najprv sme mali mať čítanie, ale ideme teraz von, lebo sa má pokaziť
      počasie. Čítanie si spravíme po návrate.“


      ### Prečo je to dôležité?


      **Zásah do pocitov istoty a bezpečia.**


      Každé ráno prídete do triedy a pozdravíte sa so žiakmi. Ak jedno ráno
      neprídete alebo sa nepozdravíte (čo je zároveň aj začiatok témy, ktorú
      budete so žiakmi rozoberať), pre vás to môže byť len drobný prvok
      vyučovania.


      Pre žiaka/žiačku s Aspergerom to môže znamenať zásadný zásah do jeho
      pocitu bezpečia. To môže vyvolať nadmerné premýšľanie a úzkostné stavy,
      ktoré vedú k obavám, čo sa ešte môže zmeniť.
    uuid: f7eda01d-bdcb-4ca5-b11f-c969fc9e6780
  - title: 2. Hovorte jasne a konkrétne
    body: >-
      **Čo je jasné pre Vás, nemusí byť jasné pre žiaka.**


      Autistickí žiaci potrebujú **presné** a **zrozumiteľné** informácie, aby
      sa cítili bezpečne a **vedeli, čo sa od nich očakáva.** Hovoriť jasne
      znamená používať jednoduché vety, vyhnúť sa nejasnostiam a nepredpokladať,
      že žiaci chápu narážky alebo nepriame vyjadrenia.


      *   namiesto _"čoskoro pôjdeme von"_ povedzte: _"o 10 minút pojdeme na
      školský dvor."_
          
      *   namiesto : _"bude to kreatívna aktivita"_ povedzte: _"Budeme maľovať
      štetcom a farbami. Každý si vyberie, čo chce namaľovať – môžete si vybrať
      - buď dom, zviera alebo les.“_
          
      *   namiesto: _"dnes bude malá zmena"_ povedzte: "_dnes na tretej hodine
      príde namiesto pani učiteľky Novákovej pán učiteľ Rozák"._
          
      *   namiesto: _"urob to po svojom"_ povedzte: _môžeš si vybrať, či tú
      úlohu nakreslíš, alebo napíšeš. Obe možnosti sú správne."_
          
      *   namiesto: _"napíš krátky text o svojom víkende"_ povedzte: _"napíš
      jeden odstavec - teda 3-5 viet - o tom, čo si robil cez víkend"._
          
      *   namiesto _"ideme to rozlúsknúť"_ povedzte _"skúsime túto úlohu
      vyriešiť krok po kroku. Začneme prvou časťou."_
          
      *   _namiesto: "uteká nám čas"_ povedzte "_máme 5 minút na dokončenie
      úlohy"._
          

      ### 🧠Tip  

      Ak učiteľ použije obrazné vyjadrenie zo zvyku ( čo je bežné), je dobré
      hneď ho preložiť do konkrétneho jazyka.


      Prečo je to dôležité?  
        
      Ak hovoríme jasne, deti nám rozumejú.  

      Ak hovoríme nejasne, vzniká zmätok – nie zámer.  

      Nie je to vzdor, je to potreba porozumenia.  

      Keď prispôsobíme jazyk, komunikácia sa stane férovejšou a učenie
      pokojnejším.
    uuid: 54c7cb38-947b-4019-9b4e-68f31f50284f
