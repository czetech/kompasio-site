  Postup, ako si dotazník vyhodnotiť v pohodlí vášho domova.
steps:
  - title: Čo je M-CHAT Rtm
    body: >-
      Ide o skríningovú metódu, ktorá zachytáva riziko autizmu u malých detí
      (16-30 mesiacov).  

      Obsahuje 20 otázok, na ktoré rodič odpovedá áno, alebo nie.


      Dotazník **nie je diagnostickým nástrojom**, ale pomáha určiť, či je
      vhodné odporučiť dieťa na odborné vyšetrenie (na diagnostický proces).
    uuid: 947bb26d-f37a-4472-bf76-92059b50b9e8
  - title: Otázky
    body: >-
      Vezmite si papier a pero a odpovedzte na otázky. Zapíšte si vždy číslo
      otázky a odpoveď.


      | Číslo | Otázka | Možnosti |

      | --- | --- | --- |

      | 1   | Ak ukážete na hračku cez miestnosť, pozerá Vaše dieťa na ňu?
      (napríklad ak ukážete na hračku alebo zvieratko, pozrie sa dieťa na tú
      hračku alebo zvieratko) | Áno / Nie |

      | 2   | Mali ste niekedy obavy, že vaše dieťa nepočuje? | Áno / Nie |

      | 3   | Hrá sa Vaše dieťa tak, že napodobňuje niečo alebo sa hrá s
      predstieraním niečoho? (napríklad napodobňuje, že pije z prázdneho
      pohárika, napodobňuje, že telefonuje alebo napodobňuje, že kŕmi bábiku
      alebo plyšovú hračku) | Áno / Nie |

      | 4   | Vylieza rado Vaše dieťa na predmety? (napríklad na nábytok, na
      preliezky, po schodoch) | Áno / Nie |

      | 5   | Robí dieťa nezvyčajné pohyby prstami blízko očí? (napríklad
      pohybuje prstami hore dole blízko svojich očí) | Áno / Nie |

      | 6   | Ukazuje Vaše dieťa ukazováčikom, ak niečo chce alebo si pýta takto
      pomoc? (napríklad ukáže na jedlo alebo hračku, na ktoré nedočiahne) | Áno
      / Nie |

      | 7   | Ukazuje ukazováčikom na niečo, čo ho zaujalo? (napríklad ukáže na
      lietadlo na oblohe alebo na veľké nákladné auto na ceste) | Áno / Nie |

      | 8   | Prejavuje Vaše dieťa primeraný záujem o iné deti? (napríklad
      pozoruje druhé deti, usmeje sa na ne alebo ide k nim) | Áno / Nie |

      | 9   | Prináša Vám Vaše dieťa veci, aby vám ich ukázalo – nielen aby ste
      mu pomohli, ale len aby sa s Vami podelilo o zážitok? (napríklad ukáže Vám
      kvetinku, plyšovú hračku alebo autíčko) | Áno / Nie |

      | 10  | Reaguje Vaše dieťa na oslovenie svojim menom? (napríklad keď ho
      oslovíte jeho menom, pozrie sa, povie niečo, vydá zvuk alebo zastaví, čo
      práve robí) | Áno / Nie |

      | 11  | Usmeje sa Vaše dieťa na Vás, keď sa vy usmejete na neho? | Áno /
      Nie |

      | 12  | Znepokojujú Vaše dieťa bežné zvuky? (napríklad kričí alebo plače
      kvôli hluku ako je zvuk vysávača alebo hlučnejšia hudba) | Áno / Nie |

      | 13  | Chodí Vaše dieťa? | Áno / Nie |

      | 14  | Pozerá Vám dieťa do očí, keď s ním hovoríte, hráte sa s ním alebo
      ho obliekate? | Áno / Nie |

      | 15  | Snaží sa napodobňovať, čo robíte? (napríklad zakýva Vám, zatlieska
      alebo zopakuje zvuky po Vás) | Áno / Nie |

      | 16  | Ak otočíte hlavou, aby ste sa na niečo pozreli, obzrie sa Vaše
      dieťa, aby videlo na čo sa pozeráte? | Áno / Nie |

      | 17  | Snaží sa Vaše dieťa, aby ste mu venovali pozornosť? (napríklad
      pozrie sa na Vás, aby ste ho pochválili alebo povie „pozri sa“ alebo
      „pozeraj sa na mňa“) | Áno / Nie |

      | 18  | Rozumie dieťa, ak mu poviete, aby niečo urobilo? (napríklad keď
      neukážete prstom, porozumie slovám „daj knihu na stoličku“ alebo „dones mi
      tvoju deku“) | Áno / Nie |

      | 19  | Ak sa stane niečo nové, pozrie sa dieťa na Vás, aby zistilo, čo si
      o tom myslíte? (napríklad ak počuje zvláštny alebo smiešny zvuk, vidí novú
      hračku, pozrie sa na Vás) | Áno / Nie |

      | 20  | Má Vaše dieťa rado pohybové aktivity? (napríklad hojdanie sa alebo
      nadhadzovanie na Vašich kolenách) | Áno / Nie |
    tasks:
      - body: odpovede zakrúžkované
        uuid: d44a8ca6-6ed3-42fb-8368-a4e3053f316d
    uuid: cca1cf25-d224-4954-a467-0868161959b9
  - title: Skórovanie
    body: |-
      Ako vyhodnotiť dotazník:

      Pri otázkach:

      *   2, 5 a 12 , ak ste uviedli "ÁNO" pripočítajte za každú odpoveď 1 bod.
          
      *   pri ostatných otázkach pripočítajte 1 bod za každú odpoveď "NIE".
          

      Body spočítajte.
    tasks:
      - body: Skontrolované a body spočítané
        uuid: f87c3e8e-d57e-4cb2-ab66-8586ca7eb656
    uuid: 89f80e6a-4195-4f70-855a-8fd25587df76
  - title: "Vyhodnotenie M-CHAT "
    body: >-
      | Skóre | Ďalší posup |

      | --- | --- |

      | 0-2 body | nie je potrebné ďalšie vyšetrenie PAS (na autizmus) |

      | 3-7 bodov | nutné pokračovať v overovaní v spolupráci s odborníkmi |

      | 8-20 bodov | Skríning je pozitívny, dieťa treba odoslať k špecialistom
      na diagnostiu ohľadom možného PAS (autizmu). |


      Vysvetlenie:


      *   pokiaľ ste dosiahli 0-2 body, nie je predpoklad, že by sa jednalo o
      autizmus.
          
      *   pokiaľ ste v dotazníku dosiahli 3-7 bodov, bolo by vhodné poradiť sa s
      odborníkmi. Mali by ste pokračovať v pátraní a osloviť diagnostické centrá
      a osloviť ich - informovať, aký ste dosiahli výsledok v tomto skríningovom
      teste a dôvody, prečo ste sa rozhodli uskutočniť si tento skríningový
      test.
          
      *   ak výsledok v dotazníku je 8 a viac bodov, taktiež sa odporúča osloviť
      zariadenie, ktoré vykonáva diagnostiku autizmu a podstúpiť ju.
          

      ### 📌Dobré vedieť


      Dotazník slúži iba ako orientačný skríningový nástroj, nie ako
      diagnostický nástroj. Pozitívny výsledok v dotazníku neznamená
      automaticky, že dieťa má autizmus, ale že je vhodné vykonať podrobnejšie
      odborné vyšetrenie.  

      V praxi to znamená, že **nie všetky deti**, **ktoré dosiahnu pozitívny
      výsledok** v dotazníku **budú mať nakoniec diagnostikovaný autizmus.
      Neplatí toto pravidlo.**  

      Tento **nástroj dáva rodičom možnosť včas zachytiť prípadnú odchýlku** vo
      vývine dieťaťa a následne vyhľadať odbornú pomoc.


      Zoznam inštitúcií, ktoré vykonávajú diagnostiku autizmu Vám prinášame [na
      tomto linku.](/app/sk/map/zoznam/?category%5B0%5D=22)


      Ak Vás zaujíma, prečo je diagnostika dôležitá a ako prebieha, pokračujte v
      čítaní [na tomto
      odkaze.](/zivotne-situacie/diagnostika-autizmu-preco-kde-kedy-ako-a-kto)


