title: Preukaz PAS - čo je to a na čo slúži
category: 0672d6e8-1771-46a1-9520-42437b3f2026
type: knowledge
description: Základné informácie o preukaze PAS
steps:
  - title: Čo je preukaz PAS a načo slúži?
    body: >-
      *   📄 Je to osobitná forma výpisu zo zdravotnej dokumentácie,
          
      *   👤 **slúži na identifikáciu pacienta s poruchou autistického spektra**
      (ďalej len „PAS“)
          
      *   📋 obsahuje údaje potrebné na ďalšie poskytovanie zdravotnej
      starostlivosti (ďalej len “ZS”), slúžiace najmä na zabezpečenie potrebného
      individuálneho prístupu k pacientovi.
          

      ### Individuálny prístup k pacientovi môže zahŕňať:


      *   🗣️ osobitné komunikačné stratégie,
          
      *   🏥 úpravu prostredia, v ktorom sa ZS poskytuje,
          
      *   💊 vybrané farmakologické postupy,
          
      *   ℹ️ informovanie pacienta alebo sprevádzajúcej či opatrujúcej osoby o
      potrebných postupoch.
          

      Cieľom je zabezpečiť optimálnu zdravotnú prevenciu (od predchádzania
      problémom až po zabránenie zbytočným zásahom – tzv. primárna až kvartérna
      prevencia).  

      U osôb s PAS je zároveň častejší výskyt **zanedbanej zdravotnej
      starostlivosti**.
    uuid: b44ae805-28e7-4030-a65d-a83bb8eabe17
  - title: "Aký je účel preukazu PAS? "
    body: >-
      PAS preukaz ako osobitná forma výpisu zo zdravotnej dokumentácie:


      *   💬 slúži ako **podporný komunikačný nástroj** pri poskytovaní a
      zabezpečovaní potrebnej zdravotnej starostlivosti osobe s PAS.
          
      *   📑 Obsahuje údaje dôležité pre **zabezpečenie individuálneho prístupu
      a rovnosti v prístupe k ZS**.
          

      \_\_\_\_\_\_\_\_\_\_\_\_


      PAS preukaz **uľahčuje držiteľovi komunikáciu** v rôznych životných
      situáciách:


      *   🏛️ komunikácia s úradmi,
          
      *   👮‍♂️ kontakt s príslušníkmi ozbrojených zborov,
          
      *   🚌 cestovanie vo verejnej doprave,
          
      *   🚑 krízové situácie (havária, úraz, požiar, strata rodiny,
      neprítomnosť sprevádzajúcej osoby),
          
      *   🏥 akútna ZS alebo hospitalizácia (senzoricky alebo situačne náročné
      vyšetrenia v rámci plánovanej ZS).
    uuid: d93c78b3-04e2-48d9-b8b6-4c462e2cc739
  - title: Kto vydáva preukaz PAS? Kde žiadať o preukaz PAS?
    body: >-
      *   👨‍⚕️ Preukaz PAS vydáva **poskytovateľ zdravotnej starostlivosti v
      špecializačnom odbore psychiatria alebo detská psychiatria.**
          
      *   📞 Ak máte záujem o PAS preukaz pre seba alebo pre dieťa,
      **kontaktujte psychiatra alebo detského psychiatra.**
    uuid: 16e8703d-2784-4ea8-801e-efc196f7b46a
  - title: |
      Kto si môže žiadať o preukaz PAS? 
    body: |-
      *   👤 Fyzická osoba s potvrdenou diagnózou PAS,
          
      *   👨‍👩‍👦 alebo jej zákonný zástupca.
    uuid: 5ceb75d3-cd73-4b92-9540-6970e3717d1e
  - title: "Aké údaje sa nachádzajú na preukaze PAS? "
    body: >-
      1.  Identifikačné údaje držiteľa PAS preukazu 👤🆔:
          
          1.  🧍 meno, priezvisko, dátum narodenia a bydlisko
              
          2.  📸 Fotografia

              
      2.  Kontaktné tel. číslo 📞:
          
          1.  📱 na blízku osobu,
              
          2.  🩺 všeobecného lekára,
              
          3.  🧠 ošetrujúceho psychiatra alebo detského psychiatra.

              
      3.  Základné údaje o prejavoch PAS a iných dôležitých okolnostiach
      súvisiacich so zdravotným stavom:
          
          1.  porozumenie hovorenému slovu,
              
          2.  užívanie liekov,
              
          3.  stravovacie obmedzenia,
              
          4.  hypersenzitívna reaktivita,
              
          5.  behaviorálne prejavy v stresových situáciách,
              
          6.  okolnosti podnecujúce impulzívne konanie.

              
      4.  Komunikačný profil 🗣️:
          
          1.  u **verbálnych osôb** – špecifiká reči
              
          2.  u **neverbálnych osôb** – spôsob komunikácie (alternatívna komunikácia, pomôcky)

              
      5.  Poučenie pre verejnosť o poruche PAS 📖
          
      6.  Dátum vydania PAS 📅
          
      7.  Pečiatka poskytovateľa a podpis určeného lekára. 🖋️
    uuid: 22039d68-9739-45d7-a0b0-731cbe8d270a
