title: Preukaz PAS - čo je to a na čo slúži
category: 0672d6e8-1771-46a1-9520-42437b3f2026
description: Základné informácie o preukaze PAS
steps:
  - title: ČO JE PREUKAZ PAS A AKO VYZERÁ?
    body: >-
      📄 Je to **osobitná forma výpisu zo zdravotnej dokumentácie**,

        
      👤 slúži na **identifikáciu pacienta s poruchou autistického spektra
      (ďalej len „PAS“)**

        
      📋 obsahuje údaje potrebné na ďalšie poskytovanie **zdravotnej
      starostlivosti (ďalej len “ZS”)**,

        
      🎯 slúžiace najmä na **zabezpečenie potrebného individuálneho prístupu k
      pacientovi**.


      Individuálny prístup k pacientovi môže zahŕňať:  

      🗣️ osobitné komunikačné stratégie,  

      🏥 úpravu prostredia, v ktorom sa ZS poskytuje,  

      💊 vybrané farmakologické postupy,  

      ℹ️ informovanie pacienta alebo sprevádzajúcej či opatrujúcej osoby o
      potrebných postupoch  

      ➡️ cieľ: **zabezpečenie optimálnej primárnej až kvartérnej zdravotnej
      prevencie**.
    uuid: b44ae805-28e7-4030-a65d-a83bb8eabe17
  - title: AKÝ JE ÚČEL PREUKAZU PAS?
    body: >-
      📄 PAS preukaz ako osobitná forma výpisu zo zdravotnej dokumentácie:  

      💬 slúži ako **podporný komunikačný nástroj** pri poskytovaní a
      zabezpečovaní potrebnej zdravotnej starostlivosti osobe s PAS.  

      📑 Obsahuje údaje dôležité pre **zabezpečenie individuálneho prístupu a
      rovnosti v prístupe k ZS**,  

      🚨 u osôb s PAS je častejší výskyt **zanedbanej zdravotnej
      starostlivosti**.


      PAS preukaz **uľahčuje držiteľovi komunikáciu** v rôznych životných
      situáciách:


      *   🏛️ komunikácia s úradmi,
          
      *   👮‍♂️ kontakt s príslušníkmi ozbrojených zborov,
          
      *   🚌 cestovanie vo verejnej doprave,
          
      *   🚑 krízové situácie (havária, úraz, požiar, strata rodiny,
      neprítomnosť sprevádzajúcej osoby),
          
      *   🏥 akútna ZS alebo hospitalizácia (senzoricky alebo situačne náročné
      vyšetrenia v rámci plánovanej ZS).
    uuid: d93c78b3-04e2-48d9-b8b6-4c462e2cc739
  - title: KTO VYDÁVA PREUKAZ PAS? KDE OŇ ŽIADAŤ?
    body: >-
      👨‍⚕️ Preukaz PAS vydáva **poskytovateľ zdravotnej starostlivosti v
      špecializačnom odbore psychiatria alebo detská psychiatria**.


      📞 Ak máte záujem o PAS preukaz pre seba alebo pre dieťa, **kontaktujte
      psychiatra alebo detského psychiatra.**
    uuid: 16e8703d-2784-4ea8-801e-efc196f7b46a
  - title: |
      KTO SI MÔŽE ŽIADAŤ O PREUKAZ PAS?
    body: |-
      ✅ Fyzická osoba s potvrdenou diagnózou PAS  
      👨‍👩‍👦 Alebo jej zákonný zástupca
    uuid: 5ceb75d3-cd73-4b92-9540-6970e3717d1e
  - title: AKÉ ÚDAJE SA NACHÁDZAJÚ NA PREUKAZE PAS?
    body: >-
      📸 Fotografia a identifikačné údaje držiteľa PAS preukazu:


      *   🧍 meno, priezvisko, dátum narodenia a bydlisko


      📞 Kontaktné tel. číslo:


      *   📱 na blízku osobu
          
      *   🩺 všeobecného lekára
          
      *   🧠 ošetrujúceho psychiatra alebo detského psychiatra
          

      🧾 Základné údaje o prejavoch PAS a iných dôležitých okolnostiach
      súvisiacich so zdravotným stavom:


      *   porozumenie hovorenému slovu,
          
      *   užívanie liekov,
          
      *   stravovacie obmedzenia,
          
      *   hypersenzitívna reaktivita,
          
      *   behaviorálne prejavy v stresových situáciách,
          
      *   okolnosti podnecujúce impulzívne konanie.
          

      🗣️ Komunikačný profil:


      *   u **verbálnych osôb** – špecifiká reči
          
      *   u **neverbálnych osôb** – spôsob komunikácie (alternatívna
      komunikácia, pomôcky)
          

      📖 Poučenie pre verejnosť o poruche PAS  

      📅 Dátum vydania PAS  

      🖋️ Pečiatka poskytovateľa a podpis určeného lekára
    uuid: 22039d68-9739-45d7-a0b0-731cbe8d270a
  - title: |
      ČASTO KLADENÉ OTÁZKY
    body: >-
      ### **💵 JE PREUKAZ PAS SPOPLATNENÝ?**


      **Nemal by byť.** Podľa **Vestníka MZ SR, čiastka 29-38 zo dňa 30.07.2024,
      Ročník 72, článok IX., bod 2)**:  

      “Vydanie PAS preukazu je bezodplatné.”  

      Ak sa špecialista pýta poplatok za jeho vydanie, **upozorni ho na tento
      Vestník**.  

      Celé znenie je dostupné na stránke MZ SR.


      ### **❓JE PREUKAZ PAS SPOPLATNENÝ?**


      **Preukaz PAS bol na Slovensku zavedený v roku 2020**.  

      Zatiaľ ho **veľa inštitúcií nepozná** – nie je tak rozšírený ako ŤZP
      preukaz.  

      Každý držiteľ PAS preukazu však **pomáha šíriť povedomie** tým, že ho
      používa.  

      Tým vzdeláva spoločnosť o jeho **existencii, význame a funkcii**.


      ### **🔄 Je  PAS PREUKAZ TO ISTÉ AKO  ŤZP PREUKAZ?**


      ### Nie, PAS preukaz nie je to isté ako ŤZP preukaz.


      ### **🧠 PAS PREUKAZ:**


      📌Vydáva: psychiater / detský psychiater  

      🏛️ Jurisdikcia: Ministerstvo zdravotníctva SR (MZ SR)  

      🎯 Určený: výlučne pre osoby s potvrdenou diagnózou autizmu (PAS)  

      📋 Slúži na rýchle preukázanie diagnózy v zdravotníckych, krízových,
      dopravných a úradných situáciách  

      🧭 Pomáha navodiť porozumenie v situáciách, ktoré sú **pre osoby s PAS
      náročné a stresujúce**


      * * *


      ### **♿ ŤZP PREUKAZ:**


      📌Vydáva: Úrad práce, sociálnych vecí a rodiny  

      🏛️ Jurisdikcia: Ministerstvo práce, sociálnych vecí a rodiny (MPSVaR)  

      ⚖️ Posudzuje: posudkový lekár sociálnej poisťovne  

      🧾 Podmienka: funkčné postihnutie >50 %  

      👥 Platí pre rôzne diagnózy (napr. diabetici s potrebou inzulínu, pohybové
      poruchy a pod.)  

      📉 PAS nemusí automaticky znamenať nárok na ŤZP preukaz!


      **🧩 AKÝ JE ROZDIEL?**


      |     |     |     |

      | --- | --- | --- |

      | <p style="text-align: center"><strong>🔹</strong></p> | <p
      style="text-align: center"><strong>PAS PREUKAZ</strong></p> | <p
      style="text-align: center"><strong>ŤZP PREUKAZ</strong></p> |

      | 🎯 Účel | Rýchla identifikácia osoby s autizmom | Preukázanie
      zdravotného znevýhodnenia |

      | 🏛️ Jurisdikcia | Ministerstvo zdravotníctva (MZ SR) | Ministerstvo
      práce (MPSVaR) |

      | 👨‍⚕️ Kto vydáva | Psychiater | Úrad práce, na základe posudku |

      | 💊 Diagnóza | Výlučne PAS (autizmus) | Rôzne postihnutia |

      | 🏷️ Výhoda | Údaje o komunikácii, správaní, citlivosti atď. | Zľavy,
      výhody, sprievodca |

      | 🧾Vydanie | Bezodplatné | Na základe posudku posudkového lekára |


      **Oba preukazy slúžia na zlepšenie prístupu k službám a zníženie bariér
      pre osoby so zdravotným postihnutím.**
