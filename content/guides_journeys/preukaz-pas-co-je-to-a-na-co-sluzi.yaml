  - title: |
      Často kladené otázky
    body: >-
      ### **JE PREUKAZ PAS SPOPLATNENÝ?** 💰


      **Nemal by byť.**


      Podľa _Vestníka MZ SR, čiastka 29-38 zo dňa 30.07.2024, Ročník 72, článok
      IX., bod 2):_  

      **“Vydanie PAS preukazu je bezodplatné.”**


      Ak si špecialista pýta poplatok za jeho vydanie, **upozorni ho na tento
      Vestník**. Celé znenie je dostupné na stránke [_<u>MZ
      SR.</u>_](https://www.health.gov.sk/?vestniky-mz-sr)


      ### **POZNAJÚ INŠTITÚCIE PREUKAZ PAS?**


      **Preukaz PAS bol na Slovensku zavedený v roku 2020**.


      Zatiaľ ho **veľa inštitúcií nepozná** – nie je tak rozšírený ako ŤZP
      preukaz.


      Každý držiteľ PAS preukazu však **pomáha šíriť povedomie** tým, že ho
      používa.  

      Tým vzdeláva spoločnosť o jeho **existencii, význame a funkcii**.


      ### **Je  PAS PREUKAZ TO ISTÉ AKO  ŤZP PREUKAZ?**


      Nie, PAS preukaz nie je to isté ako ŤZP preukaz.


      ### **🧩 AKÝ JE ROZDIEL?**


      |     |     |     |

      | --- | --- | --- |

      | <p style="text-align: center">🔹</p> | <p style="text-align: center">PAS
      PREUKAZ</p> | <p style="text-align: center">ŤZP PREUKAZ</p> |

      | <p style="text-align: center">🎯<br>Účel</p> | Rýchla identifikácia
      osoby s autizmom | Preukázanie zdrav. znevýhodnenia |

      | <p style="text-align: center">🏛️ Jurisdikcia</p> | Ministerstvo
      zdravotníctva | Ministerstvo práce |

      | <p style="text-align: center">👨‍⚕️<br>Kto vydáva</p> | Psychiater |
      Úrad práce, na základe posudku |

      | <p style="text-align: center">💊<br>Diagnóza</p> | Výlučne PAS
      (autizmus) | Rôzne postihnutia |

      | <p style="text-align: center">🏷️<br>Výhoda</p> | Údaje o komunikácii,
      správaní, citlivosti atď. | Zľavy, výhody, sprievodca |

      | <p style="text-align: center">🧾<br>Vydanie</p> | Bezodplatne (malo by
      byť) | Na základe posudku posudkového lekára, bezodplatne.<br><br>Nie
      každá osoba s poruchou autistického spektra sa automaticky stáva ŤZP
      osobou |


      **Oba preukazy slúžia na zlepšenie prístupu k službám a zníženie bariér
      pre osoby so zdravotným znevýhodnením.**
    uuid: 33f6b66f-148a-457a-a01e-4dbdda10841d
