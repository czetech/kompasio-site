title: "Diagnostika autizmu: prečo, kde, kedy, ako a kto "
category: 0672d6e8-1771-46a1-9520-42437b3f2026
type: knowledge
description: >-
  **Zameranie:** bežný čitateľ (rodič, laik)


  Máte podozrenie, že vaše dieťa môže byť na autistickom spektre? Rýchly
  sprievodca do sveta diagnostiky.
steps:
  - title: "Prečo by sa diagnostika mala riešiť "
    body: >-
      Diagnostika poruchy autistického spektra (PAS) nie je len pomenovanie
      odlišnosti - je to **proces porozumenia**, prečo dieťa vníma svet inak,
      reaguje inak a čo potrebuje. Dáva rodičom a ľuďom na autistickom spektre
      odpovede na otázku: "Čo sa deje a prečo sa to deje".


      **<u>Včasná</u> a <u>kvalitná</u> diagnostika** pomáha:


      *   pochopiť správanie dieťaťa (napr. komunikačné ťažkosti, "záchvaty
      zlosti", výbuchy, zdanlivý nezáujem)
          
      *   nastaviť správnu **podporu** doma, v škole aj v terapii,
          
      *   získať **prístup k službám, príspevkom a úľavám,**
          
      *   predísť zbytočnému stresu a nesprávnemu zaradeniu dieťaťa (napr. ako
      neposlušné alebo „problémové“)
          

      Diagnóza nie je nálepka – je to **nástroj na pomoc**, nie obmedzenie.
    uuid: 2f16dcb1-1135-484c-b100-e288343a466d
  - title: "Dva pojmy: Diagnostika a Potvrdenie diagnózy"
    body: >-
      Ide o dva rozličné pojmy.


      ### Čo je diagnostika?


      **Diagnostika** je celý **proces zisťovania a posudzovania**, ktorý vedie
      k lepšiemu pochopeniu toho, či a aká porucha alebo stav u človeka
      existuje. Môže zahŕňať:


      *   rozhovory s rodičmi alebo klientom,
          
      *   pozorovanie správania,
          
      *   psychologické a špeciálno-pedagogické testovanie,
          
      *   dotazníky, škály,
          
      *   zber anamnestických údajov,
          
      *   spoluprácu viacerých odborníkov (napr. psychológ, logopéd, neurológ,
      atď).
          

      Je to **proces skúmania**, nie definitívne rozhodnutie.


      ### Čo je potvrdenie diagnózy?


      **Potvrdenie diagnózy** znamená, že odborník (lekár) **oficiálne
      rozhodne,** že človek spĺňa kritériá pre konkrétnu poruchu – napríklad
      **poruchu autistického spektra (PAS)**.


      Diagnózu môže **stanoviť** iba odborník s príslušnou kvalifikáciou –
      napríklad:


      *   **psychiater**,
          
      *   **pedopsychiater**.
          

      ### Prečo práve oni?


      Veľmi zjednodušene povedané - zdravotnú dokumentáciu majú na starosti
      lekári a oblasť autizmu spadá do kompetencie psychiatrie.
    uuid: a5629d64-0a05-4057-abc6-ec5cb26c2c0e
  - title: 1. krok. Diagnostika
    body: >-
      Odborníci, ktorí môžu vykonávať diagnostiku:


      *   psychológovia v zariadeniach poradenstva a prevencie,
          
      *   klinický psychológovia,
          
      *   psychiatri.
          

      Psychiatri väčšinou nevykonávajú diagnostiku autizmu, nie je to však
      pravdilo.  

      Môžete naraziť na psychiatra/psychiatričku, ktorí diagnostiku vykonávajú
      (hlavne v súkromnom sektore).


      Diagnostiku preto vykonávajú psychológovia, ktorý prejdú celý proces
      diagnostiky s vami, alebo vami a vašim dieťaťom.
    uuid: 779dd6e2-823c-4140-a77e-2df8c9c88cad
  - title: Ako prebieha diagnostika
    body: >-
      ### Diagnostika zväčša prebieha:


      *   **Anamnéza s rodičom** – rozhovor o vývine, správaní, komunikácii
          
      *   **Pozorovanie dieťaťa** – štruktúrované aj neštruktúrované
          
      *   **Štandardizované testy** (pozri nižšie)
          
      *   **Záver a písomná správa** – predpoklady, návrhy intervencie,
      odporúčania
          

      ### Aké testy sa najčastie používajú:


      *   **ADOS-2 (Autism Diagnostic Observation Schedule)** – najuznávanejší
      diagnostický nástroj, používa sa aj v SR (nie všade)
          
      *   **ADI-R (Autism Diagnostic Interview – Revised)** – rozhovor s rodičom
          
      *   iné
          

      ADOS-2 je momentálne považovaný za zlatý štandard v diagnostike autizmu.
      Ide o štruktúrované pozorovanie správania, ktoré trvá 30–60 minút. Robí ho
      vyškolený psychológ alebo psychiater.
    uuid: e5b2abac-c5a9-4c43-b66e-f61811f6047d
  - title: Čo dostanem po diagnostike
    body: >-
      Po diagnostike u psychológa si Vás zväčša odborník zavolá na stretnutie,
      kde Vám poskytne dokumentáciu a odporúčania: Stretnutie sa nesie v duchu
      rozhovoru:


      *   **Písomná správa s predpokladom na diagnózu (ak diagnostiku vykonával
      psychológ),**
          
      *   popis pozorovania, výsledky testov,
          
      *   odporúčania: intervencie, školské zaradenie, ďalší odborníci.
    uuid: 26238c0d-1988-4787-a4d8-750761f85542
  - title: Kedy a ako sa objednať (čakacie doby)
    body: >-
      ### Čakacie doby sú v súčanosti veľmi dlhé.


      *   Diagnostika je možná už **od 1,5 – 2 rokov** pri výrazných príznakoch
          
      *   **Čakacie doby**:
          
          *   V nemocniciach a centrách: **8 -15 mesiacov**
              
          *   Súkromní odborníci: **4** **– 12 týždňov**, ale za poplatok

              

      Čakacie doby sa líšia – štátne zariadenia sú preťažené, preto sa rodičia
      často obracajú na súkromných odborníkov. Včasná diagnostika je však
      kľúčová, najmä do 3 rokov veku dieťaťa.
    uuid: 91961219-cea1-440f-8793-0568d4356f22
  - title: Záver - Diagnóza nie je nálepka - je to odpoveď
    body: >-
      Diagnostika autizmu a potvrdenie diagnózy psychiatrom môže byť náročný a
      emocionálne vyčerpávajúci proces.  

      Je však kľúčovým krokom k pochopeniu potrieb dieťaťa aj celej rodiny.  

      Čím skôr sa s ňou začne, tým skôr možno získať jasnosť, pomoc a pokoj.


      Ako sme písali v úvode – **diagnóza nie je nálepka**. Je to **odpoveď na
      otázky**, ktoré si rodičia často kladú:


      > _Prečo sa moje dieťa správa takto?_  

      > _Prečo reaguje inak ako ostatné deti?_  

      > _V čom spočíva tá odlišnosť?_


      Mnohí rodičia aj samotní ľudia na autistickom spektre opisujú po stanovení
      diagnózy **pocit úľavy** – nie preto, že by boli „označení“, ale preto, že
      **pochopili súvislosti**.


      Pre niektorých rodičov prichádza úľava hneď – pretože **majú odpoveď**.
      Iní sa najskôr zľaknú, majú obavy, čo bude ďalej. Ale časom väčšina z nich
      povie:


      > **„Som rád, že viem, čo sa deje. Teraz môžeme konať.“**


      A čo samotní ľudia na autistickom spektre? Aj u nich neprichádza úľava
      vždy okamžite. Ale **poznanie** im často umožní rozvíjať väčšiu
      **sebalásku a sebaprijatie**.  

      Keď sa v ich prostredí – doma, v škole, v práci – zavedú **opatrenia,
      ktoré im reálne pomáhajú**, často si prvýkrát uvedomia:


      > „Môže mi byť dobre. Nepotrebujem sa meniť. Ak okolie chápe, čo mi
      pomáha, cítim sa lepšie.“


      Preto platí:  

      👉 **Ak máte podozrenie na autizmus, nečakajte.** Aj preventívne
      vyšetrenie môže priniesť pokoj.  

      **Diagnostika nie je koniec. Je to začiatok cesty.**
    uuid: cdf15479-74ae-43cb-84de-020897557615
  - title: "2. krok Návšteva psychiatra & pedopsychiatra "
    body: >-
      Ako sme spomínali v kroku [Dva pojmy: Diagnostika a Potvrdenie
      diagnózy](https://kompasio-site-prod.apps.czetech.net/zivotne-situacie/diagnostika-autizmu-preco-kde-kedy-ako-a-kto/1)
      diagnostikou to nekončí. Ak potrebujete z akéhokoľvek dôvodu si dať
      potvrdiť diagnózu, musíte sa objednať k psychiatrovi alebo
      pedopsychiatrovi.


      Ako také stretnutie prebieha? Dobrý príklad z praxe vyzerá nasledovne:


      *   Prevezme si od vás dokumentáciu, ktorú máte (správy od iných lekárov a
      diagnostickú správu od psychológa alebo zariadenia poradenstva a
      prevencie, a pod.)
          
      *   rozhovor s Vami bez dieťaťa,
          
      *   následne vstupuje do ambulancie aj dieťa, ktoré čakalo v čakárni s
      iným rodinným príslušníkom, kým vy ste mali rozhovor s lekárom/lekárkou,
          
      *   sledovanie správanie dieťaťa v ambulancií a porovnanie so správami,
      ktoré si mal možnosť lekár prečítať
          
      *   odchod dieťaťa z ambulancie
    uuid: 36ef21dd-d819-4d37-bb25-f36f22538cca
