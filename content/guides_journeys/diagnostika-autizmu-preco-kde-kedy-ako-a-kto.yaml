title: "Diagnostika autizmu: prečo, kde, kedy, ako a kto "
category: 835563e8-f806-4d2e-9900-2bbaae14d409
type: knowledge
description: >-
  **Zameranie:** bežný čitateľ (rodič, laik)


  Rýchly sprievodca do sveta diagnostiky- prečo je dobré ju podstúpiť, ako
  prebieha a čo po nej nasleduje.
steps:
  - title: "Prečo by sa diagnostika mala riešiť "
    body: >-
      Diagnostika poruchy autistického spektra (PAS) nie je len pomenovanie
      odlišnosti - je to **proces porozumenia**, prečo dieťa vníma svet inak,
      reaguje inak a čo potrebuje. Dáva rodičom a ľuďom na autistickom spektre
      odpovede na otázku: "Čo sa deje a prečo sa to deje".


      **<u>Včasná</u> a <u>kvalitná</u> diagnostika** pomáha:


      *   pochopiť správanie dieťaťa (napr. komunikačné ťažkosti, "záchvaty
      zlosti", výbuchy, zdanlivý nezáujem),
          
      *   nastaviť správnu **podporu** doma, v škole aj v terapii,
          
      *   získať **prístup k službám, príspevkom a úľavám,**
          
      *   predísť zbytočnému stresu a nesprávnemu zaradeniu dieťaťa (napr. ako
      neposlušné alebo „problémové“)
          

      Diagnóza nie je nálepka – je to **nástroj na pomoc**, nie obmedzenie.
    uuid: 2f16dcb1-1135-484c-b100-e288343a466d
  - title: "Dva pojmy: Diagnostika a Potvrdenie diagnózy"
    body: >-
      Ide o dva rozličné pojmy.


      ### Čo je diagnostika?


      **Diagnostika** je celý **proces zisťovania a posudzovania**, ktorý vedie
      k lepšiemu pochopeniu toho, či a aká porucha alebo stav u človeka
      existuje. Môže zahŕňať:


      *   rozhovory s rodičmi alebo klientom,
          
      *   pozorovanie správania,
          
      *   psychologické a špeciálno-pedagogické testovanie,
          
      *   dotazníky, škály,
          
      *   zber anamnestických údajov,
          
      *   spoluprácu viacerých odborníkov (napr. psychológ, logopéd, neurológ,
      atď).
          

      Je to **proces skúmania**, nie definitívne rozhodnutie.


      ### Čo je potvrdenie diagnózy?


      **Potvrdenie diagnózy** znamená, že odborník (lekár) **oficiálne
      rozhodne,** že človek spĺňa kritériá pre konkrétnu poruchu – napríklad
      **poruchu autistického spektra (PAS)**.


      Diagnózu (diagnostický záver) môže **stanoviť** iba odborník s príslušnou
      kvalifikáciou – napríklad:


      *   **psychiater** (pri dospelých),
          
      *   **pedopsychiater** (pri deťoch).
          

      ### Prečo práve oni?


      Veľmi zjednodušene povedané - zdravotnú dokumentáciu majú na starosti
      lekári a oblasť autizmu spadá do kompetencie psychiatrie.
    uuid: a5629d64-0a05-4057-abc6-ec5cb26c2c0e
  - title: 1. krok. Diagnostika
    body: >-
      Odborníci, ktorí môžu vykonávať diagnostiku:


      *   klinickí/poradenskí psychológovia,
          
      *   liečební pedagógia, logopédi,
          
      *   psychiatri.
          

      Psychiatri väčšinou nevykonávajú diagnostiku autizmu, nie je to však
      pravidlo.  

      Môžete naraziť na psychiatra/psychiatričku, ktorí diagnostiku vykonávajú
      (hlavne v súkromnom sektore).


      Diagnostiku vykonávajú najmä psychológovia, ktorí prejdú celý proces
      diagnostiky s vami a s vašim dieťaťom.
    uuid: 779dd6e2-823c-4140-a77e-2df8c9c88cad
  - title: Ako prebieha diagnostika dieťaťa
    body: >-
      ### Proces diagnostiky dieťaťa zväčša prebieha:


      *   **Anamnéza s rodičom** – rozhovor o vývine, správaní, komunikácii
          
      *   **Pozorovanie dieťaťa** – štruktúrované aj neštruktúrované
          
      *   **Štandardizované testy** (pozri nižšie)
          
      *   **Záver a písomná správa** – predpoklady, návrhy intervencie,
      odporúčania
          

      ### Aké testy sa najčastie používajú:


      *   **ADOS-2 (Autism Diagnostic Observation Schedule)** – najuznávanejší
      diagnostický nástroj, používa sa aj v SR (nie všade)
          
      *   **ADI-R (Autism Diagnostic Interview – Revised)** – rozhovor s rodičom
          
      *   iné
          

      ADOS-2 je momentálne považovaný za zlatý štandard v diagnostike autizmu.
      Ide o štruktúrované pozorovanie správania, ktoré trvá 30–60 minút.
    uuid: e5b2abac-c5a9-4c43-b66e-f61811f6047d
  - title: Čo dostanem po diagnostike
    body: >-
      Po diagnostike si vás zväčša odborník zavolá na stretnutie, kde vám
      poskytne dokumentáciu a odporúčania. Stretnutie sa nesie v duchu
      rozhovoru.  

      Poskytne vám:


      *   **písomnú správu s predpokladom na diagnózu (ak diagnostiku vykonával
      psychológ),**
          
      *   popis pozorovania, výsledky testov,
          
      *   odporúčania: intervencie, školské zaradenie, ďalších odborníkov,
          
      *   návšteva pedopsychiatra pre stanovenie diagnostického záveru
      (stanovenie diagnózy).
    uuid: 26238c0d-1988-4787-a4d8-750761f85542
  - title: "2. krok Návšteva pedopsychiatra "
    body: >-
      Ako sme spomínali v kroku [Dva pojmy: Diagnostika a Potvrdenie
      diagnózy,](https://kompasio-site-prod.apps.czetech.net/zivotne-situacie/diagnostika-autizmu-preco-kde-kedy-ako-a-kto/1)
      diagnostikou to nekončí. Ak potrebujete z akéhokoľvek dôvodu potvrdiť
      diagnózu lekárom, musíte dieťa objednať k pedopsychiatrovi. (ak sa rieši
      diagnostika dospelej osoby, tak sa musíte objednať k psychiatrovi).


      Ako také stretnutie prebieha? Dobrý príklad z praxe vyzerá nasledovne:


      1.  lekár, špecialista, si od vás prevezme dokumentáciu, ktorú máte
      (správy od iných lekárov a diagnostickú správu od psychológa alebo
      zariadenia poradenstva a prevencie a pod.), ktorú si v rámci časových
      možností rýchlo naštuduje,
          
      2.  nasleduje rozhovor s vami bez dieťaťa,
          
      3.  neskôr vstupuje do ambulancie aj dieťa, ktoré čakalo v čakárni s iným
      rodinným príslušníkom, kým vy ste mali rozhovor s lekárom/lekárkou,
          
      4.  sledovanie správanie dieťaťa v ambulancií a porovnanie s
      dokumentáciou, ktorú si mal možnosť lekár prečítať (alebo aspoň čiastočne
      rýchlo prejsť očami dôležité body a oblasti zo správy),
          
      5.  odchod dieťaťa z ambulancie,
          
      6.  spísanie lekárskej správy, potvrdzujúcej diagnózu alebo nie.
          

      Nie vždy musíte odísť s potvrdenou diagnózou od lekára. Lekár môže mať
      pochybnosti - ak je dieťa ešte primladé, odloží toto rozhodnutie na budúcu
      návštevu. Lekár zväčša odporúči návštevu cca o rok - kde si poviete, čo sa
      za ten rok stalo & zmenilo.
    uuid: 36ef21dd-d819-4d37-bb25-f36f22538cca
  - title: Kedy a ako sa objednať (čakacie doby)
    body: >-
      ### Čakacie doby sú v súčanosti veľmi dlhé.


      1.  Diagnostika:
          
          1.  Včasná diagnostika je však kľúčová, najmä do 3 rokov veku dieťaťa, dá sa však diagnostikovať aj skôr.
              
          2.  Čakacie doby sa líšia – štátne zariadenia sú preťažené, preto sa rodičia často obracajú na súkromných odborníkov. Z tohto dôvodu sú termíny veľmi variabilné od 4-12 týždňov až k 1-2 rokom.

              
      2.  Potvrdenie diagnózy u lekára ( stanovenie diagnostického záveru)
          
          1.  Na termín u pedopsychiatra (prípadne psychiatra) sa musíte tiež objednať a termíny sa líši rovnako, ako v prípade diagnostiky.
    uuid: 91961219-cea1-440f-8793-0568d4356f22
  - title: "Od diagnostiky k pedopsychiatrovi "
    body: >-
      Ak vyšlo z testov, že dieťa je na autistickom spektre podľa zvolenej
      diagnostickej metódy:


      1.  Ak je dieťa primladé (napr. do 3 rokov), psychológovia chcú zväčša
      opakovať diagnostické testy o rok. Za rok sa v tomto veku vie veľa zmeniť,
      avšak ak už teraz vyšlo z testov predpoklad autizmu, psychológovia na to
      upozorňujú a zároveň
          
      2.  **apelujú,** aby ste s dieťaťom začali pracovať - našli rôzne druhy
      terapií, intervencií - niečo, čo by vedelo dieťaťu pomôcť.
          

      Čakanie na rediagnostiku & oficiálnu diagnózu môže trvať mesiace, aj celý
      rok. A počas toho obdobia sa veľa rodičov cíti uviaznutých – v neistote, v
      obavách, v pocite, že „nemôžu nič robiť, kým to niekto nepotvrdí“.


      ### **🚨Ale tu je zásadná vec, ktorú si potrebujeme uvedomiť:**


      Existujú dve paralelné roviny:


      1️⃣**Čo vám povedia o rok**


      *   Je to dôležité vedieť - hlavne ale pre vás.
          
      *   Diagnóza môže veci vysvetliť, pomenovať, priniesť úľavu, odpovede.
          
      *   Otvára dvere k službám.
          
      *   Pomáha škole, úradom, niekedy aj širšej rodine pochopiť situáciu.
          

      ALE: Diagnóza je len informácia. **Nemení realitu, ktorú žijete každý
      deň.** Na druhej strane, nemusí sa ani potvrdiť.


      2️⃣ Čo môžete robiť **už dnes**


      *   Hľadať si komunitu rodičov, odborníkov, ktorí rozumejú neurodiverzite,
          
      *   komunikovať s odborníkmi, ktorí vám pomôžu vybrať intervencie alebo
      terapie vhodné pre vaše dieťa na podporu rozvoja tých oblastí ktoré vaše
      dieťa potrebuje - v mladom veku sa jedná aj tak zväčša o rozvoj
      prostredníctvom hry.
          
      *   konzultovať s odborníkmi, ako prispôsobiť domáce prostredie, aby bolo
      menej zahlcujúce,
          
      *   sledovať signály a potreby vášho dieťaťa a učiť sa reagovať na ne,
          
      *   pracovať na porozumení neverbálnej komunikácie,
          
      *   znižovať stres a tlak z „výkonu“.
          

      Dieťa, ktoré máte pred sebou dnes, je to isté dieťa, aké budete mať aj o
      rok. Dieťa sa vyvíja podľa toho, **aké prostredie mu vytvoríte, aké
      signály od neho dokážete zachytiť a ako na ne reagujete.**


      **Aj keď s dieťaťom pracujete preventívne, bez potvrdenej diagnózy, nijako
      mu tým neškodíte. Naopak – vytvárate mu podmienky na rast.**
    uuid: ba9b8320-7866-4e4e-9754-02db17373a69
  - title: Záver - Diagnóza nie je nálepka - je to odpoveď
    body: >-
      Diagnostika autizmu a potvrdenie diagnózy psychiatrom môže byť náročný a
      emocionálne vyčerpávajúci proces.  

      Je však kľúčovým krokom k pochopeniu potrieb dieťaťa aj celej rodiny.  

      Čím skôr sa s ňou začne, tým skôr možno získať jasnosť, pomoc a pokoj.


      Ako sme písali aj v úvode – **diagnóza nie je nálepka**.  

      Je to **odpoveď na otázky**, ktoré si rodičia často kladú:


      > _Prečo sa moje dieťa správa takto?_  

      > _Prečo reaguje inak ako ostatné deti?_  

      > _V čom spočíva tá odlišnosť?_


      Mnohí rodičia aj samotní ľudia na autistickom spektre opisujú po stanovení
      diagnózy **pocit úľavy** – nie preto, že by boli „označení“, ale preto, že
      **pochopili súvislosti**.


      Pre niektorých rodičov prichádza úľava hneď – pretože **majú odpoveď**.
      Iní sa najskôr zľaknú, majú obavy, čo bude ďalej. Ale časom väčšina z nich
      povie:


      > **„Som rád, že viem, čo sa deje. Teraz môžeme konať.“**


      A čo samotní ľudia na autistickom spektre? Aj u nich neprichádza úľava
      vždy okamžite. Ale **poznanie** im často umožní rozvíjať väčšiu
      **sebalásku a sebaprijatie**.  

      Keď sa v ich prostredí – doma, v škole, v práci – zavedú **opatrenia,
      ktoré im reálne pomáhajú**, často si práve vtedy prvýkrát uvedomia:


      > „Môže mi byť dobre. Nepotrebujem sa meniť. Ak okolie chápe a zároveň
      rozumiem aj ja tomu, čo mi pomáha, cítim sa lepšie.“


      Preto platí:  

      👉 **Ak máte podozrenie na autizmus, nečakajte.**  

      Aj preventívne vyšetrenie môže priniesť pokoj.  

      **Diagnostika nie je koniec.**  

      **Je to začiatok cesty.**
    uuid: cdf15479-74ae-43cb-84de-020897557615
