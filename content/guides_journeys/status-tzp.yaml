title: ŤZP - Úvod do problematiky
category: 0672d6e8-1771-46a1-9520-42437b3f2026
description: Vysvetlenie pojmu ŤZP, rozdiel medzi diagnózou a ŤZP statusom, kto
  o tom rozhoduje. Modelové príklady pre rýchle pochopenie.
steps:
  - title: "ŤZP alebo ZŤP? "
    body: >-
      Začnime rovno zhurta – v hovorovej reči sa často používa skratka **ZŤP**,
      prípadne aj označenie typu **„ZeŤePčkár“**. Ak však chceme byť aspoň
      trochu jazykovo korektní (a možno aj kultivovaní), oplatí sa poznať
      správny pojem.


      **Oficiálna skratka podľa zákona je ŤZP**, teda **ťažké zdravotné
      postihnutie** – a to označuje **mieru funkčného postihnutia**, nie človeka
      ako takého.


      ### Rozdiel?


      *   **ZŤP** evokuje označenie osoby. Nálepka. Hotovo. Ty si murár, ty
      učiteľ, ty prezident. A ty? ZŤPčkár.  
          A je úplne jedno, že si zároveň športovec, otec troch detí alebo máš vlastný startup.

          
      *   **ŤZP** označuje **zdravotný stav**, nie spoločenskú rolu ani
      osobnosť.  
          Je to len **jedna časť príbehu**, nie celá identita.

          

      ### Cítite ten rozdiel?


      Ak zmeníme spôsob, akým sa pozeráme na človeka, možno si konečne
      uvedomíme, že aj osoba s ŤZP môže byť skvelý poštár, vývojár, obchodník,
      bankár či pekár.


      ### Zhrnutie


      ✅ŤZP= správne, spisovné, podporené legislatívou  

      ❌ZŤP= neoficiálne, slangové
    uuid: 97047032-d1e0-42ea-8c60-583a851a13f9
  - title: Kedy sa stávate ŤZP?
    body: >-
      Keď sa zhodnotí, že Váš zdravotný stav, resp. miera vašej funkčnej poruchy
      je najmenej 50%.


      ### A teraz ľudskou rečou:


      **ŤZP (ťažko zdravotne postihnutý)** je človek, ktorý má **vážnejšie
      zdravotné obmedzenie**, a to mu **komplikuje bežný život** – ako je
      chodenie, videnie, počúvanie, komunikovanie, orientácia, alebo zvládanie
      každodenných činností: cestovanie, vybavovanie vecí, starostlivosť o seba.


      ### Čo znamená tých 50%?


      Je to odborný spôsob (či už dobre nastavený alebo zle o tom môžeme
      samozrejme polemizovať), ako si štát odpovedá na otázku: **"ako veľmi Vám
      zdravotný stav sťažuje život."**


      Predstavte si, že:


      *   **Zdravý človek zvláda všetko bez pomoci,**
          
      *   keď vám zdravie spôsobuje **výrazné ťažkosti v rôznych oblastiach
      života**, lekár to zhodnotí ako "funkčnú poruchu" – napríklad 40 %, 50 %,
      60 %, 80 % – podľa závažnosti.
          
      *   **Ak osoba dosiahne aspoň 50 %**, lekár tým vlastne potvrdil, že
      zdravotný stav tejto osoby je taký závažný a značne komplikuje život, že
      daná osoba sa stáva ŤZP osobou.
          

      _Nasledujúci príklad slúži len na lepšiu predstavu. Každý zdravotný stav
      je posudzovaný individuálne a nemusí automaticky znamenať priznanie
      statusu ŤZP._


      *   Niekto má **dlhodobé problémy s kĺbmi** a **ťažko chodí** – potrebuje
      palicu alebo oporu, prípadne výmenu kĺbov.
          
      *   Alebo má **problémy so srdcom** a ľahko sa zadýcha, prípadne musí
      prestať robiť istú činnosť, kým sa neupokojí a stav sa opäť stabilizuje.
          
      *   Alebo má **psychické ťažkosti**, ktoré mu bránia fungovať samostatne v
      práci alebo vonku.
          

      Títo ľudia nemusia vyzerať "ťažko chorí", ale ak ich stav **vážne
      ovplyvňuje život** a funkčne ich ovplyvňuje nad 50 % vrátane, môžu sa stať
      ŤZP.
    uuid: 536f0e21-757c-4c56-b213-9a83172d38be
  - title: "Ako sa človek stáva ŤZP? Kto o tom rozhoduje? "
    body: >-
      V prvom rade, musíš mať nejaké zdravotné komlikácie, kvôli ktorým
      navštevuješ doktora. Týmto spôsobom máš k dispozícií lekárske záznamy,
      nálezy alebo inými slovami: dôkaz o tom, že bolesti chrbtice si
      nevymýšľaš, ale niekto s odborným okom sa na teba pozrel a rieši to.


      Tieto nálezy, záznamy zozbieraš od špecialistov a priložíš ich k žiadosti
      "<u>Žiadosť o vyhotovenie preukazu fyzickej osoby s ťažkým zdravotným
      postihnutím</u>".


      Žiadaš síce o vyhotovenie preukazu ŤZP, avšak vyplnením daného tlačiva a
      odovzdanie úradu **týmto krokom spúšťaš proces posudkovej činnnosti,**
      ktoré rozhodne, či tvoj zdravotný stav je v požadovanom rozmedzí.


      Posudkovú činnosť vykonávajú:


      *   **posudkový lekár** príslušného úradu práce, sociálnych vecí a rodiny,
          
      *   **sociálny pracovník** príslušého úradu práce, sociálnych vecí a
      rodiny.
          

      **Výsledok je komplexný posudok, ktorý obsahuje:**


      *   mieru funkčnej poruchy,
          
      *   vyjadrenie, že ide o fyzickú osobu s ŤZP,
          
      *   sociálne dôsledky ŤZP vo všetkých oblastiach kompenzácie,
          
      *   návrh druhu peňažného príspevku na kompenzáciu,
          
      *   vyjadrenie, či osoba s ŤZP je odkázaná na sprievodcu,
          
      *   vyjadrenie, či osoba s ŤZP je odkázaná na individuálnu prepravu
      osobným motorovým vozidlom,
          
      *   termín opätovného posúdenia zdravotného stavu, ak ho určí posudkový
      lekár a
          
      *   odôvodnenie komplexného posudku
          

      🟡_Dobré vedieť:_  

      _ak lekársky posudok stanoví mieru funkčnej poruchy pod 50 %, komplexný
      posudok sa sa nevypracuje._


      ### 🚨 Spozorni


      **Keď podávaš žiadosť o preukaz, automaticky štartuješ celý proces. Nie je
      to len „papierovanie“, ale kľúčový krok, ktorý rozhodne, či si alebo nie
      si ŤZP.**
    uuid: 77f9fe6e-bfa7-4649-b2c8-3d7079f9fde7
  - title: "Vysvetlenie ŤZP na príkladoch "
    body: >-
      Prinášame ti 3 príklady pre lepšie pochopenie, ako to môže vyzerať v
      praxi.

        
      _Upozorňujeme, že dôvody či uvádzané percentá sú vymyslené a nemusia
      zodpovedať skutočnosti. Príklady slúžia na základné pochopenie
      problematiky a mechanizmu posudzovania._


      ### Modelová situácia A


      Peter má **reumu**, takže ho bolia kĺby a horšie sa mu chodí – to by mohlo
      byť okolo **20 %**.  

      Okrem toho má **chronické problémy s pľúcami** (astmu), kvôli ktorým sa
      rýchlo unaví a má problémy s dýchaním – ďalších **20 %**.  

      A k tomu ešte **vysoký tlak**, ktorý pridáva ďalšie zdravotné obmedzenia –
      napríklad **15 %**.


      Tieto problémy sa **nesčítavajú priamo**, ale keďže spolu **výrazne
      zhoršujú jeho každodenné fungovanie**, úrad mu môže určiť **celkovú
      poruchu 50 %**.


      ➡️ **Peter sa tak môže stať osobou s ŤZP.**


      ### Modelová situácia B


      Martina má cukrovku (diabetes).  

      Kým ju zvláda pomocou tabliet a diétneho režimu, jej zdravotný stav sa
      považuje za miernejší. V tomto štádiu **zvyčajne ešte nezíska status
      ŤZP**.


      Ale keď sa jej stav zhorší a **musí si pichať inzulín**, pridajú sa
      komplikácie – únava, kolísavý cukor, zhoršené videnie či citlivosť v
      nohách.  

      To už **výraznejšie ovplyvňuje jej život**, a pri posúdení môže dosiahnuť
      **50 % funkčnej poruchy**.


      ➡️ **Vtedy sa môže stať osobou ŤZP.**


      ### Modelová situácia C


      **Tomáš má poruchu autistického spektra.**  

      Má problém s bežnou komunikáciou, neznáša zmeny v dennom režime a v cudzom
      prostredí sa ľahko dostáva do stresu.  

      Nevie samostatne vybaviť úradné veci, nakúpiť, ani cestovať verejnou
      dopravou – potrebuje **sprievod alebo dohľad**.


      Aj keď **fyzicky vyzerá zdravý**, jeho psychický stav **vážne ovplyvňuje
      každodenný život**.


      ➡️ V takomto prípade môže dosiahnuť **viac ako 50 % funkčnej poruchy**, a
      teda byť osobou s **ŤZP alebo dokonca ŤZP-S** (s potrebou sprievodcu).


      💡 Ako sme si ukázali na troch príkladoch, status ŤZP nemusí vychádzať len
      z jednej diagnózy. Často ide o súbeh viacerých zdravotných problémov,
      ktoré spolu výrazne ovplyvňujú bežný život. Varianty môžu byť veľmi rôzne.
    uuid: 354a96a6-5275-4da1-8550-b4fc285b7e13
  - title: "Diagnóza ≠ ŤZP. Prečo? "
    body: >-
      Ak si sa poctivo dostal až sem (gratulujem) a zároveň prečítal
      predchádzajúcu sekciu, dá sa s nej ľahko vyvodiť, prečo diagnóza ≠ ŤZP.


      ### ZOPAKOVANIE  


      Martina má cukrovku (diabetes) ale ak zatiaľ "len" užíva lieky, nie je
      osobou s ŤZP.  

      Ak Martina už musí mať k dispozícií inzulín a dennodenne ho užívať , stáva
      sa osobou s ŤZP.


      👉**Rovnaká diagnóza, ale rôzne štádia, teda aj rôzna miera funkčnosti.**


      Tomáš má poruchu autistického spektra. Z príkladu je zrejmé, že nedokáže
      byť dostatočne samostatný a potrebuje dohľad pri bežných aktivitách. V
      tomto prípade je osobou s ŤZP.


      Júlia je osobou s poruchou autistického spektra. Reč používa funknčne.
      Naučila sa rôzne kompenzačné stratégie, vďaka ktorým zvláda každodenný
      život samostatne. Júlia nie je osobou s ŤZP.


      👉 **Rovnaká diagnóza, ale rôzne závery podľa toho, ako veľmi ovplyvňuje
      každodenný život a akú mieru podpory človek potrebuje.**
    uuid: 064ca851-2966-47d0-a01d-55a9c58fccfc
  - title: "Mám posudok - som ŤZP "
    body: >-
      Ak by sme sa na to pozreli očami nadšencov pozitívneho myslenia, možno by
      sme si povedali: "Mám to!"  

      Lenže toto nie je ako získanie vodičáku, vietor vo vlasoch a vyrážam na
      cestu po Európe.  
        
      Byť ŤZP znamená, že zdravotné obmedzenia sú natoľko vážne, že ovplyvňujú
      každodenný život minimálne na 50%. U niekoho nad 80%. A aj viac.


      A to nie je nič, čo by niekto plánoval alebo chcel.

        
      Minimálne dobrou správou je, že ak už sa stávate ŤZP, štát túto realitu
      oficiálne uznal a otvára možnosť získať aspoň nejakú podporu - tzv.
      kompenzácie (peňažný príspevok, ŤZP parkovací preukaz, zľavy z cien a
      pod.)  

      Tie majú pomôcť zmierniť dopady obmedzení, ktoré človek v každodennom
      fungovaní zažíva. (či sú dostatočné alebo nie


      ### Slovo na záver


      Radšej zaparkovať na najvzdialenejšom mieste parkoviska a prejsť k
      obchodným dverám po vlastných, aj keď v úpeku, než zobrať si miesto
      vyhradené pre ŤZP, ak ním nie som.


      Úprimná malá rada pre "galgánov“, čo parkujú tam, kde nemajú. Ak chceš
      „vziať“ miesto pre ŤZP, mal/a by si si vziať aj zdravotné obmedzenia danej
      osoby – nie len parkovacie miesto.
