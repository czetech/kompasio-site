title: ŤZP – Úvod do problematiky (1. časť)
active: true
category: 3d6262d1-f09e-46ec-91fd-02a3f4cc2268
type: knowledge
description: Vysvetlenie pojmu ŤZP, rozdiel medzi diagnózou a ŤZP statusom, kto
  o tom rozhoduje. Modelové príklady pre rýchle pochopenie.
steps:
  - title: "ŤZP alebo ZŤP? "
    body: >-
      Začnime rovno zhurta – v hovorovej reči sa často používa skratka **ZŤP**,
      prípadne aj označenie typu **„ZeŤePčkár“**. Ak však chceme byť aspoň
      trochu jazykovo korektní (a možno aj kultivovaní), oplatí sa poznať
      správny pojem.


      **Oficiálna skratka podľa zákona je ŤZP**, teda **ťažké zdravotné
      postihnutie** – a to označuje **mieru funkčného postihnutia**, nie človeka
      ako takého.


      ### Rozdiel?


      *   **ZŤP** evokuje označenie osoby. Nálepka. Hotovo. Ty si murár, ty
      učiteľ, ty prezident. A ty? ZŤPčkár. A je úplne jedno, že si zároveň
      športovec, otec troch detí alebo máš vlastný startup.
          
      *   **ŤZP** označuje **zdravotný stav**, nie spoločenskú rolu ani
      osobnosť. Je to len **jedna časť príbehu**, nie celá identita.
          

      ### Cítite ten rozdiel?


      Ak zmeníme spôsob, akým sa pozeráme na človeka, možno si konečne
      uvedomíme, že aj osoba s ŤZP môže byť (nie že môže, jednoznačne JE!)
      skvelý či už poštár, vývojár, obchodník, alebo kamarát, rodič, súrodenec,
      kolega.


      ### Zhrnutie


      ✅ŤZP= správne, spisovné, podporené legislatívou  

      ❌ZŤP= neoficiálne, slangové
    uuid: 97047032-d1e0-42ea-8c60-583a851a13f9
  - title: Kedy sa stávaš ŤZP?
    body: >-
      Keď sa zhodnotí, že tvoj zdravotný stav, resp. miera tvojej funkčnej
      poruchy je najmenej 50%.


      ### Ľudskou rečou:


      **ŤZP (ťažko zdravotne postihnutý)** je človek, ktorý má **vážnejšie
      zdravotné obmedzenie**, a to mu **komplikuje bežný život** – ako je
      chodenie, videnie, počúvanie, komunikovanie, orientácia, alebo zvládanie
      každodenných činností: cestovanie, vybavovanie vecí, starostlivosť o seba
      a iné.


      ### Čo znamená tých 50%?


      Je to odborný spôsob (či už dobre nastavený alebo zle, o tom môžeme
      samozrejme polemizovať), ako si štát odpovedá na otázku: **"ako veľmi ti
      zdravotný stav sťažuje život."**  

      Čim vyššie percento, tým závažnejšie ťa zdravotné obmedzenia ovplyvňujú v
      každodennom živote.


      Predstav si, že:


      *   **Zdravý človek zvláda všetko bez pomoci,**
          
      *   keď zdravie začne spôsobovať **výrazné ťažkosti v rôznych oblastiach
      života**, lekár to zhodnotí ako "funkčnú poruchu" – napríklad 40 %, 50 %,
      60 %, 80 % – podľa závažnosti.
          
      *   **Ak osoba dosiahne aspoň 50 %**, lekár tým vlastne potvrdil, že
      zdravotný stav je taký závažný a značne komplikuje bežný život, že daná
      osoba sa stáva ŤZP osobou.
          

      _Nasledujúci príklad slúži len na lepšiu predstavu. Každý zdravotný stav
      je posudzovaný individuálne a nemusí automaticky znamenať priznanie
      statusu ŤZP._


      *   niekto má **onkologické ochorenie**,
          
      *   alebo má **problémy so srdcom,**
          
      *   alebo má **psychické ťažkosti**, ktoré mu bránia fungovať samostatne v
      práci alebo vonku.
          

      Títo ľudia nemusia na prvý pohľad pôsobiť „ťažko chorí“, no ak ich
      zdravotný stav vážne ovplyvňuje každodenný život a miera funkčného
      postihnutia dosiahne 50 % alebo viac, **môžu** byť posúdení ako osoby s
      ťažkým zdravotným postihnutím (ŤZP).
    uuid: 536f0e21-757c-4c56-b213-9a83172d38be
  - title: "Ako sa človek stáva ŤZP? Kto o tom rozhoduje? "
    body: >-
      V prvom rade, musíš mať nejaké zdravotné komplikácie, kvôli ktorým
      navštevuješ doktora. Týmto spôsobom máš k dispozícií lekárske záznamy,
      nálezy alebo inými slovami: dôkaz o tom, že bolesti chrbtice si
      nevymýšľaš, ale niekto s odborným okom sa na teba pozrel a rieši to.


      K preukazu sa možno dostať dvoma spôsobmi:


      1.  Cez "**<u>Žiadosť o integrovaný posudok</u>**". Nový proces
      integrovanej posudkovej činnosti je platný od 01.09.2025. Všetky povinné
      prílohy, aj ako prebieha nový proces nájdete na [tejto
      stránke.](https://www.mpsvr.sk/sk/rodina-socialna-pomoc/tazke-zdravotne-postihnutie/integrovana-posudkova-cinnost.html)
          
      2.  Osoba, ktorá nechce byť posúdená v integrovanej posudkovej činnosti,
      nakoľko má záujem výlučne o preukaz má možnosť podať si žiadosť o
      vyhotovenie preukazu. Úrad v takom prípade vykoná lne lekársku posudkovú
      činnosť a vydá rozhodnutie o preukaze. Podmienkou pre takéto konanie o
      preukaze je, že osoba nemá právoplatný integrovaný posudok. Viac info
      [TU.](https://www.employment.gov.sk/sk/rodina-socialna-pomoc/tazke-zdravotne-postihnutie/preukaz-tzp/)
          

      _Nový proces, tzv. integrovanej posudkovej činnnosti je platný od
      01.09.2025 - ako to funguje v praxi zistíme snáď čoskoro._
    uuid: 77f9fe6e-bfa7-4649-b2c8-3d7079f9fde7
  - title: "Vysvetlenie ŤZP na príkladoch "
    body: >-
      Prinášame ti 2 príklady pre lepšie pochopenie, ako to môže vyzerať v
      praxi.


      _Upozorňujeme, že dôvody či uvádzané percentá sú vymyslené a nemusia
      zodpovedať realite. Príklady slúžia na základné pochopenie problematiky a
      mechanizmu posudzovania._


      ### Modelová situácia A


      Martina má cukrovku (diabetes).  

      Kým ju zvláda pomocou tabliet a diétneho režimu, jej zdravotný stav sa
      považuje za miernejší. V tomto štádiu **zvyčajne ešte nezíska status
      ŤZP**.


      Ale ak sa jej stav zhorší a **musí si dať dávku inzulínu**, pridajú sa
      komplikácie – únava, kolísavý cukor, zhoršené videnie či citlivosť v
      nohách.  

      To už **výraznejšie ovplyvňuje jej život**, a pri posúdení môže dosiahnuť
      **50 % funkčnej poruchy**.


      ➡️ **Vtedy sa môže stať osobou ŤZP.**


      ### Modelová situácia B


      **Tomáš má poruchu autistického spektra.**  

      Má problém s bežnou komunikáciou, neznáša zmeny v dennom režime a v cudzom
      prostredí sa ľahko dostáva do stresu.  

      Nevie samostatne vybaviť úradné veci, nakúpiť, ani cestovať verejnou
      dopravou – potrebuje **sprievod alebo dohľad**.


      Aj keď **fyzicky vyzerá zdravý**, jeho psychický stav **vážne ovplyvňuje
      každodenný život**.


      ➡️ V takomto prípade môže dosiahnuť **napr. 80 % funkčnej poruchy**, a
      teda byť osobou s **ŤZP alebo dokonca ŤZP-S** (s potrebou sprievodcu).


      💡 Status ŤZP nemusí vychádzať len z jednej "diagnózy".  

      Často ide o súbeh viacerých zdravotných problémov, ktoré spolu výrazne
      ovplyvňujú bežný život. Varianty môžu byť veľmi rôzne.
    uuid: 354a96a6-5275-4da1-8550-b4fc285b7e13
  - title: "Diagnóza ≠ ŤZP. Prečo? "
    body: >-
      Ak si sa poctivo dostal až sem (gratulujem) a zároveň prečítal
      predchádzajúcu sekciu, dá sa z nej ľahko vyvodiť, prečo diagnóza ≠ ŤZP.


      ### ZOPAKOVANIE


      Martina má cukrovku (diabetes) ale ak zatiaľ "len" užíva lieky, nie je
      osobou s ŤZP.  

      Ak Martina už musí mať k dispozícií inzulín a dennodenne ho aplikovať,
      stáva sa osobou s ŤZP.


      👉**Rovnaká diagnóza, ale rôzne štádia, teda aj rôzna miera funkčnosti.**


      Tomáš má poruchu autistického spektra. Z príkladu je zrejmé, že nedokáže
      byť dostatočne samostatný a potrebuje dohľad pri bežných aktivitách. V
      tomto prípade je osobou s ŤZP.


      Júlia je osobou s poruchou autistického spektra. Reč používa funkčne.
      Naučila sa rôzne kompenzačné stratégie, vďaka ktorým zvláda každodenný
      život samostatne. Júlia nie je osobou s ŤZP.


      👉 **Rovnaká diagnóza, ale rôzne závery podľa toho, ako veľmi ovplyvňuje
      každodenný život a akú mieru podpory človek potrebuje.**
    uuid: 064ca851-2966-47d0-a01d-55a9c58fccfc
  - title: "Mám posudok - som ŤZP "
    body: >-
      Ak by sme sa na to pozreli očami nadšencov pozitívneho myslenia, možno by
      sme si povedali: „Mám to!“  

      Lenže to nie je ako získať vodičský preukaz, vyraziť s vetrom vo vlasoch
      na cestu po Európe. (ale áno, dostať posudok v požadovanej lehote je v
      princípe zázrak, nepomôže ti žiadne Harry Potter zaklínadlo).


      Byť ŤZP znamená, že zdravotné obmedzenia sú natoľko vážne, že ovplyvňujú
      každodenný život minimálne na 50 %, niekedy aj na 80 % či viac.


      A to nie je niečo, čo by si niekto plánoval alebo prial. A už vôbec nie ,
      aby človek niekomu závidel.


      Minimálne dobrou správou je, že ak sa staneš osobou s ŤZP, štát tento fakt
      oficiálne uzná a otvorí ti možnosť získať podporu – tzv. kompenzácie
      (peňažný príspevok, ŤZP parkovací preukaz, zľavy a podobne).


      🟡_Dobré vedieť:_  

      _Pre zdravého človeka sú tieto dvere zatvorené. Nemáš vstupenku, (nie si
      ŤZP) ani sem nechoď._  

      _Ten, kto má status ŤZP, tomu sa dvere síce otvárajú, ale stále nevieš, či
      ťa pustia dnu._


      _👉Čo to znamená? Kompenzačné príspevky nedostatneš len preto, že si
      ŤZP._  

      _Každá položka sa posudzuje individuálne._


      Tieto opatrenia však majú pomôcť zmierniť dopady obmedzení v každodennom
      živote.  

      _(Či sú dostatočné, to je samostatná téma, rovnako ako celý posudkový
      proces – no o tom dnes nie je reč.)_


      ### Slovo na záver


      Úprimná malá rada pre "galgánov“, čo parkujú tam, kde nemajú. Ak chceš
      „vziať“ miesto pre ŤZP, mal by si si vziať aj zdravotné obmedzenia danej
      osoby (nie len parkovacie miesto).


      Radšej zaparkovať na najvzdialenejšom mieste parkoviska a prejsť k
      obchodným dverám po vlastných, aj keď v úpeku, než si zobrať miesto
      vyhradené pre ŤZP, ak ním nie som. **(Buď vďačný za to, že môžeš parkovať
      na tom mieste, čo je najďalej, lebo ty môžeš).**  

      To dá rozum. 🧠
