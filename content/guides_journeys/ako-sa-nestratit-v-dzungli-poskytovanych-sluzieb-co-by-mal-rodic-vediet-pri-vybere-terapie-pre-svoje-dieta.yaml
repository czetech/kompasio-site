title: "Ako sa nestratiť v džungli poskytovaných služieb: Čo by mal rodič vedieť
  pri výbere terapie pre svoje dieťa"
category: 0672d6e8-1771-46a1-9520-42437b3f2026
description: Pomôžeme rodičom lepšie sa zorientovať v ponuke terapií pre deti s
  autizmom, vysvetlíme rozdiely medzi certifikáciami, skúsenosťami a odbornou
  kvalifikáciou, aby si vedeli vybrať spoľahlivého odborníka. Prosím, vstúpte.
steps:
  - title: "100+ druhov terapií "
    body: Vybrať terapiu pre svoje dieťa môže byť ako vyraziť na výpravu do pralesa
      bez mapy — veľa ciest, nejasné značky a sem-tam aj nečakaný stret s
      „miestnym obyvateľom“ v podobe nejasných termínov či neznámych
      certifikátov.
    uuid: 39a31e6e-66e1-461a-89b1-fbd734ac754e
  - title: Kurz, certifikát, terapia — čo je čo?
    body: >-
      Predstav si, že chceš naučiť svoje dieťa jazdiť na bicykli. Máš na výber:


      *   ísť na 2-týždňový kurz „Ako jazdiť na bicykli“, kde sa naučíš základy
      držania riadidiel a brzdenia,
          
      *   alebo absolvovať dvojročný tréning profesionálneho inštruktora
      cyklistiky, ktorý ťa naučí aj opravovať bicykel, nastavovať sedlo, zvládať
      horské traily a predchádzať zraneniam,
          
      *   prípadne si len sadnúť s kamarátom, ktorý jazdí na bicykli už 10
      rokov, a od neho sa učiť, ako to „ide v praxi“.
          

      ### Kurz, certifikát a terapia: čo je čo?


      Takto to vyzerá v našom svete autizmu a podpory:


      *   **Kurz (napr. Cothú pre rodičov)** je ako ten 2-týždňový cyklistický
      workshop – naučí ťa základy, dá nástroje na podporu, ale neurobí z teba
      terapeuta či inštruktora.
          
      *   **Dlhodobý certifikovaný tréning (napr. ESDM model)** je ako dvojročný
      inštruktorský tréning – naučí ťa všetko, čo potrebuješ vedieť, aby si
      mohol poskytovať profesionálnu terapiu,
          
      *   **Skúsenosti bez certifikátu** sú ako učenie sa jazdiť od kamoša –
      môžeš byť fakt dobrý, ale bez oficiálneho potvrdenia.
    uuid: 5b1b9334-c0f2-406a-a740-3a1f70139193
