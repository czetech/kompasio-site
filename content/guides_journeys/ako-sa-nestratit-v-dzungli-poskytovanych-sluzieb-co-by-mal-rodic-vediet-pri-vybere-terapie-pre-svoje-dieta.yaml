title: Ako sa nestratiť v džungli poskytovaných terapií
category: 835563e8-f806-4d2e-9900-2bbaae14d409
type: knowledge
description: >-
  Úvod do problematiky:  

  Čo by mal rodič vedieť pri výbere terapie pre svoje dieťa. Ponúkame základné
  informácie, ako sa lepšie zorientovať v spleti možností, ktoré existujú.
steps:
  - title: "100 + druhov terapií "
    body: >-
      Čim viac možností, tým je človek viac paralyzovaní.  

      Vybrať terapiu pre svoje dieťa môže byť ako vyraziť na výpravu do pralesa
      bez mapy — veľa ciest, nejasné značky. Neviete, ktorou cestou sa vybrať,
      nemáte kompas ani hodinky na sledovanie času. Aby toho nebolo málo, po
      ceste sa objavia rôzne prekážky v podobe nejasných termínov či neznámych
      certifikátov a používaných pojmov. Vezmime si mačetu a poďme sa presekať
      týmto pralesom.
    uuid: 39a31e6e-66e1-461a-89b1-fbd734ac754e
  - title: Workshopy, licencie, skúsenosti - aký je rozdiel?
    body: >-
      ### Aké možnosti vzdelávania majú odborníci:


      Pre lepšie pochopie, ako to môže vyzerať vo svete autizmu (v ponuke
      **<u>terapií</u>**) pozrime sa na to pomocou príkladov:


      1.  **Webináre, krátke kurzy a online nástroje**
          
          *   Jednou z možností je absolvovanie webinárov, 2–3-dňových kurzov či iných online vzdelávacích nástrojov.
              
          *   Je to ako zaplatiť si 2 týždňový kurz cyklistiky - naučia ťa základy, aké časti má bicykel, kde sú brzdy, alebo ako si vymeniť koleso. Ukážu ti, ako môžeš motivovať dieťa a možno sa tu naučíš 1-2 nové techniky, ktoré využiješ v praxi. Rozšíria ti vedomosti, ktoré máš, ale nespraví to z teba profesionálneho inštruktora danej metódy.
              
          *   Dôležité v tomto prípade je, aké vzdelanie a skúseností má odborník už vo svojom porfóliu. Absolvovanie takýchto kurzov je jednoznačne obohacujúce a odborníci vďaka nim získavajú neustále nové poznatky.
              
          *   Zároveň tieto kurzy predstavujú dobrý základ pre odborníkov, ktorý chcú začať využívať novú metódu vo svojej praxi a radi by sa s danou metódou oboznámili.
              
          *   Záleží, **čo je obsahom kurzu** a **pre koho** je určený. Niektoré sú zamerané:
              
              *   viac pre odborníkov so vzdelaním,
                  
              *   širokej verenosti (napr. pre rodičov týchto detí a pod.)
                  
          *   Platí, že tieto kurzy sú limitujúce (časom a hĺbkou), preto je kľúčové pozerať sa na to, **kto** kurz absolvoval – nie len **že** ho absolvoval. Je dobré pozrieť si celý príbeh konkrétneho človeka, kým sa k nemu vydáš a odovzdáš mu svoje dieťa.

              
      2.  **Prax bez certifikácie**
          
          *   Ďalšou možnosťou sú odborníci s praxou, ale bez formálneho certifikátu.
              
          *   **Môžeš ísť o fakt skvelých odborníkov** - znalosti a skúsenosti sa naučili praxou, inšpirovali sa navzájom kolegami či kolegyňami, samoštúdiom alebo skúšaním rôznych techník. Možno absolvovali aj nejaký webinár alebo rýchlokurz.
              
          *   Títo odborníci si nespravili oficiálne kurz konkrétnej terapie/metódy, avšak môžu mať dlhoročné skúsenosti vďaka práci, ktorú vykonávali.
              
          *   Tu by mali rodičia sledovať okrem iného akú prax má za sebou daný človek a kde všade pôsobil - určite Vám to lepšie pomôže rozhodnúť sa, či si daného odborníka vyberiete alebo nie.

              

      Aj prvá aj druhá skupina odborníkov môže používať vo svojich popisoch
      _využívam "_**_<u>prvky"</u>_** _aba <u>terapie</u>, prvky muzikoterapie_
      a pod.).


      3.  **Dlhodobé certifikované tréningové programy a psychoterapeutické
      výcviky**
          

      *   tu hovoríme už o systematickom, hĺbkovom odbornom vzdelávaní
      **<u>konkrétnej terapeutickej metódy</u>** (napr. muzikoterapia,
      artterapia, ABA terapia, ESDM model).
          
      *   Budúci odborník absolvuje teóriu, prax a supervíziu – a po splnení
      všetkých podmienok je **oprávnený poskytovať danú terapiu komplexne,
      profesionálne a v súlade so štandardmi**. Takéto programy bývajú časovo aj
      finančne náročné.
          

      ### 📌**Zhrnutie:**


      **Tak do akého lietadla by si nasadol?**


      *   S pilotom, ktorý mal víkendový kurz?
          
      *   S pilotom, ktorého učil jeho otec a starý otec?
          
      *   Alebo profesionálovi, ktorý prešiel certifikovaným výcvikom, má
      leteckú prax a jeho odbornosť overila nezávislá autorita?
          

      🟡Dobré vedieť:


      Ako pilot lietadla nesmie pilotovať lietadlo bez certifikátu, tak je to i
      s terapiami. Poskytovanie terapií je regulované a má svoje legislatívne
      pravidlá.


      *   Ten kto má certifikát, uvádza: _"poskytujem ABA terapiu,
      muzikuterapie, prípadne som certifikovaná ABA terapeutka a pod. "_
          
      *   Ten, kto certifikát nemá, by mal uvádzať: _"využívam prvky terapie
      ABA, prvky muzikoterapie, prvky programu TEACH."_
    uuid: 5b1b9334-c0f2-406a-a740-3a1f70139193
  - title: Čo mám teda hľadať?
    body: >-
      Úprimne, nie je to jednoduché.  

      To že niekto neprešiel dlhodobým konkrétnym výcvikom automaticky
      neznamená, že nie je skvelý v tom, čo robí.  

      Znamená to len to, že sa nešpecializuje na konkrétnu metódu a využíva pri
      práci rôzne techniky a metódy.  

      Ponuka terapií pre deti s autizmom je široká a často zmätočná.  

      O čo sa teda môže rodič pri výbere opierať?


      1.  **Zdieľanie skúseností iných rodičov**
          
          Skúsenosti s konkrétnymi inštitúciami alebo odborníkmi môžu byť veľmi cenné. Rodičovské recenzie a odporúčania často pomáhajú ďalším rozhodnúť sa, koho kontaktujú.

          
      2.  **Vzdelanie a skúsenosti poskytovateľov**
          
          Väčšina terapeutov či podporných pracovníkov uvádza, aké majú vzdelanie a koľkoročné skúsenosti. Je dôležité vedieť, že ak uvádzajú, že používajú **„<u>prvky</u>“** konkrétnej terapie, znamená to, že neprešli kompletným procesom certifikácie v danej metóde.
          
          1.  Môže ísť však o odborníkov, ktorí majú:
              
              *   vzdelanie napríklad v špeciálnej pedagogike, liečebnej pedagogike, psychológií a iné,
                  
              *   absolvované workshopy alebo kratšie kurzy z oblasti danej terapie,
                  
              *   praktické skúsenosti z práce v zariadeniach, kde sa tieto prvky používajú.

                  

      ### Prečo niekto využíva len prvky, a nespraví si certifikáciu?


      Dôvody môžu byť rôzne:


      *   Niektorí odborníci sa cítia dostatočne kompetentní vďaka dlhoročným
      skúsenostiam a nemajú potrebu absolvovať formálnu certifikáciu,
          
      *   proces certifikácie je často časovo náročný — môže trvať od 2 do 5
      rokov v závislosti od druhu terapie,
          
      *   proces je zároveň finančne náročný.
          

      Nie každý má čas alebo finančné zdroje investovať do dlhodobého
      vzdelávania.


      3.  Ak už niekto tvrdí, že poskytuje konkrétnu terapiu, mal by to vedieť
      potvrdiť platným certifikátom od príslušnej inštitúcie.  
          V našej aplikácií Kompasio nájdete [terapeutov s overenými certifikáciami](https://kompasio.sk/app/sk/map/zoznam/?category%5B0%5D=zoznam-certifikovanych-terapeutov) pre niektoré typy terapií.
    uuid: f93dce67-5814-4155-91bc-81064b211d3e
  - title: Alternatívne terapie vs. vedecky podložené metódy
    body: >-
      Vo svete podpory detí s autizmom narazíme na široké spektrum terapií.
      Niektoré sú „**alternatívne“** — teda také, ktoré nemajú pevné vedecké
      dôkazy o účinnosti, no mnohí rodičia ich skúšajú, lebo veria, že môžu
      pomôcť.


      Na druhej strane máme **evidence-based terapie** — čo v preklade znamená
      „terapie podložené dôkazmi“. Tieto metódy prešli náročným vedeckým
      skúmaním, štúdiami, ktoré preukázali ich efektivitu a prínos. Medzi
      najznámejšie patria napríklad ABA (Applied Behavior Analysis), ESDM (Early
      Start Denver Model).


      A teraz to najdôležitejšie — každé dieťa je unikát, a to, čo funguje u
      jedného, nemusí fungovať u druhého. Je to ako hľadať správny kľúč do zámku
      – nie každý kľúč pasuje do každých dverí. Niekedy chvíľu trvá, kým nájdeme
      ten správny vo zväzku kľúčov, ale keď zapadne, všetko začne dávať zmysel.
    uuid: e1e4c591-169f-460e-8c4b-502b6540b8b4
  - title: Je potrebné vyskúšať všetko naraz? Panebože, NIE!
    body: >-
      ### A teraz vážne.


      V tejto džungli terapií sa ľahko stratíme, no nejde o to, že by sme mali
      skúšať všetko naraz.


      Ak chceš naučiť svoje dieťa hrať na klavír, nezačneš tým, že mu naraz
      vysvetlíš všetky druhy hudobných nástrojov, hodíš naňho učivo z
      dvojročného štúdia a dáš mu čítať noty na flautu — a pritom ho usadíš za
      klavír. Čistá katastrofa.


      Tu je dobré poradiť sa s odborníkmi — špeciálnymi pedagógmi, psychológmi,
      psychoterapeutmi, jednoducho s niekým, kto rozumie autizmu a vie posúdiť,
      čo by mohlo pomôcť práve tvojmu dieťaťu. Každé dieťa je jedinečné a
      potrebuje riešiť iné oblasti. Niekto potrebuje riešiť sústredenie, iné zas
      hrubú či jemnú motoriku. Každá intervencia sa zameriava na iné oblasti.


      Je úplne v poriadku skúsiť jednu terapiu a ak sa neujme, vyskúšať inú. Nie
      je však rozumné aby dieťa absolvovalo 15 rôznych terapií počas jedného
      týždňa - ani ty sa nenaučím hovoriť anglicky, ak si si v pondelok otvoril
      angličtinu, utorok čínštinu, stredu fínštinu, štvrtok španielčinu.  

      A ako v každom smere, aj tu- treba systém a vytrvalosť.  

      A počkať nejaké obdobie, či terapie zaberajú (napr. 3- 6 mesiacov).  

      Aj keď chudneš (alebo chceš pribrať), nestane sa tak za noc, či týždeň.  

      Prvé výsledky sa dostavia časom.  

      Je to proces. Vyžaduje si čas a tréning.


      Radšej kvalitná a cielená terapia než veľké množstvo náhodných pokusov.


      ### **🚨** Spozorni


      Opakovaná rada mnohých rodičov z praxe


      Nezabúdaj, že ak sa snažíš „nastaviť“ čo najväčší počet terapií rôzneho
      druhu, nerobíš tým dobre ani sebe. Dieťa treba niekde vyzdvihnúť, riešiť
      logistiku, stráviť čas v priestoroch inštitúcie a potom zase logistika
      späť domov. Tvoja kapacita je rovnako obmedzená – potrebuješ svoj priestor
      a čas na dobitie bateriek.


      Si presne ako tvoj mobil. Baterka mobilu vydrží možno tri dni, ale tá
      tvoja s príchodom večera sa často dostáva na úroveň 10 %. Spánok ťa síce
      opäť dobije (ak teda nie si ten prípad, keď tvoje dieťa skáče celú noc),
      ale je dôležité nájsť si čas aj pre seba – prechádzku v prírode, rozhovory
      s kamarátkami, háčkovanie alebo čokoľvek, čo máš rada.


      Výčitky, že si mohli ten čas venovať cieleným terapiám?  

      Ver, že rovnako dôležité je mať doma mamu (alebo otca), ktorí majú zdroje
      –  

      energiu, zdravie a psychickú pohodu.


      🟡\_Dobré vedieť:  

      Rodičia na pokraji zrútenia síce vedia objednať 6 terapií denne… ale
      poľahky zabudnú, kde zaparkovali auto.  

      Starajte sa o seba.  

      Lebo keď vypadnete vy, vypadne celý systém.  

      A ten systém... ste v tomto prípade vy.
    uuid: 9f1f4138-0208-4b57-a852-bac22b35c083
