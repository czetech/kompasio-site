title: "Ako sa nestratiť v džungli poskytovaných terapií: Čo by mal rodič vedieť
  pri výbere terapie pre svoje dieťa"
category: 0672d6e8-1771-46a1-9520-42437b3f2026
description: Pomôžeme rodičom lepšie sa zorientovať v ponuke terapií pre deti s
  autizmom a vysvetlíme rozdiely medzi certifikáciami, skúsenosťami a odbornou
  kvalifikáciou, aby si vedeli vybrať spoľahlivého odborníka. Prosím, vstúpte.
steps:
  - title: "100+ druhov terapií "
    body: Vybrať terapiu pre svoje dieťa môže byť ako vyraziť na výpravu do pralesa
      bez mapy — veľa ciest, nejasné značky a sem-tam aj nečakaný stret s
      „miestnym obyvateľom“ v podobe nejasných termínov či neznámych
      certifikátov a používaných pojmov.
    uuid: 39a31e6e-66e1-461a-89b1-fbd734ac754e
  - title: Workshopy, licencie, skúsenosti - aký je rozdiel?
    body: >-
      Predstav si, že chceš naučiť svoje dieťa jazdiť na bicykli. Máš na výber:


      *   **Zúčastniť sa 2-týždňového kurzu „Ako jazdiť na bicykli“ pre
      rodičov**, kde sa naučíš základné princípy, pochopíš, ako podporiť svoje
      dieťa, a získaš pár praktických tipov,
          
      *   **Absolvovať dvojročný profesionálny tréning inštruktora cyklistiky**,
      kde sa naučíš techniky, metodiky, bezpečnostné pravidlá aj ako učiť
      druhých systematicky a odborne,
          
      *   **Alebo sa spoliehať na kamarátov,** (ktorí jazdia na bicykli niektorí
      2 roky niektorí mnoho rokov) **a ich skúsenosti** – vedia, čo funguje,
      majú odpozorované triky, no nemajú formálne vzdelanie ani metodiku.
          

      ### Čo je čo?


      Vo svete autizmu (v ponuke terapií ) to vyzerá podobne:


      *   **Certifikáty z webinárov, prípadne iných online nástrojov** je ako
      ten 2-týždňový cyklistický workshop – naučí ťa základy, dá nástroje na
      podporu, ale neurobí z teba terapeuta či inštruktora.
          
      *   **Dlhodobý certifikovaný tréning (napr. muzikoterapia, artterapia, ABA
      terapia, ESDM model)** je ako dvojročný inštruktorský tréning – naučí ťa
      všetko, čo potrebuješ vedieť, aby si mohol poskytovať profesionálnu
      terapiu.
          
      *   **Skúsenosti bez certifikátu** sú ako učenie sa jazdiť od kamoša –
      **môžeš byť fakt dobrý**, **ale bez oficiálneho potvrdenia**. Väčšina
      používa vo svojich popisoch - "využívame **<u>prvky</u>** aba terapie,
      prvky muzikoterapie a pod. )
    uuid: 5b1b9334-c0f2-406a-a740-3a1f70139193
  - title: Čo mám teda hľadať?
    body: >-
      Úprimne, nie je to jednoduché. Ponuka terapií pre deti s autizmom je
      široká a často zmätočná. O čo sa však môže rodič pri výbere opierať?


      1.  **Zdieľanie skúseností iných rodičov** – skúsenosti s konkrétnymi
      inštitúciami alebo odborníkmi môžu byť veľmi cenné. Rodičské recenzie a
      odporúčania často pomáhajú vyhnúť sa neserióznym poskytovateľom.
          
      2.  **Vzdelanie a skúsenosti poskytovateľov** – väčšina terapeutov či
      podporných pracovníkov uvádza, aké majú vzdelanie a koľkoročné skúsenosti.
      Je dôležité vedieť, že ak uvádzajú, že používajú **„<u>prvky</u>“**
      konkrétnej terapie, znamená to, že neprešli kompletným procesom
      certifikácie v danej metóde.
          

      Čo znamená „využívať **prvky** terapie“?


      Mnohí odborníci alebo asistenti môžu mať:


      *   čiastočné vzdelanie z vysokej školy ( napríklad v špeciálnej
      pedagogike, liečebnej pedagogike a pod.),
          
      *   absolvované workshopy alebo kratšie kurzy z oblasti danej terapie,
          
      *   praktické skúsenosti z práce v zariadeniach, kde sa tieto prvky
      používajú.
          

      Avšak nemajú kompletný certifikát ani licenciu na poskytovanie terapie ako
      takej.


      ### Prečo niekto využíva len prvky, a nespraví si certifikáciu?


      Dôvody môžu byť rôzne:


      *   Niektorí odborníci sa cítia dostatočne kompetentní vďaka dlhoročným
      skúsenostiam a nemajú potrebu absolvovať formálnu certifikáciu,
          
      *   proces certifikácie je často veľmi náročný — môže trvať od 1,5 do 5
      rokov v závislosti od druhu terapie,
          
      *   proces je zároveň finančne náročný.
          

      Nie každý má čas alebo zdroje investovať do dlhodobého vzdelávania, hoci
      pracuje v oblasti podpory detí.


      3.  Ak už niekto tvrdí, že poskytuje konkrétnu terapiu, mal by to vedieť
      potvrdiť platným certifikátom od príslušnej inštitúcie. V našom katalógu
      miest podpory nájdete terapeutov s overenými certifikáciami pre rôzne typy
      terapií. Link na katalóg nájdete **\[TU\]**.
    uuid: f93dce67-5814-4155-91bc-81064b211d3e
  - title: Alternatívne terapie vs. vedecky podložené metódy
    body: >-
      Vo svete podpory detí s autizmom narazíme na široké spektrum terapií.
      Niektoré sú „**alternatívne“** — teda také, ktoré nemajú pevné vedecké
      dôkazy o účinnosti, no mnohí rodičia ich skúšajú, lebo veria, že môžu
      pomôcť.


      Na druhej strane máme **evidence-based terapie** — čo v preklade znamená
      „terapie podložené dôkazmi“. Tieto metódy prešli náročným vedeckým
      skúmaním, štúdiami, ktoré preukázali ich efektivitu a prínos. Medzi
      najznámejšie patria napríklad ABA (Applied Behavior Analysis), ESDM (Early
      Start Denver Model).


      A teraz to najdôležitejšie — každé dieťa je unikát, a to, čo funguje u
      jedného, nemusí fungovať u druhého. Je to ako so štipkou soli v kuchyni —
      niekomu stačí malý štipok, iný bez nej nevarí vôbec.
    uuid: e1e4c591-169f-460e-8c4b-502b6540b8b4
  - title: Je potrebné vyskúšať všetko naraz? Panebože, NIE!
    body: >-
      ### A teraz vážne.


      V tejto džungli terapií sa ľahko stratíme, no nejde o to, že by sme mali
      skúšať všetko naraz. Predstav si, že chceš naučiť svoje dieťa hrať na
      klavír. Nezačneš tým, že mu naraz vysvetlíš všetky druhy hudobných
      nástrojov, hodíš naňho učivo z dvojročného štúdia a dáš mu čítať noty na
      flautu — a pritom ho usadíš za klavír. To by bol chaos a zmätok.


      Tu je dobré poradiť sa s odborníkmi — špeciálnymi pedagógmi, psychológmi,
      psychoterapeutmi, jednoducho s niekým, kto rozumie autizmu a vie posúdiť,
      čo by mohlo pomôcť práve vášmu dieťaťu. Každé dieťa je jedinečné a
      potrebuje riešiť iné oblasti.


      Je úplne v poriadku skúsiť jednu terapiu a ak sa neujme, vyskúšať inú. Ale
      nie je rozumné, aby dieťa absolvovalo 15 rôznych terapií počas jedného
      týždňa — to je ako keby si chcel, aby sa naučilo hrať na klavír, ale každú
      hodinu by si ho posielal na inú hudobnú skúšku na úplne iný nástroj.


      Radšej kvalitná a zameraná terapia než veľké množstvo náhodných pokusov.


      ### **🚨** Spozorni


      ### Opakovaná rada mnohých rodičov z praxe


      Nezabúdajte, že ak sa snažíte „nastaviť“ čo najväčší počet terapií rôzneho
      druhu, nerobíte tým dobre ani sebe. Dieťa treba niekde vyzdvihnúť, riešiť
      logistiku, stráviť čas v priestoroch inštitúcie a potom zase logistiku
      späť domov. Vaša kapacita je rovnako obmedzená – potrebujete svoj priestor
      a čas na dobitie bateriek.


      Presne ako ovládač od PlayStationu alebo váš mobil. Mobil môže vydržať tri
      dni, ale vaše baterky sa s príchodom večera často dostávajú na úroveň 10
      %. Spánok nás síce opäť dobije (ak teda nie ste ten prípad, keď vaše dieťa
      skáče celú noc), ale je dôležité nájsť si čas aj pre seba – prechádzku v
      prírode, rozhovory s kamarátkami, háčkovanie alebo čokoľvek, čo máte radi.


      Výčitky, že ste mohli ten čas venovať cieleným terapiám? Verte, že rovnako
      dôležité je mať doma mamu, ktorá má zdroje – energiu, zdravie a psychickú
      pohodu.


      🟡\_Dobré vedieť:  

      Mama (alebo otec) na pokraji zrútenia síce vie objednať 6 terapií denne…
      ale zabudne, kde zaparkoval auto.  

      Starajte sa o seba. Lebo keď vypadnete vy, vypadne celý systém. A ten
      systém... ste vy.
    uuid: 9f1f4138-0208-4b57-a852-bac22b35c083
