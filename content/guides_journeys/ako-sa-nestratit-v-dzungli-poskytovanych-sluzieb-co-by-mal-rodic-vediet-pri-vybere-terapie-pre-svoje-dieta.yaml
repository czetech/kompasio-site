  - title: Čo mám teda hľadať?
    body: >-
      Úprimne, nie je to jednoduché. Ponuka terapií pre deti s autizmom je
      široká a často zmätočná. O čo sa však môže rodič pri výbere opierať?


      1.  **Zdieľanie skúseností iných rodičov**
          
          Skúsenosti s konkrétnymi inštitúciami alebo odborníkmi môžu byť veľmi cenné. Rodičovské recenzie a odporúčania často pomáhajú vyhnúť sa neserióznym poskytovateľom.

          
      2.  **Vzdelanie a skúsenosti poskytovateľov**
          
          Väčšina terapeutov či podporných pracovníkov uvádza, aké majú vzdelanie a koľkoročné skúsenosti. Je dôležité vedieť, že ak uvádzajú, že používajú **„<u>prvky</u>“** konkrétnej terapie, znamená to, že neprešli kompletným procesom certifikácie v danej metóde.
          
          1.  Môže ísť však o odborníkov, ktorý majú:
              
              *   vzdelanie napríklad v špeciálnej pedagogike, liečebnej pedagogike, psychológií a iné,
                  
              *   absolvované workshopy alebo kratšie kurzy z oblasti danej terapie,
                  
              *   praktické skúsenosti z práce v zariadeniach, kde sa tieto prvky používajú.

                  

      ### Prečo niekto využíva len prvky, a nespraví si certifikáciu?


      Dôvody môžu byť rôzne:


      *   Niektorí odborníci sa cítia dostatočne kompetentní vďaka dlhoročným
      skúsenostiam a nemajú potrebu absolvovať formálnu certifikáciu,
          
      *   proces certifikácie je často časovo náročný — môže trvať od 2 do 5
      rokov v závislosti od druhu terapie,
          
      *   proces je zároveň finančne náročný.
          

      Nie každý má čas alebo finančné zdroje investovať do dlhodobého
      vzdelávania.


      3.  Ak už niekto tvrdí, že poskytuje konkrétnu terapiu, mal by to vedieť
      potvrdiť platným certifikátom od príslušnej inštitúcie. V našom katalógu
      miest podpory nájdete terapeutov s overenými certifikáciami pre niektoré
      typy terapií. Link na katalóg nájdete
      [**TU.**](https://kompasio.sk/app/sk/map/zoznam/?category%5B0%5D=zoznam-certifikovanych-terapeutov)
    uuid: f93dce67-5814-4155-91bc-81064b211d3e
  - title: Alternatívne terapie vs. vedecky podložené metódy
    body: >-
      Vo svete podpory detí s autizmom narazíme na široké spektrum terapií.
      Niektoré sú „**alternatívne“** — teda také, ktoré nemajú pevné vedecké
      dôkazy o účinnosti, no mnohí rodičia ich skúšajú, lebo veria, že môžu
      pomôcť.


      Na druhej strane máme **evidence-based terapie** — čo v preklade znamená
      „terapie podložené dôkazmi“. Tieto metódy prešli náročným vedeckým
      skúmaním, štúdiami, ktoré preukázali ich efektivitu a prínos. Medzi
      najznámejšie patria napríklad ABA (Applied Behavior Analysis), ESDM (Early
      Start Denver Model).


      A teraz to najdôležitejšie — každé dieťa je unikát, a to, čo funguje u
      jedného, nemusí fungovať u druhého. Je to ako hľadať správny kľúč do zámku
      – nie každý kľúč pasuje do každých dverí. Niekedy chvíľu trvá, kým nájdeme
      ten správny, ale keď zapadne, všetko začne dávať zmysel.
    uuid: e1e4c591-169f-460e-8c4b-502b6540b8b4
  - title: Je potrebné vyskúšať všetko naraz? Panebože, NIE!
    body: >-
      ### A teraz vážne.


      V tejto džungli terapií sa ľahko stratíme, no nejde o to, že by sme mali
      skúšať všetko naraz.


      Ak chceš naučiť svoje dieťa hrať na klavír,nezačneš tým, že mu naraz
      vysvetlíš všetky druhy hudobných nástrojov, hodíš naňho učivo z
      dvojročného štúdia a dáš mu čítať noty na flautu — a pritom ho usadíš za
      klavír. Čistá katastrofa.


      Tu je dobré poradiť sa s odborníkmi — špeciálnymi pedagógmi, psychológmi,
      psychoterapeutmi, jednoducho s niekým, kto rozumie autizmu a vie posúdiť,
      čo by mohlo pomôcť práve vášmu dieťaťu. Každé dieťa je jedinečné a
      potrebuje riešiť iné oblasti.


      Je úplne v poriadku skúsiť jednu terapiu a ak sa neujme, vyskúšať inú. Nie
      je však rozumné aby dieťa absolvovalo 15 rôznych terapií počas jedného
      týždňa — to je ako keby si chcel, aby sa naučilo hrať na klavír, ale každú
      hodinu by si ho posielal na inú hudobnú skúšku na úplne iný nástroj.


      Radšej kvalitná a zameraná terapia než veľké množstvo náhodných pokusov.


      ### **🚨** Spozorni  

      Opakovaná rada mnohých rodičov z praxe


      Nezabúdajte, že ak sa snažíte „nastaviť“ čo najväčší počet terapií rôzneho
      druhu, nerobíte tým dobre ani sebe. Dieťa treba niekde vyzdvihnúť, riešiť
      logistiku, stráviť čas v priestoroch inštitúcie a potom zase logistiku
      späť domov. Vaša kapacita je rovnako obmedzená – potrebujete svoj priestor
      a čas na dobitie bateriek.


      Presne ako ovládač od PlayStationu alebo váš mobil. Mobil môže vydržať tri
      dni, ale vaše baterky sa s príchodom večera často dostávajú na úroveň 10
      %. Spánok nás síce opäť dobije (ak teda nie ste ten prípad, keď vaše dieťa
      skáče celú noc), ale je dôležité nájsť si čas aj pre seba – prechádzku v
      prírode, rozhovory s kamarátkami, háčkovanie alebo čokoľvek, čo máte radi.


      Výčitky, že ste mohli ten čas venovať cieleným terapiám? Verte, že rovnako
      dôležité je mať doma mamu ( alebo otca), ktorí majú zdroje – energiu,
      zdravie a psychickú pohodu.


      🟡\_Dobré vedieť:  

      Rodičia na pokraji zrútenia síce vedia objednať 6 terapií denne… ale
      poľahky zabudnú, kde zaparkovali auto.  

      Starajte sa o seba. Lebo keď vypadnete vy, vypadne celý systém. A ten
      systém... ste v tomto prípade vy.
    uuid: 9f1f4138-0208-4b57-a852-bac22b35c083
