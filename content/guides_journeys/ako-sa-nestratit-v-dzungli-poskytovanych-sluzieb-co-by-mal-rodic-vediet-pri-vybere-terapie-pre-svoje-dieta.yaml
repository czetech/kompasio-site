title: Ako sa nestratiť v džungli poskytovaných terapií
category: 0672d6e8-1771-46a1-9520-42437b3f2026
type: knowledge
description: >-
  Úvod do problematiky:  

  Čo by mal rodič vedieť pri výbere terapie pre svoje dieťa. Ponúkame základné
  informácie, ako sa lepšie zorientovať v spleti možností, ktoré existujú.
steps:
  - title: "100 + druhov terapií "
    body: >-
      Čim viac možností, tým je človek viac paralyzovaní.  

      Vybrať terapiu pre svoje dieťa môže byť ako vyraziť na výpravu do pralesa
      bez mapy — veľa ciest, nejasné značky. Neviete, ktorou cestou sa vybrať,
      nemáte kompas ani hodinky na sledovanie času. Aby toho nebolo málo, po
      ceste sa objavia rôzne prekážky v podobe nejasných termínov či neznámych
      certifikátov a používaných pojmov. Vezmime si mačetu a poďme sa presekať
      týmto pralesom.
    uuid: 39a31e6e-66e1-461a-89b1-fbd734ac754e
  - title: Workshopy, licencie, skúsenosti - aký je rozdiel?
    body: >-
      ### Aké možnosti vzdelávania majú odborníci:


      Pre lepšie pochopie, ako to môže vyzerať vo svete autizmu (v ponuke
      **<u>terapií</u>**) pozrime sa na to pomocou príkladov:


      1.  **Webináre, krátke kurzy a online nástroje**
          
          *   Jednou z možností je absolvovanie webinárov, 2–3-dňových kurzov či iných online vzdelávacích nástrojov.
              
          *   Je to ako zaplatiť si 2 týždňový kurz cyklistiky - naučia ťa základy, aké časti má bicykel, kde sú brzdy, alebo ako si vymeniť koleso. Ukážu ti, ako môžeš motivovať dieťa a možno sa tu naučíš 1-2 nové techniky, ktoré využiješ v praxi. Rozšíria ti vedomosti, ktoré máš, ale nespraví to z teba profesionálneho inštruktora.
              
          *   Dôležité v tomto prípade je, aké vzdelanie a skúseností má odborník už vo svojom porfóliu. Absolvovanie takýchto kurzov je jednoznačne obohacujúce a odborníci vďaka nim získavajú neustále nové poznatky.
              
          *   Zároveň tieto kurzy predstavujú dobrý základ pre odborníkov, ktorý chcú začať využívať novú metódu vo svojej praxi a radi by sa s danou metódou oboznámili.
              
          *   Tieto kurzy sú však limitujúce (časom a hĺbkou), preto je kľúčové pozerať sa na to, **kto** kurz absolvoval – nie len **že** ho absolvoval.

              
      2.  **Prax bez certifikácie**
          
          *   Ďalšou možnosťou sú odborníci s praxou, ale bez formálneho certifikátu.
              
          *   **Môžeš ísť o fakt skvelých odborníkov** - znalosti a skúsenosti sa naučili praxou, inšpirovali sa navzájom kolegami či kolegyňami, samoštúdiom alebo skúšaním rôznych techník. Možno absolvovali aj nejaký webinár alebo rýchlokurz.
              
          *   Títo odborníci si nespravili oficiálne kurz konkrétnej terapie, avšak môžu mať dlhoročné skúsenosti vďaka práci, ktorú vykonávali.
              
          *   Tu by mali rodičia sledovať okrem iného akú prax má za sebou daný človek a kde všade pôsobil - určite Vám to lepšie pomôže rozhodnúť sa, či si daného odborníka vyberiete alebo nie.

              

      Aj prvá aj druhá skupina odborníkov môže používať vo svojich popisoch
      _využívam "_**_<u>prvky"</u>_** _aba <u>terapie</u>, prvky muzikoterapie_
      a pod.).


      3.  **Dlhodobé certifikované tréningové programy**
          

      *   tu hovoríme už o systematickom, hĺbkovom odbornom vzdelávaní
      konkrétnej terapeutickej metódy (napr. muzikoterapia, artterapia, ABA
      terapia, ESDM model).
          
      *   Budúci odborník absolvuje teóriu, prax a supervíziu – a po splnení
      všetkých podmienok je **oprávnený poskytovať danú terapiu komplexne,
      profesionálne a v súlade so štandardmi**. Takéto programy bývajú časovo aj
      finančne náročné.
          

      ### 📌**Zhrnutie:**


      **Tak do akého lietadla by si nasadol?**


      *   S pilotom, ktorý mal víkendový kurz?
          
      *   S pilotom, ktorého učil jeho otec a starý otec?
          
      *   Alebo profesionálovi, ktorý prešiel certifikovaným výcvikom, má
      leteckú prax a jeho odbornosť overila nezávislá autorita?
          

      🟡Dobré vedieť:


      Ako pilot lietadla nesmie pilotovať lietadlo bez certifikátu, tak je to i
      s terapiami. Poskytovanie terapií je regulované a má svoje legislatívne
      pravidlá.


      *   Ten kto má certifikát, uvádza: _"poskytujem ABA terapiu,
      muzikuterapie, prípadne som certifikovaná ABA terapeutka a pod. "_
          
      *   Ten, kto certifikát nemá: uvádza: _"využívam prvky terapie ABA, prvky
      muzikoterapie, prvky programu TEACH."_
