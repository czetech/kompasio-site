steps:
  - title: "Druhy príspevkov "
    body: >-
      Ako sme si uviedli v časti [ŤZP - Úvod do
      problematiky,](https://kompasio-site-prod.apps.czetech.net/zivotne-situacie/status-tzp/5)
      nemáš síce automatický nárok na príspevky, ale je dobré orientovať sa v
      tom, čo vlastne existuje a bádať, či ti v tvojej životnej situácií vie
      štát nejako pomôcť.


      ### Rozdeľme si príspevky na 3 základné kategórie:


      *   Peňažné príspevky:
          
          *   na osobnú asistenciu,
              
          *   na kúpu, výcvik používania a úpravy pomôcky,
              
          *   na opravu pomôcky,
              
          *   na kúpu zvíhacieho zariadenia,
              
          *   na kúpu osobného motorového vozidla,
              
          *   na úpravu osobného motorového vozidla,
              
          *   na úpravu bytu, rodinného domu alebo garáže,
              
          *   na prepravu,
              
          *   na kompenzáciu zvýšených výdavkov,
              
          *   na opatrovanie

              
      *   Parkovací preukaz.
