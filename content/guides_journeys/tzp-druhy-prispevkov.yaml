title: ŤZP - Druhy príspevkov a zľavy
category: 0672d6e8-1771-46a1-9520-42437b3f2026
description: Základná orientácia v príspevkoch a o zľavách.
steps:
  - title: "Druhy príspevkov "
    body: >-
      Ako sme si uviedli v časti [<u>ŤZP - Úvod do
      problematiky,</u>](https://kompasio-site-prod.apps.czetech.net/zivotne-situacie/status-tzp/5)
      nemáš síce automatický nárok na príspevky, ale je dobré orientovať sa v
      tom, čo vlastne existuje a bádať, či ti v tvojej životnej situácií vie
      štát nejako pomôcť.


      ### Existujú napríklad:


      *   Peňažné príspevky:
          
          *   na osobnú asistenciu,
              
          *   na kúpu, výcvik používania a úpravy pomôcky,
              
          *   na opravu pomôcky,
              
          *   na kúpu zvíhacieho zariadenia,
              
          *   na kúpu osobného motorového vozidla,
              
          *   na úpravu osobného motorového vozidla,
              
          *   na úpravu bytu, rodinného domu alebo garáže,
              
          *   na prepravu,
              
          *   na kompenzáciu zvýšených výdavkov,
              
          *   na opatrovanie.

              
      *   Parkovací preukaz.
          

      **O každý z týchto príspevkov je potrebné žiadať, ako aj o parkovací
      preukaz, ak na ne, samozrejme, vzniká nárok.**  

      Aby sme nevytvárali článok pre článok a návod pre návod, podrobnejšie
      informácie si viete pozrieť na stránke [<u>Ministerstva práce, sociálnych
      vecí a
      rodiny</u>](https://www.employment.gov.sk/sk/rodina-socialna-pomoc/tazke-zdravotne-postihnutie),
      prípadne dobré spracovanie problematiky nájdete na stránkach [<u>Platformy
      rodín.</u>](https://www.platformarodin.sk/na-co-mam-narok/kompenzacie/)


      V ďalšej časi si povieme, čo sú to zľavy pre ŤZP.
    uuid: 26885a71-97ad-4263-8051-a97b1fd5aeab
  - title: "Zľavy pre ŤZP "
    body: >-
      👉Ak patríš medzi **držiteľov preukazu ŤZP,** určite nezabudni preveriť,
      či ti náhodou niekde „nesvieti“ zľava.  

      Štátne inštitúcie, ale aj niektorí súkromníci totiž poskytujú rôzne výhody
      a zľavy – od vstupov do múzeí, cez cestovné, až po lístky do kina (kde
      popcorn, žiaľ, ostáva za plnú sumu).  

      👉Ak máš zároveň i **parkovací preukaz ŤZP**, v tom prípade vieš uháňať po
      diaľnici zdarma. Teda... **ak si o to požiadaš**). Áno v dobe, keď zdanené
      sa opäť zdaňuje aj toto "zadarmo jazdenie" niečo stojí - minimálne čas,
      nervy a podpis v správnom políčku. Papieračiek – či už fyzických alebo
      digitálnych – nie je nikdy dosť\*\*💪\*\*.


      ### 👉Prečo sa poskytujú ŤZP zľavy?


      Nie každý má rovnaký štart ani rovnaké podmienky. Zľava preto nie je
      darček – má to byť **vyjadrenie rešpektu, uznania a ľudskej
      spolupatričnosti.** A ak sú tieto hodnoty za tým... tak nech ich je čo
      najviac.


      ### 👉Sú tieto zľavy dostatočné?


      Niekde máš pocit, že sa štát, alebo prevádzka naozaj snaží. Inde ti dajú
      „zľavu“, ktorú si musíš nájsť mikroskopom a pocítiť len na duši, nie v
      peňaženke.  

      Tak či onak – oplatí sa zisťovať, pýtať sa a sem-tam aj pripomenúť, že ŤZP
      nie je len zberateľským kúskom medzi dokladmi.


      ### Pre tvorcov cenových politík pre ŤZP , ŤZP-S


      Preukaz ŤZP **nie je len obyčajná zľavová karta**, ktorou si zákazník či
      návštevník pýta 5% z ceny dole ako pri vernostnom programe.


      ŤZP preukaz by mal byť **"kartou kartičiek"** – **lev medzi zľavami**.


      Prečo? **Lebo za týmto preukazom je realita, ktorú si väčšina ľudí ani
      nevie predstaviť.** Nie je o výhodách, ale o tom, že danému človeku a
      rodinu **tým hovoríme: "Vidím ťa."**


      Myslite na to pri nastavovaní svojich cenových politík.  

      Ak dokáže Ľubovniansky hrad pustiť vstup pre ŤZP za 0,10 € – a nemá z toho
      žiadny reálny náklad – určite **existuje spôsob**, ako to spraviť aj inde.


      Nie pre marketing. **Pre ľudskosť.**
    uuid: 49d3945d-698f-45d4-ad2b-6221e77edf8c
  - title: "Tvoríme ekosystém ŤZP zliav "
    body: >-
      ### 🔎 Posvietili sme si na zľavy pre našich ŤZP spoluobčanov


      👉 V aplikácii – **<u>link pridať</u>** - si môžete pozrieť, **kde
      "svieti" najväčšia zľava**. Niektoré inštitúcie ponúkajú vstupné takmer
      zadarmo, inde ti aspoň ušetria na kávičku po ceste.


      Máš tip na miesto, kde sa s ŤZP zľavou zaobchádza ako s pokladom? 💎  

      Podeľ sa s nami – **pridáme toto miesto do aplikácie** a spoločne pomôžeme
      ďalším, ktorí nechcú zľavy hľadať ako pokémonov.


      Hľadanie bude potom **rýchle, jednoduché a prehľadné** –  

      keď ani život nie je ako jazda po pohodlnej diaľnici bez výtlkov
      (nehovoríme o našej diaľnici), tak nech aspoň **naša aplikácia drží SMER ,
      rýchlosť.. a pokojne aj tú garanciu**😏.
    uuid: b2b74cdc-c304-4a91-bc31-1957d0b72368
