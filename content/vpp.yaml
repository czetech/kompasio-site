  1.  **VÝKLAD POJMOV**
      
      1.  Na účely týchto všeobecných obchodných podmienok sa rozumie:
          
          |     |     |
          | --- | --- |
          | **Autorský zákon** | znamená zákon č. 185/2015 Z. z. Autorský zákon v znení neskorších predpisov. |
          | **Aplikácia** | znamená webovú aplikáciu Kompasio, ktorá slúži na vyhľadávanie bodov záujmu pre autistov resp. osoby s poruchou autistického spektra (PAS) ako napríklad diagnostické a intervenčné centrá, terapie, lekárov, školy, škôlky, dss a css, záujmové a voľnočasové aktivity. V aplikácií sú uvedené aj digitálne, informačné a online zdroje týkajúce sa témy PAS, ako napr. apky, diskusné skupiny, online komunity, knihy, publikácie, filmy a iné. |
          | **Dielo** | znamená akékoľvek autorské dielo (napr. knižná publikácia, článok) chránené Autorským zákonom, ku ktorému vykonáva majetkové práva autorov Poskytovateľ. |
          | **Emailová adresa Poskytovateľa** | znamená e-mailovú adresu [info@modrahliadka.sk](mailto:info@modrahliadka.sk) |
