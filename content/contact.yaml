title: Kontakt
body: >-
  to co som chcel doplniť na ku tomu kontaktu, chodi relativne dost mailov,
  ktore chcu riesit nieco, naco uz mame ine flowy, preto by som tam chcel mat
  nieco cca taketo:


  *   Ak chcete nahlásiť chybu/zmenu údajov, použite tlačidlo Nahlásiť problém
  pri konkrétnom mieste.
      
  *   Ak chcete navrhnúť pridanie nového miesta, kliknite prosím sem (link na
  form, co je aj vo footri)
      
  *   Vieme do tej casti nas vizitku pridat nejake textove/wysiwyg pole, ktoreho
  text si editujeme v CMS?
      

  Mozno to bude vyzerat zle, a nakoniec tam nic nedame, ale skusil by som to!
cardTitle: Kontaktujte nás
emailLabel: Aplikáciu Kompasio Vám s 🤍 prináša Modrá hliadka
emailAddress: kompasio@modrahliadka.sk
