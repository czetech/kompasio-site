title: GDPR
body: >-
  <h3 style="text-align: center"><strong>OZNÁMENIE O&nbsp;SPRACÚVANÍ OSOBNÝCH
  ÚDAJOV</strong></h3><p style="text-align: center">(ďalej len
  „<strong>Oznámenie</strong>“)</p>


  **Modrá hliadka**, občianske združenie so sídlom Karpatské námestie 7770/10A,
  831 06 Bratislava-Rača, Slovenská republika, IČO: 54 798 841, registračné
  číslo: VVS/1-900/90-64396 (ďalej len „**Združenie**“) je prevádzkovateľom
  osobných údajov, ktoré poskytnete Združeniu pri používaní webovej stránky
  [<u>https://modrahliadka.sk/</u>](https://modrahliadka.sk/) (ďalej len
  „**Portál**“), webovej aplikácie Kompasio dostupnej na
  [<u>https://kompasio.sk/app/sk/map/</u>](https://kompasio.sk/app/sk/map/)
  (ďalej len „**Aplikácia**“) alebo pri poskytovaní podpory Združeniu. Združenie
  zároveň vystupuje ako prevádzkovateľ osobných údajov vo vzťahu k osobným
  údajom, ktoré mu poskytnete v rámci plnenia zmluvného vzťahu.
