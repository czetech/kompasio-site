title: GDPR
body: >-
  <h3 style="text-align: center"><strong>OZNÁMENIE O&nbsp;SPRACÚVANÍ OSOBNÝCH
  ÚDAJOV</strong></h3><p style="text-align: center">(ďalej len
  „<strong>Oznámenie</strong>“)</p>


  <p style="text-align: justify"><strong>Modrá hliadka</strong>,<strong>
  </strong>občianske združenie so sídlom Karpatské námestie 7770/10A, 831 06
  Bratislava-Rača, Slovenská republika, IČO: 54 798 841, registračné číslo:
  VVS/1-900/90-64396 (ďalej len „<strong>Združenie</strong>“) je
  prevádzkovateľom osobných údajov, ktoré poskytnete Združeniu pri používaní
  webovej stránky <a
  href="https://modrahliadka.sk/"><u>https://modrahliadka.sk/</u></a> (ďalej len
  „<strong>Portál</strong>“), webovej aplikácie Kompasio dostupnej na <a
  href="https://kompasio.sk"><u>https://kompasio.sk/</u> </a>(ďalej len
  „<strong>Aplikácia</strong>“) alebo pri poskytovaní podpory Združeniu.
  Združenie zároveň vystupuje ako prevádzkovateľ osobných údajov vo vzťahu
  k&nbsp;osobným údajom, ktoré mu poskytnete v rámci plnenia zmluvného
  vzťahu.</p><p style="text-align: justify">V&nbsp;tomto Oznámení Združenie
  poskytuje informácie o&nbsp;tom: &nbsp;</p>


  *   ako získava a spracúva osobné údaje poskytnuté pri používaní Portálu,
  Aplikácie alebo poskytnutí podpory,
      
  *   ako získava a spracúva osobné údaje o zmluvných partneroch, a
      
  *   aké sú práva dotknutých osôb v súvislosti so spracúvaním ich osobných
  údajov a ako si tieto práva môžu uplatniť.
      

  <p style="text-align: justify">Spracúvanie osobných údajov sa uskutočňuje v
  súlade s Nariadením Európskeho parlamentu a Rady (EÚ) 2016/679 z 27. apríla
  2016 o ochrane fyzických osôb pri spracúvaní osobných údajov a o voľnom pohybe
  týchto údajov a o zrušení smernice 95/46/ES (ďalej len
  „<strong>GDPR</strong>“), a&nbsp;so zákonom č. 18/2018 Z. z. o ochrane
  osobných údajov a o zmene a doplnení niektorých zákonov (ďalej len
  „<strong>Zákon</strong>“).</p>


  1.  **PRE KOHO JE URČENÉ TOTO OZNÁMENIE**
      
      <p style="text-align: justify">Informácie uvedené v&nbsp;tomto Oznámení sú určené pre návštevníkov Portálu, používateľov Aplikácie, podporovateľov Združenia a&nbsp;zmluvných partnerov Združenia. &nbsp;</p>


  2.  **AKO MÔŽETE KONTAKTOVAŤ ZDRUŽENIE**
      
      <p style="text-align: justify">Združenie môžete kontaktovať v prípade akýchkoľvek otázok týkajúcich sa spracúvania Vašich osobných údajov, emailom na:<a href="mailto:gdpr@modrahliadka.sk">gdpr@modrahliadka.sk</a></p>


  3.  **ÚČEL, PRÁVNY ZÁKLAD, KATEGÓRIE OSOBNÝCH ÚDAJOV A DOBA UCHOVÁVANI**
      
      |     |     |     |     |
      
      | --- | --- | --- | --- |
      
      | **ÚČEL SPRACÚVANIA** | **PRÁVNY ZÁKLAD SPRACÚVANIA** | **KATEGÓRIE OSOBNÝCH ÚDAJOV** | **DOBA UCHOVÁVANIA** |
      
      | Uzatváranie a plnenie rámcových zmlúv o poskytovaní služieb | Plnenie zmluvy podľa článku 6 ods. 1 písm. b) GDPR (fyzické osoby – podnikatelia)<br><br>Oprávnený záujem podľa článku 6 ods. 1 písm. f) GDPR (právnické osoby). | Meno, priezvisko, email, spoločnosť, funkcia. | Počas trvania zmluvného vzťahu s poskytovateľom služby. |
      
      | Uzatváranie darovacích zmlúv | Plnenie zmluvy podľa článku 6 ods. 1 písm. b) GDPR.<br><br>(fyzické osoby)<br><br>Oprávnený záujem podľa článku 6 ods. 1 písm. f) GDPR (právnické osoby). | Meno, priezvisko, rodné priezvisko, trvalý pobyt, dátum narodenia, rodné číslo, štátna príslušnosť, funkcia, e-mail. | 4 roky odo dňa uzatvorenia zmluvy. |
      
      | Zasielanie newslettra | Súhlas dotknutej osoby v zmysle článku 6 ods.<br><br>1 písm. a) Nariadenia GDPR. | E-mail. | Do odvolania súhlasu, maximálne však po dobu 5 rokov odo dňa udelenia súhlasu. |
      
      | Registrácia v Aplikácii | Plnenie zmluvy podľa článku 6 ods. 1 písm. b) GDPR | Meno, priezvisko, email a heslo. | Do zrušenia konta v Aplikácii. |
      
      | Vybavovanie sťažností | Plnenie zákonnej povinnosti podľa článku 6 ods. 1 písm. c) GDPR. | Meno a priezvisko, email, osobné údaje uvedené v sťažnosti. | Do vyriešenia sťažnosti. |
      
      | Uplatnenie práv dotknutých osôb (podania). | Plnenie zákonnej povinnosti podľa článku 6 ods. 1 písm. c) GDPR. | Meno, priezvisko, bydlisko, dátum narodenia prípadne iný údaj na riadne overenie identifikácie dotknutej osoby. | 2 roky po vybavení žiadosti dotknutej osoby. |
      
      | Evidencia porušení ochrany osobných údajov. | Splnenie zákonnej povinnosti podľa článku 6 ods. 1 písm. c) GDPR. | Osobné údaje dotknuté porušením ochrany osobných údajov. | Počas doby trvania Združeniu. |
      
      | Preukazovanie, uplatňovanie a obhajovanie právnych nárokov Združeniu. | Oprávnený záujem podľa článku 6 ods. 1 písm. f) GDPR. | Bežné osobné údaje. | Do právoplatného skončenia nároku, ktorý sa preukazuje, uplatňuje alebo obhajuje. |


  4.  **AKÉ OPRÁVNENÉ ZÁUJMY VYUŽÍVA ZDRUŽENIE?**
      
      <p style="text-align: justify">Na oprávnené záujmy sa Združenie spolieha v&nbsp;prípade súdnych alebo mimosúdnych sporov alebo v&nbsp;konaniach s&nbsp;orgánmi verejnej moci, pri ktorých uplatňuje alebo bráni svoje právne nároky.&nbsp; &nbsp;</p><p style="text-align: justify">Združenie na základe oprávneného záujmu tiež spracúva osobné údaje kontaktných osôb alebo iných osôb oprávnených konať za alebo v&nbsp;mene zmluvných partnerov alebo podporovateľov.</p>


  5.  **SPRÍSTUPŇOVANIE  OSOBNÝCH ÚDAJOV**
      
      |     |     |     |
      
      | --- | --- | --- |
      
      | **Oblasť/Služba** | **Príjemca osobných údajov** | **Prenos mimo EHP** |
      
      | Platobná brána | Stripe Technology Europe, Limited | Áno (USA)<br><br>Prenos na základe zmluvy o spracúvaní osobných údajov (DPA) a rozhodnutia o primeranosti týkajúce sa rámca pre ochranu osobných údajov medzi EÚ a USA. |


  6.  **PRENOS OSOBNÝCH ÚDAJOV DO TRETÍCH KRAJÍN ALEBO MEDZINÁRODNÝCH
  ORGANIZÁCIÍ**
      
      <p style="text-align: justify">Pri spracúvaní osobných údajov sa Združenie snaží minimalizovať akýkoľvek prenos osobných údajov mimo Európskeho hospodárskeho priestoru (EHP). Pri prevádzkovaní Aplikácie však Združenie využíva aj globálnych poskytovateľov služieb, ktorí môžu prenášať osobné údaje aj mimo územia EHP. V&nbsp;týchto prípadoch Združenie zabezpečí, aby boli splnené podmienky GDPR pre takéto spracúvanie a&nbsp;prenos uskutoční len na základe existencie rozhodnutia Európskej komisie o&nbsp;primeranosti podľa článku 45 GDPR (napr. rozhodnutie o&nbsp;primeranosti týkajúce sa rámca pre ochranu osobných údajov medzi EÚ a&nbsp;USA) &nbsp;alebo na základe štandardných doložiek o&nbsp;ochrane údajov podľa článku 46 ods. 2 GDPR (napr. prenosy do USA).&nbsp;</p>


  7.  **AUTOMATIZOVANÉ INDIVIDUÁLNE ROZHODOVANIE A PROFILOVANIE**
      
      <p style="text-align: justify">Pri spracúvaní osobných údajov Združenie nevyužíva automatizované rozhodovanie ani profilovanie.</p>


  8.  **ZÍSKAVANIE OSOBNÝCH ÚDAJOV**
      
      **Združenie spracúva najmä osobné údaje, ktoré jej poskytnú priamo používatelia alebo podporovatelia. Bez poskytnutia osobných údajov by nebolo možné platne uzatvoriť zmluvný vzťah alebo by Vám Združenie nemohlo zasielať newsletter.**


  9.  **PRÁVA DOTKNUTÝCH OSÔB**
      
      <p style="text-align: justify">&nbsp;&nbsp;&nbsp;&nbsp; Ak Združenie spracúva osobné údaje na základe Vášho súhlasu, máte právo kedykoľvek svoj súhlas odvolať zaslaním emailu na: <a href="mailto:info@headranking.sk"><u>info@headranking.sk</u></a> &nbsp;Odvolanie súhlasu nemá vplyv na zákonnosť spracúvania vychádzajúceho zo súhlasu pred jeho odvolaním.</p><p style="text-align: justify">&nbsp;&nbsp;&nbsp;&nbsp; Bez ohľadu na to máte právo kedykoľvek namietať proti spracúvaniu osobných údajov na základe oprávneného alebo verejného záujmu, ako aj na účely priameho marketingu vrátane profilovania.</p>
      
      Okrem vyššie uvedených práv máte právo za podmienok ustanovených v GDPR:
      
      *   požadovať prístup k osobným údajom, ktoré sa Vás týkajú;
          
      *   požadovať opravu nesprávnych osobných údajov, ktoré sa Vás týkajú;
          
      *   na vymazanie Vašich osobných údajov;
          
      *   na obmedzenie spracúvania Vašich osobných údajov;
          
      *   na prenosnosť Vašich osobných údajov;
          
      *   podať sťažnosť Úradu na ochranu osobných údajov Slovenskej republiky, Hraničná 12, Bratislava, email: [<u>dozor@pdp.gov.sk</u>](mailto:dozor@pdp.gov.sk).
      
      Svoje práva môžete uplatniť pomocou kontaktných údajov Spoločností uvedených v časti II. tohto Oznámenia. Združenie upozorňuje, že je oprávnená požiadať dotknutú osobu o overenie jej totožnosti pred zaslaním odpovede na jej žiadosť.


  10. **ZMENY OZNÁMENIA**
      
      <p style="text-align: justify">Združenie si vyhradzuje právo na úpravu a&nbsp;zmenu Oznámenia. Akékoľvek zmeny tohto Oznámenia nadobudnú účinnosť po ich zverejnení na Portáli alebo v&nbsp;Aplikácii.</p>
