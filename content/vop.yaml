title: "VOP "
body: >-
  <h3 style="text-align: center"><strong>PRAVIDLÁ POUŽÍVANIA PORTÁLU
  A&nbsp;OBCHODNÉ PODMIENKY</strong></h3><p style="text-align: center">webového
  portálu <a
  href="https://modrahliadka.sk/"><u>https://modrahliadka.sk/</u></a></p>


  **Poskytovateľ:**


  |     |     |

  | --- | --- |

  | Názov organizácie | **Modrá hliadka** |

  | Právna forma | Občianske združenie |

  | IČO | 54 798 841 |

  | Sídlo | Karpatské námestie 7770/10A, 831 06 Bratislava-Rača |

  | Registračné číslo | VVS/1-900/90-64396 |

  | E-mail | [info@modrahliadka.sk](mailto:info@modrahliadka.sk) |


  1.  **VÝKLAD POJMOV**
      
      1.  Na účely týchto všeobecných obchodných podmienok sa rozumie:
          
          |     |     |
          | --- | --- |
          | **Autorský zákon** | znamená zákon č. 185/2015 Z. z. Autorský zákon v znení neskorších predpisov. |
          | **Aplikácia** | znamená webovú aplikáciu Kompasio, ktorá slúži na vyhľadávanie bodov záujmu pre autistov resp. osoby s poruchou autistického spektra (PAS) ako napríklad diagnostické a intervenčné centrá, terapie, lekárov, školy, škôlky, dss a css, záujmové a voľnočasové aktivity. V aplikácií sú uvedené aj digitálne, informačné a online zdroje týkajúce sa témy PAS, ako napr. apky, diskusné skupiny, online komunity, knihy, publikácie, filmy a iné. |
          | **Dielo** | znamená akékoľvek autorské dielo (napr. knižná publikácia, článok) chránené Autorským zákonom, ku ktorému vykonáva majetkové práva autorov Poskytovateľ. |
          | **Emailová adresa Poskytovateľa** | znamená e-mailovú adresu [info@modrahliadka.sk](mailto:info@modrahliadka.sk) |
          | **Emailová adresa Používateľa** | znamená e-mailovú adresu, ktorú Používateľ poskytol Poskytovateľovi. |
          | **Modrá loptička** | znamená modrú antistresovú loptičku na každodenné použitie, ktorú Poskytovateľ venuje Podporovateľom v súlade s článkom 9.6 týchto VOP. |
          | **Občiansky zákonník** | znamená zákon č. 40/1964 Zb. Občiansky zákonník, v znení neskorších predpisov. |
          | **Obchodný zákonník** | znamená zákon č. 513/1991 Zb. Obchodný zákonník, v znení neskorších predpisov. |
          | **Podporovateľ** | znamená fyzickú alebo právnickú osobu, ktorá sa rozhodla podporiť Poskytovateľa v súlade s článkom 9 týchto VOP. |
          | **Portál** | znamená webový portál [www.modrahliadka.sk](http://www.modrahliadka.sk), ktorý prevádzkuje Poskytovateľ. |
          | **Poskytovateľ** | znamená občianske združenie Modrá hliadka, ktorá je poskytovateľom Služieb prostredníctvom Portálu a prevádzkovateľom Aplikácie. |
          | **Používateľ** | znamená fyzickú alebo právnickú osobu, ktorá používa Aplikáciu, využíva Portál alebo je príjemcom iných služieb, ktoré poskytuje Poskytovateľ. Na účely týchto VOP sa za Používateľa považuje aj Podporovateľ. |
          | **Služby** | znamená služby poskytované Poskytovateľom prostredníctvom Portálu alebo Aplikácie, ktoré predstavujú najmä vyhľadávanie, spracovanie, zhromažďovanie a/alebo uchovávanie informácií a odborných článkov o PAS. |
          | **Strana** | znamená buď Používateľ, Poskytovateľ alebo Podporovateľ. |
          | **VOP** | znamená tieto všeobecné obchodné podmienky. |
          | **Zmluva** | znamená darovaciu zmluvu, na základe ktorej Podporovateľ daruje Poskytovateľovi finančný alebo iný dar. |

          
  2.  **VŠEOBECNÉ USTANOVENIA**
      
      1.  Tieto VOP stanovujú podmienky a pravidlá používania Portálu, Aplikácie ako aj poskytovania podpory alebo darov Poskytovateľovi. VOP sú záväzné pre Poskytovateľa aj Používateľov.
          
      2.  Každý Používateľ je povinný oboznámiť sa s týmito VOP pri prvom vstupe na Portál alebo pred začatím používania Aplikácie. Používaním Portálu a/alebo Aplikácie Používateľ vyjadruje svoj súhlas s týmito VOP.
          
      3.  Služby poskytované Poskytovateľom sú dostupné jednotlivým Používateľom bezplatne a ich používanie nie je podmienené registráciou.

          
  3.  **ZÁKLADNÉ PODMIENKY VYUŽÍVANIA SLUŽIEB**
      
      1.  Používatelia, ktorí nesúhlasia s týmito VOP, nie sú oprávnení používať Portál, Aplikáciu alebo prijímať akúkoľvek inú službu od Poskytovateľa.
          
      2.  Používanie Portálu a Aplikácie nie je podmienené registráciou.
          
      3.  Pokiaľ Používateľ v súvislosti s využívaním Služieb poskytne Poskytovateľovi elektronicky alebo akýmkoľvek iným spôsobom svoje názory, prejavy, podnety, pripomienky, texty, obrázky, videá, články alebo iné príspevky (ďalej len „**Príspevky**“), týmto súhlasí so zverejnením a ďalším šírením Príspevkov Poskytovateľom na Portáli, v Aplikácií, na sociálnych sieťach prípadne iných miestach  pre účely propagácie vlastnej činnosti Poskytovateľa. V prípade, ak sa na obsah Príspevkov vzťahuje právna ochrana duševného vlastníctva, Používateľ týmto v súlade s Autorským zákonom udeľuje Prevádzkovateľovi bezodplatne nevýhradný, ďalej prenositeľný, vecne a miestne neobmedzený súhlas na použitie Príspevkov. Platnosť uvedeného súhlasu v zmysle Autorského zákona je udelená na celú dobu trvania majetkových práv autora k Príspevku.

          
  4.  **PODMIENKY POUŽÍVANIA APLIKÁCIE**
      
      1.  Aplikácia je prístupná každému Používateľovi na webovej stránke [<u>https://kompasio.sk/app/sk/map/</u>](https://kompasio.sk/app/sk/map/). Používanie Aplikácie nie je podmienené registráciou Používateľa.
          
      2.  Používateľ sa môže v Aplikácii zaregistrovať a vytvoriť si účet prostredníctvom svojho konta na Facebooku, Google alebo Apple, prípadne zadaním svojho mena, e-mailu a hesla. V druhom prípade je nevyhnutné potvrdiť pravosť e-mailovej adresy prostredníctvom aktivačného e-mailu, ktorý bude zaslaný na Emailovú adresu Používateľa.
          
      3.  Používateľ môže používať Aplikáciu len na účel, na ktorý je určená a spôsobom, ktorý zodpovedá jej riadnemu užívaniu.
          
      4.  Používateľ je výlučne zodpovedný za všetky činnosti, ktoré vykonáva používaním Aplikácie.
          
      5.  Používateľ je povinný pri používaní Aplikácie dodržiavať tieto VOP, platné právne predpisy, konať poctivo a v súlade s dobrými mravmi. Používateľ je tiež povinný správať sa vždy tak, aby nedošlo k poškodeniu dobrého mena Poskytovateľa alebo k vzniku akejkoľvek ujmy na strane Poskytovateľa.
          
      6.  Poskytovateľ sa zaväzuje s prihliadnutím na najnovšie poznatky zabezpečiť, aby všetky informácie uložené prostredníctvom Aplikácie, boli dostatočne chránené pred stratou, zničením, narušením či prípadným ich zneužitím, neoprávneným sprístupnením, poskytnutím, zverejnením alebo inou nedovolenou či protiprávnou operáciou.

          
  5.  **POUŽÍVANIE OBSAHU ZVEREJNENĚHO NA PORTÁLI ALEBO V APLIKÁCII**
      
      1.  Obsah Portálu a Aplikácie je výlučne určený pre osobné a nekomerčné použitie. Používateľ berie na vedomie, že Poskytovateľ je jediným vlastníkom všetkého obsahu na Portáli a v Aplikácii vrátane autorských práv, ochranných známok, obchodných názvov, loga a iných chránených označení a práv duševného vlastníctva k nim, ako aj textovej zložky, fotografií, obrázkov, grafiky, zvukových a zvukovoobrazových záznamov a iného materiálu, ktorý je na nich publikovaný.
          
      2.  Výňatky z obsahu Portálu alebo Aplikácie si Používateľ môže kopírovať, sťahovať a tlačiť len pre svoje osobné a nekomerčné použitie v medziach ustanovených pre výnimky z ochrany v zmysle príslušných ustanovení Autorského zákona, za predpokladu, že bude dodržiavať všetky upozornenia na autorské práva, ochranné známky alebo iné obmedzenia použitia akomkoľvek používanom obsahu Prevádzkovateľa.
          
      3.  Obsah Portálu je chránený právami duševného vlastníctva, a to najmä autorským právom a právom na ochranu obchodného mena. Poskytovateľ je jediným výlučným nositeľom akýchkoľvek práv duševného vlastníctva k obsahu Portálu, pričom je oprávnený udeľovať súhlas s výkonom práv duševného vlastníctva súvisiacich s obsahom portálu podľa Autorského zákona. Neoprávnené použitie obsahu Portálu, Aplikácie alebo použitie akéhokoľvek Diela v rozpore s licenčnými podmienkami uvedenými v článku 11 VOP ktoroukoľvek osobou bez písomného súhlasu Poskytovateľa bude mať za následok porušenie autorského práva Poskytovateľa a môže naplniť znaky skutkovej podstaty trestného činu porušovania autorského práva podľa ustanovenia § 283 zákona č. 300/2005 Z. z. Trestný zákon v znení neskorších predpisov. V takomto prípade vzniká Poskytovateľovi nárok na náhradu škody, ktorá mu bola takýmto konaním spôsobená, prípadne má Poskytovateľ nárok na uplatnenie ďalších práv, ktoré mu vyplývajú z Autorského zákona a iných právnych predpisov.

          
  6.  **OCHRANA OSOBNÝCH ÚDAJOV**
      
      1.  Poskytovateľ môže pri prevádzkovaní Aplikácie alebo Portálu spracúvať osobné údaje používateľov v pozícii prevádzkovateľa osobných údajov, ktorý určuje účel a prostriedky spracúvania osobných údajov.
          
      2.  Podrobný popis ako Poskytovateľ spracúva a chráni osobné údaje Používateľov je uvedený na Portáli alebo v Aplikácii v sekcii Ochrana osobných údajov.

          
  7.  **DOSTUPNOSŤ APLIKÁCIE A TECHNICKÁ PODPORA**
      
      1.  Poskytovateľ poskytuje nepretržitú dostupnosť Aplikácie s výnimkou vopred oznámených odstávok potrebných najmä na vykonanie pravidelných aktualizácií, updatov, resp. vylepšovaní funkcionalít Aplikácie alebo s výnimkou iných náhodných udalostí, ktoré nastali bez zavinenia alebo vôle Poskytovateľa. Používateľ berie na vedomie, že dostupnosť môže byť obmedzená a/alebo vylúčená, a to napríklad z dôvodu potreby pravidelných aktualizácií, updatov, resp. vylepšovaní funkcionalít Aplikácie alebo z dôvodu iných náhodných udalostí, ktoré nastali bez zavinenia a/alebo vôle Poskytovateľa.
          
      2.  Používateľ môže zaslať Poskytovateľovi požiadavku na technickú podporu na emailovú adresu [info@kompasio.sk](mailto:info@kompasio.sk). Keďže Poskytovateľ udeľuje Používateľovi Licenciu bezodplatne, Používateľ nemá právny nárok na poskytovanie technickej podpory. Poskytovateľ tiež môže odmietnuť poskytnúť technickú podporu, ak Používateľ neposkytne Poskytovateľovi potrebnú súčinnosť.

          
  8.  **ZODPOVEDNOSŤ POSKYTOVATEĽA ZA VADY A ŠKODU**
      
      1.  Poskytovateľ nezodpovedá za žiadne vady Portálu alebo Aplikácie, keďže sa poskytujú Používateľovi bezodplatne.
          
      2.  Poskytovateľ nenesie žiadnu zodpovednosť za prípadné škody spôsobené Používateľovi nedovoleným alebo nesprávnym používaním Aplikácie.
          
      3.  Poskytovateľ žiadnym spôsobom nezodpovedá za obsah, správnosť ani úplnosť informácií uložených, získaných, zhromaždených alebo generovaných na Portáli alebo v Aplikácii.
          
      4.  Poskytovateľ nie je povinný overovať pravdivosť, presnosť alebo úplnosť akýchkoľvek informácií, ktoré sú zverejnené na Portáli alebo v Aplikácii.
          
      5.  Používateľ má právo zasielať Poskytovateľovi e-mailom požiadavky týkajúce sa používania Aplikácie alebo Portálu. Poskytovateľ spravidla vybaví každú požiadavku v lehote 5 pracovných dní. Uvedená lehota sa môže predĺžiť v závislosti od počtu požiadaviek a komplexnosti samotnej požiadavky. Ak Používateľ nie je spokojný so spôsobom, ktorým Poskytovateľ vybavil jeho požiadavku alebo sa domnieva, že Poskytovateľ porušil jeho práva, Používateľ má právo obrátiť sa na Poskytovateľa so žiadosťou o nápravu. Ak Poskytovateľ na žiadosť Používateľa podľa predchádzajúcej vety odpovie zamietavo alebo na takúto žiadosť neodpovie v lehote do 30 dní odo dňa jej odoslania Používateľom, Používateľ má právo podať návrh na začatie alternatívneho riešenia sporu podľa ustanovenia § 12 Zákona alternatívnom riešení spotrebiteľských sporov. Príslušným orgánom alternatívneho riešenia sporov je Slovenská obchodná inšpekcia ([https://www.soi.sk/sk/alternativne-riesenie-spotrebitelskych-sporov.soi](https://www.soi.sk/sk/alternativne-riesenie-spotrebitelskych-sporov.soi)).

          
  9.  **LICENČNÉ PODMIENKY**
      
      1.  Poskytovateľ udeľuje Používateľovi súhlas na používanie Aplikácie (ďalej len „**Licencia**“) a Používateľ potvrdením týchto VOP vyjadruje súhlas s podmienkami Licencie uvedenými nižšie:
          
          1.  **Spôsob použitia Aplikácie:** Klient je oprávnený Aplikáciu používať len pre svoje vlastné nekomerčné použitie.
              
          2.  **Rozsah Licencie:** Licencia je vecne obmedzená len na vlastné nekomerčné použitie Používateľa a teritoriálne je neobmedzená.
              
          3.  **Trvanie Licencie:** Licencia je udelená na dobu trvania majetkových práv Poskytovateľa k Aplikácii.
              
          4.  **Odplatnosť Licencie:** Licencia sa udeľuje bezodplatne.
              
          5.  **Licencia je nevýhradná**. Poskytovateľ je oprávnený udeliť licenciu akýmkoľvek ďalším osobám.
              
          6.  Používateľ nie je oprávnený vykonávať akékoľvek úpravy Aplikácie, ako aj Aplikáciu spracovať alebo zahrnúť Aplikáciu do iného diela, ktoré sa tak môže stať súčasťou nového diela.

              
  10. **PODPORA**
      
      1.  Podporovateľ má možnosť podporiť Poskytovateľa rôznymi formami podpory, ktoré sú uvedené na Portáli v sekcii „Chcem podporiť“. Podpora môže zahŕňať:
          
          *   finančné dary,
              
          *   poukázanie podielu dane,
              
          *   poskytnutie grantu alebo dotácie,
              
          *   darovanie kryptomeny,
              
          *   darovanie vlastných produktov alebo poskytnutie služieb.
              
      2.  Finančný dar môže byť poskytnutý jednorazovo alebo formou pravidelných príspevkov prostredníctvom Apple Pay, Google Pay alebo platobnej karty. Minimálne sumy darov sú nasledovné:
          
          *   pravidelný dar: 10 EUR mesačne,
              
          *   jednorazový dar: 20 EUR.
              
      3.  Podporovateľ má právo kedykoľvek zrušiť pravidelnú finančnú podporu bez uvedenia dôvodu.
          
      4.  Podporovateľ môže Poskytovateľovi darovať aj Bitcoin prostredníctvom Lightning Network, pričom detailné inštrukcie sú dostupné na Portáli.
          
      5.  Podporovateľ môže Poskytovateľovi poukázať podiel zaplatenej dane. Podrobné informácie a formuláre na poukázanie podielu dane sú k dispozícii na Portáli.
          
      6.  Poskytovateľ odmení Podporovateľov, ktorí prispeli sumou minimálne 1 000 EUR, Modrými loptičkami za podmienok uvedených na stránke [<u>https://modrahliadka.sk/modra-lopticka/</u>](https://modrahliadka.sk/modra-lopticka/).
          
      7.  Ak si Podporovateľ želá formalizovať svoj dar, Poskytovateľ s ním na jeho požiadanie uzatvorí písomnú Zmluvu.

          
  11. **ZMENY VOP**
      
      1.  Poskytovateľ je oprávnený kedykoľvek uskutočňovať zmeny týchto VOP. Zmeny VOP je Poskytovateľ povinný bezodkladne po vykonaní týchto zmien oznámiť Používateľom, a to elektronicky zverejnením ich aktuálneho znenia na Portáli alebo v Aplikácii.

          
  12. **DORUČOVANIE**
      
      1.  Strany sa dohodli, že akékoľvek písomnosti súvisiace so Zmluvou  a týmito VOP sa budú doručovať elektronicky na e-mailové adresy Strán, pokiaľ tieto VOP neurčujú inak. Písomnosti sa považujú za doručené v deň ich odoslania z e-mailovej adresy jednej Strany na e-mailovú adresu druhej Strany, pokiaľ odosielateľ nedostane automatizovanú správu, že e-mail nebol doručený.

          
  13. **ZÁVEREČNÉ USTANOVENIA**
      
      1.  Tieto VOP sa riadia právnymi predpismi Slovenskej republiky. Právne vzťahy a práva a povinnosti Strán neupravené týmito VOP sa spravujú́ príslušnými všeobecne záväznými právnymi predpismi platnými a účinnými na území́ Slovenskej republiky, a to najmä̈ Občianskym zákonníkom a Autorským zákonom, v znení́ neskorších predpisov.
          
      2.  Všetky spory vyplývajúce z používania Aplikácie a týchto VOP alebo v súvislosti s používaním Aplikácie a týchto VOP budú s konečnou platnosťou rozhodnuté príslušnými súdmi Slovenskej republiky.
          
      3.  Neplatnosť niektorého ustanovenia týchto VOP nemá za následok neplatnosť celých VOP, okrem prípadu, ak ide o skutočnosť, s ktorou spája zákon takéto účinky. Poskytovateľ pre taký prípad vyhlasuje, že  neplatné ustanovenie bezodkladne nahradí iným, ktoré svojím obsahom a zmyslom zodpovedá najlepšie obsahu a zmyslu ustanovenia pôvodného ustanovenia.
          
      4.  Tieto VOP nadobúdajú platnosť a účinnosť dňom 25.11.20224.
