error_log stderr;
worker_processes auto;

events {
}

http {
  include /etc/nginx/mime.types;
  access_log /dev/stdout;
  gzip on;
  gzip_proxied any;
  server {
    listen 80;
    listen [::]:80;
    root /usr/share/nginx/html;
    location ~ ^(.+)/$ {
      return 301 $1;
    }
    location / {
      proxy_pass http://localhost:4321;
    }
  }
  server {
    listen 81;
    listen [::]:81;
    location / {
      proxy_pass https://kompas.cassiopea.sk;
      proxy_ssl_server_name on;
      proxy_set_header Host "kompas.cassiopea.sk";
      proxy_hide_header X-Frame-Options;
    }
  }
}
