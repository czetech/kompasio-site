{{- if .Values.httpRoute.enabled -}}
kind: HTTPRoute
apiVersion: gateway.networking.k8s.io/v1beta1
metadata:
  name: {{ include "kompasio-site.fullname" . }}-iframe
spec:
  parentRefs:
  - namespace: kube-system
    name: external-http
  hostnames:
  - kompasio-iframe-prod.apps.czetech.net
  rules:
  - backendRefs:
    - name: {{ include "kompasio-site.fullname" . }}-iframe
      port: 81
{{- end }}
