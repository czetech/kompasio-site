{{- if .Values.healthCheckPolicy.enabled -}}
apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: {{ include "kompasio-site.fullname" . }}-iframe
spec:
  default:
    config:
      type: HTTP
      httpHealthCheck:
        requestPath: /frontend/assets/css/reset.css
  targetRef:
    group: ""
    kind: Service
    name: {{ include "kompasio-site.fullname" . }}-iframe
{{- end }}
